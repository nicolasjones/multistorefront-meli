site_name: MSF · Documentación
site_description: Documentación de producto y técnica de MSF (multistorefront)
repo_url: https://github.com/nicolasjones/multistorefront-meli
repo_name: multistorefront-meli
copyright: MSF · multistorefront — documentación versionada con el código
docs_dir: docs
site_dir: site
use_directory_urls: true

# Documentos históricos con links fuera de docs/ (specs/AGENTS): se leen en GitHub, no en el sitio.
exclude_docs: |
  /roadmap-template.md
  /skills.md
  /disenar-conector.md

theme:
  name: material
  custom_dir: overrides
  language: es
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/storefront-outline
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro

extra_css:
  - stylesheets/msf.css
  - stylesheets/msf-app.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: es

extra_javascript:
  - https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js
  - javascripts/zoom-imagenes.js

