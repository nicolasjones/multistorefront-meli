site_name: MSF · Documentación
site_description: Documentación de producto y técnica de MSF (multistorefront)
docs_dir: docs
site_dir: site
use_directory_urls: true

# Documentos históricos con links fuera de docs/ (specs/AGENTS): se leen en GitHub, no en el sitio.
exclude_docs: |
  /roadmap-template.md
  /skills.md
  /disenar-conector.md

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: es

extra_javascript:
  - https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js

nav:
  - Inicio: index.md
  - Producto:
      - Qué es MSF: producto/README.md
      - Capacidades: producto/capacidades.md
      - Precios y dólar: producto/precios-dolar.md
      - Tiendas online: producto/tiendas-online.md
      - Dominio, identidad y vidriera: producto/tienda-dominio-e-identidad.md
      - Cuenta web del cliente: producto/cuenta-web-cliente.md
      - Perfil propio y cambio de contraseña: producto/perfil-propio.md
      - Solicitar acceso desde la pantalla restringida: solicitar-acceso.md
      - Consultas de las tiendas: producto/consultas.md
      - Avisos por correo y listas configurables: producto/avisos-y-listas.md
      - Ingreso de mercadería por proveedor: producto/ingreso-de-mercaderia.md
      - Glosario de negocio: producto/glosario.md
      - Service técnico (listado, ítems e impresión): producto/service-listado-items-impresion.md
  - Técnico:
      - Empezar: tecnico/README.md
      - Arquitectura: tecnico/arquitectura.md
      - Datos y DER: tecnico/datos.md
      - Service técnico (listado, ítems e impresión): tecnico/service-listado-items-impresion.md
      - Dólar y recálculo: tecnico/dolar-y-recalculo.md
      - Tienda pública: tecnico/tienda-catalogo-y-ficha.md
      - Dominio, identidad y catálogo visible: tecnico/tienda-dominio-e-identidad.md
      - Cuenta web del cliente: tecnico/cuenta-web-cliente.md
      - Perfil y permisos avanzados: tecnico/perfil-y-permisos.md
      - API y RPC: tecnico/api.md
      - Ingreso de mercadería por proveedor: tecnico/ingreso-de-mercaderia.md
      - Flujos: tecnico/flujos.md
      - Consultas: tecnico/consultas.md
      - Avisos y listas: tecnico/avisos-y-listas.md
      - Operación: tecnico/operacion.md
      - Runbooks: tecnico/runbooks/README.md
      - Sandbox: tecnico/sandbox.md
      - Onboarding: tecnico/onboarding.md
      - Decisiones (ADR): tecnico/adr.md
      - Biblioteca: tecnico/biblioteca.md
  - Changelog: changelog.md
  - Inventario: _generated/inventory.md
