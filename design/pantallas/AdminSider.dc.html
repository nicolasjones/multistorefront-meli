<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;color:#15181D;-webkit-font-smoothing:antialiased;}
*{box-sizing:border-box;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
.fh{font-family:'Sora',sans-serif;}
h1,h2,h3,p{margin:0;}
.t1{font-family:'Sora',sans-serif;font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.2;}
.t2{font-family:'Sora',sans-serif;font-size:18px;font-weight:600;letter-spacing:-.005em;line-height:1.3;}
.t3{font-family:'Sora',sans-serif;font-size:15px;font-weight:600;line-height:1.4;}
.b{font-size:14px;line-height:1.5;}
.bl{font-size:15px;line-height:1.5;}
.s{font-size:13px;line-height:1.45;color:#5F6670;}
.xs{font-size:12px;line-height:1.4;color:#5F6670;}
.mu{color:#5F6670;}
.num{font-variant-numeric:tabular-nums;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:9px;border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;background:transparent;color:#15181D;}
.btn.p{background:#2B55E6;color:#fff;}
.btn.o{border-color:#D9D8D2;background:#fff;}
.btn.g{color:#5F6670;}
.btn.d{background:#C62828;color:#fff;}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px;}
.btn.dis{opacity:.45;cursor:default;}
.ib{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:#5F6670;}
.ib.o{border-color:#D9D8D2;background:#fff;}
.card{background:#fff;border:1px solid #E6E5E0;border-radius:12px;}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1;}
.chip.n{background:#EEEDE8;color:#3B4048;}
.chip.p{background:#E4EAFD;color:#1E3FB8;}
.chip.ok{background:#E1F3E7;color:#146B35;}
.chip.w{background:#FCECD0;color:#7A4B00;}
.chip.e{background:#FBE2E2;color:#9B1C1C;}
.chip.i{background:#E2EFFA;color:#0B4F82;}
.chip.o{background:#fff;border:1px solid #D9D8D2;color:#5F6670;}
.chip.btn{cursor:pointer;height:32px;padding:0 14px;font-size:13px;border:1px solid #D9D8D2;background:#fff;color:#3B4048;}
.chip.btn.on{background:#15181D;color:#fff;border-color:#15181D;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#5F6670;text-align:left;padding:10px 16px;border-bottom:1px solid #E6E5E0;white-space:nowrap;}
.tbl td{font-size:14px;padding:12px 16px;border-bottom:1px solid #EEEDE8;vertical-align:middle;}
.tbl tr:last-child td{border-bottom:0;}
.tbl tr.neg td{background:#FFF6F6;}
.tbl tr.hi td{background:#F3F6FE;}
.r{text-align:right !important;}
.c{text-align:center !important;}
.fld{display:block;}
.fld .l{display:block;font-size:13px;font-weight:600;color:#3B4048;margin-bottom:6px;}
.fld .in{display:flex;align-items:center;gap:8px;height:40px;border:1px solid #D9D8D2;border-radius:9px;padding:0 12px;background:#fff;font-size:14px;color:#15181D;}
.fld .in.ml{height:auto;min-height:80px;align-items:flex-start;padding:10px 12px;}
.fld .in.err{border-color:#C62828;box-shadow:0 0 0 3px rgba(198,40,40,.12);}
.fld .in.dis{background:#F5F5F2;color:#8A9099;}
.fld .ph{color:#8A9099;}
.fld .h{font-size:12px;color:#5F6670;margin-top:5px;}
.fld .h.err{color:#C62828;}
.sw{position:relative;display:inline-block;width:40px;height:22px;border-radius:11px;background:#C9CBC6;flex-shrink:0;cursor:pointer;}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);}
.sw.on{background:#2B55E6;} .sw.on i{left:20px;}
.cb{display:inline-flex;align-items:center;gap:8px;font-size:14px;}
.cb i{width:18px;height:18px;border-radius:5px;border:1.5px solid #B9BCB6;background:#fff;display:inline-flex;align-items:center;justify-content:center;}
.cb.on i{background:#2B55E6;border-color:#2B55E6;}
.al{display:flex;gap:10px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.45;align-items:flex-start;}
.al.i{background:#E9F2FC;color:#0B4F82;} .al.i svg{fill:#0B4F82;}
.al.w{background:#FCF1DC;color:#6E4300;} .al.w svg{fill:#B36B00;}
.al.e{background:#FBE7E7;color:#8A1A1A;} .al.e svg{fill:#C62828;}
.al.ok{background:#E3F3E8;color:#155E36;} .al.ok svg{fill:#1E7A45;}
.tabs{display:flex;gap:4px;border-bottom:1px solid #E6E5E0;margin-bottom:20px;}
.tab{padding:10px 14px;font-size:14px;font-weight:600;color:#5F6670;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.on{color:#15181D;border-bottom-color:#15181D;}
.bar{height:6px;border-radius:3px;background:#EEEDE8;overflow:hidden;}
.bar i{display:block;height:100%;border-radius:3px;}
.thumb{width:40px;height:40px;border-radius:8px;border:1px solid #EEEDE8;background:#fff;object-fit:contain;flex-shrink:0;}
.thumb.e{display:flex;align-items:center;justify-content:center;background:#F5F5F2;}
.seg{display:inline-flex;border:1px solid #D9D8D2;border-radius:9px;overflow:hidden;background:#fff;}
.seg button{height:34px;padding:0 14px;border:0;background:transparent;font-size:13px;font-weight:600;color:#5F6670;cursor:pointer;}
.seg button.on{background:#15181D;color:#fff;}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#DCE4FB;color:#1E3FB8;font-weight:700;flex-shrink:0;}
.kpi{font-family:'Sora',sans-serif;font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1;}
.snack{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#15181D;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:40;display:flex;align-items:center;gap:10px;white-space:nowrap;}
.menu{position:absolute;background:#fff;border:1px solid #E6E5E0;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:6px;z-index:30;min-width:200px;}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:7px;font-size:14px;border:0;background:transparent;cursor:pointer;text-align:left;color:#15181D;}
.star{color:#C9CBC6;} .star.on{color:#E9A23B;}
.row{display:flex;flex-direction:row;} .stack{display:flex;flex-direction:column;}
</style>
</helmet>
<div style="width:232px;height:{{h}}px;background:#15181D;color:#E8E9EC;display:flex;flex-direction:column;font-family:'Instrument Sans',system-ui,sans-serif;">
  <a href="Main.dc.html" style="display:flex;align-items:center;gap:10px;padding:22px 20px 14px;">
    <span style="width:30px;height:30px;border-radius:9px;background:#2B55E6;display:inline-flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;font-size:14px;color:#fff;">GC</span>
    <span class="fh" style="font-weight:600;font-size:15px;color:#fff;">Gestión comercial</span>
  </a>
  <div style="flex:1;overflow:hidden;padding:6px 12px 0;">
    <sc-for list="{{secciones}}" as="s" hint-placeholder-count="5">
      <div style="{{s.style}}">
        <sc-if value="{{s.hasLabel}}" hint-placeholder-val="{{true}}"><button onClick="{{s.toggle}}" aria-expanded="{{s.expanded}}" style="display:flex;align-items:center;width:100%;border:0;background:transparent;cursor:pointer;padding:12px 10px 6px;color:#7C838D;text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:12px;text-align:left;"><span style="flex:1;">{{s.label}}</span><svg viewBox="0 0 24 24" width="16" height="16" fill="#7C838D" aria-hidden="true" style="{{s.chevStyle}}"><path d="M7 10l5 5 5-5z"></path></svg></button></sc-if>
        <sc-if value="{{s.show}}" hint-placeholder-val="{{true}}"><div>
        <sc-for list="{{s.items}}" as="it" hint-placeholder-count="3">
          <a href="{{it.href}}" style="{{it.style}}">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="{{it.ic}}" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
            <span style="font-size:14px;font-weight:500;">{{it.label}}</span><sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{false}}"><span style="margin-left:auto;min-width:20px;height:20px;padding:0 7px;border-radius:10px;background:#2B55E6;color:#fff;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;">{{it.badge}}</span></sc-if>
          </a>
        </sc-for></div></sc-if>
      </div>
    </sc-for>
  </div>
  <div style="padding:14px 20px;border-top:1px solid #2A2E36;display:flex;align-items:center;gap:10px;">
    <span class="avatar" style="width:30px;height:30px;font-size:12px;background:#2B55E6;color:#fff;">{{initial}}</span>
    <div style="min-width:0;"><p class="b" style="color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{user}}</p><p class="xs" style="color:#9AA0A9;">{{roleLabel}}</p></div>
  </div>
</div>
</x-dc>
