# Dataset sobre la vista `analitica.ventas_periodo_canal` (F-REP-05, FR-012/FR-013; contrato:
# specs/20270201-100000-rentabilidad-real-y-reportes-de-ventas/contracts/rentabilidad-real-y-reportes.md).
#
# Grano de la vista: una fila por empresa (canal) × fecha. El TABLERO agrupa por período (día, semana o
# mes, según el filtro nativo de «Agrupar por») y por canal (empresa/tienda) y suma; los filtros nativos
# (rango de fechas y empresa) se aplican sobre la fila de la vista y recién después se agrega.
#
# `organizacion_id` y `empresa_id` son las columnas sobre las que el guest token fuerza la cláusula
# `rls`. La vista NO tiene costo ni margen: el reporte muestra solo comprobantes, unidades y facturado
# con IVA. No hay canal de Mercado Libre (MSF-123 todavía no existe).
table_name: ventas_periodo_canal
main_dttm_col: fecha
