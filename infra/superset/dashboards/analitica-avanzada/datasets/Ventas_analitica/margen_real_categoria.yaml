# Dataset sobre la vista `analitica.margen_real_categoria` (F-REP-07, spec
# 20261114-100000-analitica-avanzada-y-resumen-por-correo, contrato contracts/tableros-analiticos.md).
#
# Grano de la vista: una fila por empresa × producto × fecha (la de `analitica.rentabilidad_ventas_real`) más la categoría
# del producto. El margen es el REAL de lo vendido: costo y cotización guardados en cada línea al confirmar, las notas de
# crédito restan y los costos adicionales son los vigentes al consultar. El TABLERO suma por tienda, categoría, producto y
# período; el porcentaje se recalcula sobre los totales (nunca se promedian porcentajes de filas).
#
# Expone costo y margen: el reporte se registra con la sección `rentabilidad`. `organizacion_id` y `empresa_id` son las
# columnas sobre las que el guest token fuerza la cláusula `rls`.
table_name: margen_real_categoria
main_dttm_col: fecha
description: 'Margen real por tienda, categoría y producto (F-REP-07): vendido, costo, costos adicionales y margen por empresa, producto y fecha.'
default_endpoint: null
offset: 0
cache_timeout: null
