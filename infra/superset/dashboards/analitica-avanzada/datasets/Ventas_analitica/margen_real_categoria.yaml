  d3format: ',.2f'
  currency: null
  extra: {}
  warning_text: null
- metric_name: costo_total
  verbose_name: Costo
  metric_type: null
  expression: SUM(costo + costos_adicionales)
  description: 'Costo guardado de las líneas más los costos adicionales de la tienda.'
  d3format: ',.2f'
  currency: null
  extra: {}
  warning_text: null
- metric_name: margen_total
  verbose_name: Margen
  metric_type: null
  expression: SUM(margen)
  description: 'Margen real del período: vendido menos costo y costos adicionales.'
  d3format: ',.2f'
  currency: null
  extra: {}
  warning_text: null
- metric_name: margen_pct_total
  verbose_name: Margen %
  metric_type: null
  expression: ROUND(100.0 * SUM(margen) / NULLIF(SUM(vendido), 0), 1)
  description: 'Margen sobre el vendido del período, calculado sobre los totales.'
  d3format: ',.1f'
  currency: null
  extra: {}
  warning_text: null
