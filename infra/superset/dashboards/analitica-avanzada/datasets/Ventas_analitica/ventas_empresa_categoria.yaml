# Dataset sobre la vista `analitica.ventas_empresa_categoria` (F-REP-07, spec
# 20261114-100000-analitica-avanzada-y-resumen-por-correo, contrato contracts/tableros-analiticos.md).
#
# Grano de la vista: una fila por empresa × categoría × producto × fecha. El TABLERO suma y cruza (tienda × categoría,
# período × categoría, producto × tienda); los filtros nativos (rango de fechas, empresa y categoría) se aplican sobre la
# fila de la vista y recién después se agrega.
#
# `organizacion_id` y `empresa_id` son las columnas sobre las que el guest token fuerza la cláusula `rls`
# (`emitir-acceso-reporte`, `reportes.filtro_empresa = true`). La vista NO tiene costo, margen ni datos de clientes.
