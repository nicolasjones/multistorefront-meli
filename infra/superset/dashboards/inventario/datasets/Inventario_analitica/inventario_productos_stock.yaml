# Dataset sobre la vista `analitica.inventario_productos_stock` (contrato:
# specs/20270201-100000-reportes-de-inventario-y-exportacion/contracts/analitica-inventario.md).
#
# Grano: una fila por producto activo. La tabla del tablero la muestra tal cual (modo raw) y el valor
# total del inventario es la métrica `valor_total` (suma de `valor_ars`): al ser una métrica sobre el
# mismo dataset, los filtros nativos (producto/SKU, categoría, estado) la recalculan solo sobre las
# filas filtradas (FR-003). `organizacion_id` es la columna sobre la que el guest token fuerza la
# cláusula `rls`.
table_name: inventario_productos_stock
