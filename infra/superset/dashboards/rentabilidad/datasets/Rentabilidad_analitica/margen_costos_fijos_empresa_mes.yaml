# Dataset sobre `analitica.margen_costos_fijos_empresa_mes` (spec gastos-de-la-empresa, RF-GAS-11/12). Grano: empresa × mes. Alimenta las tarjetas por
# tienda y el consolidado. Sin filas con la bandera `margen_costos_fijos` apagada. Solo totales: nunca el detalle de un gasto (CA-GAS-22).
table_name: margen_costos_fijos_empresa_mes
main_dttm_col: mes
description: "Por empresa y mes: ventas netas, costos fijos, margen vigente, margen después de fijos y «Sin atribuir» (F-GAS-03)."
