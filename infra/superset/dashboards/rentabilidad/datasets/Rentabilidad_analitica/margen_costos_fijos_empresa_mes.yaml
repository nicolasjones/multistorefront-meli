metrics:
- metric_name: count
  verbose_name: "COUNT(*)"
  metric_type: count
  expression: "COUNT(*)"
  description: null
  d3format: null
  currency: null
  extra: {}
  warning_text: null
- metric_name: ventas_total
  verbose_name: "Ventas netas"
  metric_type: null
  expression: "SUM(ventas_netas)"
  description: "Neto sin IVA de TODAS las ventas del mes (incluye las sin costo guardado); la nota de crédito resta."
  d3format: "$,.2f"
  currency: null
  extra: {}
  warning_text: null
- metric_name: margen_total
  verbose_name: "Margen vigente"
  metric_type: null
  expression: "SUM(margen)"
  description: "Margen real vigente de las ventas con costo guardado."
  d3format: "$,.2f"
  currency: null
  extra: {}
  warning_text: null
- metric_name: fijos_total
  verbose_name: "Costos fijos"
  metric_type: null
  expression: "SUM(costos_fijos)"
  description: "Gastos fijos vigentes del mes en pesos (cotización congelada al guardar)."
  d3format: "$,.2f"
  currency: null
  extra: {}
  warning_text: null
- metric_name: margen_despues_total
  verbose_name: "Margen después de fijos"
  metric_type: null
  expression: "SUM(margen_despues_fijos)"
  description: "Margen vigente menos el cargo atribuido a los productos."
  d3format: "$,.2f"
  currency: null
  extra: {}
  warning_text: null
- metric_name: sin_atribuir_total
  verbose_name: "Sin atribuir"
  metric_type: null
  expression: "SUM(sin_atribuir)"
  description: "Parte de los costos fijos que le toca a las ventas sin costo guardado: costos fijos menos el cargo atribuido."
  d3format: "$,.2f"
  currency: null
  extra: {}
  warning_text: null
- metric_name: tasa_texto
  verbose_name: "Tasa de costos fijos"
  metric_type: null
  expression: "CASE WHEN SUM(ventas_netas) > 0 THEN replace(to_char(round((SUM(costos_fijos) / NULLIF(SUM(ventas_netas), 0)) * 100, 1), 'FM990.0'), '.', ',') || ' %' ELSE 'Sin ventas para repartir los costos fijos' END"
  description: "Costos fijos sobre ventas netas; sin ventas no hay tasa."
  d3format: null
  currency: null
  extra: {}
  warning_text: null
