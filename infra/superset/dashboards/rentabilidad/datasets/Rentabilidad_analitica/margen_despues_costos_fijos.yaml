# Dataset sobre `analitica.margen_despues_costos_fijos` (spec gastos-de-la-empresa, RF-GAS-12). Grano: empresa × producto × fecha. Sin filas con la
# bandera `margen_costos_fijos` apagada. `organizacion_id` y `empresa_id` son las columnas de la cláusula `rls` del token (reportes.filtro_empresa).
# Nunca expone el detalle de un gasto: el costo fijo llega solo como total por empresa y mes (CA-GAS-22).
table_name: margen_despues_costos_fijos
main_dttm_col: mes
description: Margen real menos el cargo de costos fijos prorrateado por producto, categoría y empresa (F-GAS-03).
