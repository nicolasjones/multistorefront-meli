# Dataset virtual sobre la vista `analitica.margen_comparativo_producto` (contrato: specs/20261024-130000-rentabilidad-comparativos-e-historia/
# contracts/analitica-comparativos-historia.md). Una fila por producto comparable (≥ 2 empresas) y por orden: el filtro «Orden»
# elige el conjunto y `posicion` ordena la tabla. `organizacion_id` es la columna sobre la que el guest token fuerza la cláusula `rls`.
# Solo tiendas propias: sin cuentas de marketplaces (FR-004).
table_name: margen_comparativo_producto
main_dttm_col: null
description: Margen del mismo producto lado a lado en cada empresa, con diferencia en puntos porcentuales y mejor/peor empresa (F-REN-06).
default_endpoint: null
offset: 0
cache_timeout: null
schema: analitica
sql: |-
  with p as (
    select
      organizacion_id, producto_id, producto_nombre, sku, empresas_comparadas,
      margen_pct_mejor, margen_pct_peor, diferencia_pp, empresa_mejor, empresa_peor,
      string_agg(
        '<div style="display:flex;justify-content:space-between;gap:16px;"><span>' || replace(replace(replace(replace(empresa_nombre, '&', '&amp;'), '<', '&lt;'), '>', '&gt;'), '"', '&quot;') || '</span><b style="color:' ||
        case when margen < 0 then '#C62828' else '#15181D' end || ';">' || replace(to_char(round(margen_pct * 100, 1), 'FM990.0'), '.', ',') || ' %' || '</b></div>',
        '' order by empresa_nombre, empresa_id
      ) as margenes_html
    from analitica.margen_comparativo_producto
    group by organizacion_id, producto_id, producto_nombre, sku, empresas_comparadas,
      margen_pct_mejor, margen_pct_peor, diferencia_pp, empresa_mejor, empresa_peor
  )
  select
    p.*,
    o.orden_etiqueta,
    row_number() over (
      partition by p.organizacion_id, o.orden_etiqueta
      order by case when o.orden_etiqueta = 'Mayor diferencia primero' then -p.diferencia_pp else p.diferencia_pp end,
        p.producto_nombre, p.producto_id
    )::int as posicion
  from p
  cross join (values ('Mayor diferencia primero'), ('Menor diferencia primero')) as o(orden_etiqueta)
