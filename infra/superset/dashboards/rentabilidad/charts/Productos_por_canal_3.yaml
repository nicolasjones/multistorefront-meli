params: {"datasource": "1__table", "viz_type": "handlebars", "query_mode": "raw", "groupby": [], "metrics": [], "all_columns": ["producto_nombre", "sku", "empresa_nombre", "precio_texto", "costo_texto", "comision_texto", "margen_texto", "margen_color", "barra_pct", "barra_color", "margen_pct_texto", "estado_etiqueta", "estado_fondo", "estado_color"], "include_time": false, "order_by_cols": ["[\"margen_pct\", true]"], "order_desc": false, "row_limit": 10000, "server_page_length": 10, "adhoc_filters": [], "extra_form_data": {}, "handlebars_template": "<div style=\"background:#FFFFFF;border:1px solid #E3E3DE;border-radius:12px;overflow:hidden;font-family:'Instrument Sans',system-ui,sans-serif;color:#15181D;\">\n<div style=\"display:flex;justify-content:flex-end;padding:12px 16px;font-size:13px;color:#5B6470;\">{{data.length}} filas</div>\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;\">\n<thead><tr style=\"text-align:left;color:#5B6470;font-size:12px;border-top:1px solid #E3E3DE;border-bottom:1px solid #E3E3DE;\"><th style=\"padding:10px 16px;\">Producto</th><th style=\"padding:10px 8px;\">Canal</th><th style=\"padding:10px 8px;text-align:right;\">Precio</th><th style=\"padding:10px 8px;text-align:right;\">Costo</th><th style=\"padding:10px 8px;text-align:right;\">Comisión</th><th style=\"padding:10px 8px;text-align:right;\">Margen</th><th style=\"padding:10px 8px;text-align:right;\">Margen %</th><th style=\"padding:10px 16px;\">Estado</th></tr></thead>\n<tbody>\n{{#each data}}\n<tr style=\"border-bottom:1px solid #E3E3DE;\">\n<td style=\"padding:10px 16px;\"><b>{{producto_nombre}}</b><br><span style=\"font-size:12px;color:#5B6470;\">{{sku}}</span></td>\n<td style=\"padding:10px 8px;\">{{empresa_nombre}}</td>\n<td style=\"padding:10px 8px;text-align:right;\">{{precio_texto}}</td>\n<td style=\"padding:10px 8px;text-align:right;color:#5B6470;\">{{costo_texto}}</td>\n<td style=\"padding:10px 8px;text-align:right;color:#5B6470;\">{{comision_texto}}</td>\n<td style=\"padding:10px 8px;text-align:right;font-weight:700;color:{{margen_color}};\">{{margen_texto}}</td>\n<td style=\"padding:10px 8px;text-align:right;white-space:nowrap;\"><span style=\"display:inline-block;width:56px;height:8px;border-radius:4px;background:#E3E3DE;vertical-align:middle;margin-right:8px;\"><span style=\"display:block;height:8px;border-radius:4px;background:{{barra_color}};width:{{barra_pct}}%;\"></span></span><b style=\"color:{{margen_color}};\">{{margen_pct_texto}}</b></td>\n<td style=\"padding:10px 16px;\"><span style=\"font-size:12px;padding:2px 8px;border-radius:10px;background:{{estado_fondo}};color:{{estado_color}};\">{{estado_etiqueta}}</span></td>\n</tr>\n{{else}}\n<tr><td colspan=\"8\" style=\"padding:40px;text-align:center;\"><p style=\"font-size:16px;font-weight:600;margin:0;\">Sin resultados</p><p style=\"font-size:13px;color:#5B6470;margin:6px 0 0;\">Cambiá el filtro o la búsqueda.</p></td></tr>\n{{/each}}\n</tbody></table></div>", "styleTemplate": "", "dashboards": []}
