params: {"datasource": "1__table", "adhoc_filters": [], "extra_form_data": {}, "time_range": "No filter", "viz_type": "handlebars", "query_mode": "aggregate", "groupby": [], "metrics": ["filas", "vendido_texto", "costo_texto", "costos_adicionales_texto", "margen_texto", "margen_pct_texto", "estado_total"], "all_columns": [], "include_time": false, "order_by_cols": [], "order_desc": true, "row_limit": 1, "server_page_length": 10, "handlebars_template": "<div style=\"background:#FFFFFF;border:1px solid #E3E3DE;border-radius:12px;padding:20px;font-family:'Instrument Sans',system-ui,sans-serif;color:#15181D;\">\n<h2 style=\"font-size:18px;font-weight:600;margin:0 0 16px;\">Ventas reales del período</h2>\n{{#each data}}\n{{#if filas}}\n<div style=\"display:flex;gap:32px;flex-wrap:wrap;\">\n<div><p style=\"font-size:13px;color:#5B6470;margin:0;\">Vendido</p><p style=\"font-size:28px;font-weight:600;margin:6px 0 0;\">{{vendido_texto}}</p></div>\n<div><p style=\"font-size:13px;color:#5B6470;margin:0;\">Costo</p><p style=\"font-size:28px;font-weight:600;margin:6px 0 0;\">{{costo_texto}}</p></div>\n<div><p style=\"font-size:13px;color:#5B6470;margin:0;\">Costos adicionales</p><p style=\"font-size:28px;font-weight:600;margin:6px 0 0;\">{{costos_adicionales_texto}}</p></div>\n<div><p style=\"font-size:13px;color:#5B6470;margin:0;\">Margen</p><p style=\"font-size:28px;font-weight:600;margin:6px 0 0;\">{{margen_texto}}</p></div>\n<div><p style=\"font-size:13px;color:#5B6470;margin:0;\">Margen %</p><p style=\"font-size:28px;font-weight:600;margin:6px 0 0;\">{{margen_pct_texto}}</p><p style=\"font-size:13px;color:#5B6470;margin:4px 0 0;\">Estado: {{estado_total}}</p></div>\n</div>\n{{else}}\n<div style=\"padding:24px;text-align:center;\"><p style=\"font-size:16px;font-weight:600;margin:0;\">Sin ventas en este período</p><p style=\"font-size:13px;color:#5B6470;margin:6px 0 0;\">Elegí otro rango de fechas. Solo cuentan las ventas confirmadas con el costo guardado.</p></div>\n{{/if}}\