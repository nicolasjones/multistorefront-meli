# Dataset sobre la vista `analitica.ventas_producto_mas_vendido` (contrato:
# specs/20270104-100000-ventas-reportes-basicos/contracts/analitica-ventas-reportes.md).
#
# Grano de la vista: una fila por empresa × producto × depósito × fecha. El TABLERO agrupa por
# producto y suma (por eso las métricas de abajo son agregados y no columnas de la vista): los
# filtros nativos (rango de fechas, empresa, categoría y ubicación de stock) se aplican sobre el
# grano fino —la fila de la vista— y recién después se agrega por producto.
#
# El grupo del tablero es `producto_nombre` + `sku`: `dominio.productos` NO exige nombre único por
# organización (el índice por nombre no es único), así que agrupar solo por nombre fusionaría dos
# productos homónimos en una fila y su «Stock hoy» no sería el de ninguno. El SKU sí es único por
# organización (`productos_org_sku_uidx`), de modo que nombre + SKU identifican un producto igual que
# su id, sin mostrar identificadores técnicos en la tabla.
#
# `organizacion_id` y `empresa_id` son las columnas sobre las que el guest token fuerza la cláusula
# `rls` (FR-004); `empresa_nombre`, `categoria` y `deposito_nombre` son las de los filtros nativos.
table_name: ventas_producto_mas_vendido
main_dttm_col: fecha
description: 'Productos más vendidos (F-VTA-22): unidades y facturado neto por producto en el período, con el stock vigente.'
