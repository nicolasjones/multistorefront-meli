  expression: ROW_NUMBER() OVER (ORDER BY SUM(unidades) DESC, producto_nombre, sku)
  description: 'Posición en el ranking por unidades vendidas; el desempate por nombre y SKU deja el número estable entre corridas.'
  d3format: null
