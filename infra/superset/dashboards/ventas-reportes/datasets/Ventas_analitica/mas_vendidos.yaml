- metric_name: facturado_total
  verbose_name: Facturado
  metric_type: null
  expression: SUM(facturado)
  description: 'Facturado neto en el período, con IVA (el mismo número que muestra el listado de comprobantes): la nota de crédito resta.'
  d3format: ',.2f'
  currency: null
  extra: {}
  warning_text: null
- metric_name: stock_hoy_texto
  verbose_name: Stock hoy
  metric_type: null
  expression: MAX(CASE stock_estado WHEN 'sin_stock' THEN 'Sin stock' WHEN 'stock_bajo' THEN 'Stock bajo' WHEN 'disponible' THEN 'Disponible' ELSE 'Sin stock' END)
  description: 'Estado del stock vigente del producto (`public.stock_estados`), con las etiquetas de la app. El estado no depende de la empresa ni del depósito, así que dentro del grupo es el mismo en todas las filas: el grupo es UN producto (nombre + SKU), nunca dos.'
  d3format: null
  currency: null
  extra: {}
  warning_text: null
