# Dataset sobre la vista `analitica.ventas_ranking_clientes` (contrato:
# specs/20270104-100000-ventas-reportes-basicos/contracts/analitica-ventas-reportes.md).
#
# Grano de la vista: una fila por empresa × cliente × fecha. El TABLERO agrupa por cliente y suma
# (por eso las métricas de abajo son agregados y no columnas de la vista): los filtros nativos
# (rango de fechas, empresa y «Consumidor final») se aplican sobre el grano fino —la fila de la
# vista— y recién después se agrega por cliente.
#
# El grupo del tablero es `nombre` + `numero` + `tipo_texto`: `public.clientes` NO exige nombre
# único por organización (el índice `clientes_org_nombre_idx` no es único), así que agrupar solo por
# nombre fusionaría dos clientes homónimos en una fila y su facturación sería la suma de dos
# clientes. El `numero` es el correlativo por organización y sí es único
# (`clientes_org_numero_uq`), de modo que nombre + número identifican un cliente igual que su id;
# es el mismo desempate que usa `public.ranking_clientes` (facturado desc, nombre, número).
#
# `organizacion_id` y `empresa_id` son las columnas sobre las que el guest token fuerza la cláusula
# `rls` (FR-004); `empresa_nombre`, `consumidor_final_texto` y `fecha` son las de los filtros nativos.
#
# `posicion` y `participacion` de la vista NO se usan en el tablero: son del cliente en todo el
# alcance visible, así que con un filtro de período o de tienda quedarían desfasadas. El tablero las
# recalcula como métricas, sobre el resultado YA filtrado (misma fórmula).
table_name: ventas_ranking_clientes
main_dttm_col: fecha
description: 'Ranking de clientes por facturación neta (F-VTA-23): comprobantes, facturado neto, participación y última compra de cada cliente en el período.'
default_endpoint: null
offset: 0
cache_timeout: null
schema: analitica
sql: null
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null
normalize_columns: false
always_filter_main_dttm: false
uuid: 0ec4cca2-8144-4199-83f1-45bd5895bf97
metrics:
- metric_name: count
  verbose_name: COUNT(*)
  metric_type: count
  expression: COUNT(*)
  description: null
  d3format: null
  currency: null
  extra: {}
  warning_text: null
- metric_name: posicion
  verbose_name: '#'
  metric_type: null
  expression: ROW_NUMBER() OVER (ORDER BY SUM(facturado) DESC, lower(nombre), numero)
  description: 'Posición en el ranking por facturación neta; el desempate por nombre y número deja el número estable entre corridas (el mismo criterio que `public.ranking_clientes`).'
  d3format: null
  currency: null
  extra: {}
  warning_text: null
- metric_name: comprobantes_total
  verbose_name: Comprobantes
  metric_type: null
  expression: SUM(comprobantes)
  description: 'Comprobantes que cuentan en el período: solo facturas (la nota de crédito resta del importe pero no suma un comprobante).'
  d3format: ',d'
  currency: null
  extra: {}
  warning_text: null
- metric_name: facturado_total
  verbose_name: Facturado
  metric_type: null
  expression: SUM(facturado)
  description: 'Facturado neto en el período, con IVA (la misma base que muestra el listado y la exportación de comprobantes): la nota de crédito resta.'
  d3format: ',.2f'
  currency: null
  extra: {}
  warning_text: null
- metric_name: participacion_total
  verbose_name: Participación
  metric_type: null
  expression: CASE WHEN SUM(SUM(facturado)) OVER () = 0 THEN 0 ELSE SUM(facturado) / SUM(SUM(facturado)) OVER () END
  description: 'Participación del cliente sobre el total del alcance ya filtrado, como fracción (0–1): la columna la muestra como porcentaje y la barra de la celda es proporcional a este valor.'
  d3format: '.1%'
  currency: null
  extra: {}
  warning_text: null
- metric_name: ultimo_comprador
  verbose_name: Último comprador
  metric_type: null
  expression: MAX(ultimo_comprador)
  description: 'Fecha del comprobante más reciente que cuenta del cliente en el alcance filtrado (con varias tiendas, la última compra).'
  d3format: '%d/%m/%Y'
  currency: null
  extra: {}
  warning_text: null
