# Dataset sobre la vista `analitica.consultas_producto_mas_consultado` (F-REP-04, FR-010/FR-011;
# contrato: specs/20270201-100000-rentabilidad-real-y-reportes-de-ventas/contracts/rentabilidad-real-y-reportes.md).
#
# Grano de la vista: una fila por empresa × producto × fecha. El TABLERO agrupa por producto (nombre +
# SKU, único por organización: no se muestra ningún identificador técnico) y suma; los filtros nativos
# (rango de fechas y empresa) se aplican sobre la fila de la vista y recién después se agrega.
#
# `organizacion_id` y `empresa_id` son las columnas sobre las que el guest token fuerza la cláusula
# `rls`. La vista NO tiene costo ni margen: el reporte muestra solo cantidades.
