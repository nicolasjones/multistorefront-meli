services:
  nango-server:
    ports: !reset []

# MSF-705: credenciales OBLIGATORIAS en el VPS. El Compose base trae valores por defecto (`change-me-local`, `*-local`)
# solo para el arranque local documentado; en un ambiente real, si falta la variable, `docker compose config` falla y el
# despliegue se corta en vez de arrancar Nango con una credencial conocida. Los valores van en `.env.staging`/`.env.production`
# (secret VPS_DEPLOY_ENV). Este bloque no llega al contenedor: es una extensión de Compose que solo se interpola.
x-variables-obligatorias:
  nango_db_password: ${NANGO_DB_PASSWORD:?Definí NANGO_DB_PASSWORD en el .env del ambiente (contraseña de la base de Nango)}
  nango_encryption_key: ${NANGO_ENCRYPTION_KEY:?Definí NANGO_ENCRYPTION_KEY en el .env del ambiente (clave de cifrado de las credenciales OAuth)}
  nango_dashboard_password: ${NANGO_DASHBOARD_PASSWORD:?Definí NANGO_DASHBOARD_PASSWORD en el .env del ambiente (contraseña del dashboard de Nango)}
  nango_secret_key_dev: ${NANGO_SECRET_KEY_DEV:?Definí NANGO_SECRET_KEY_DEV en el .env del ambiente (secreto de la API de Nango (UUID v4))}

# The VPS reverse proxy joins this project's default network and forwards HTTPS
# traffic to nango-server:3003. Use a distinct .env.staging or .env.production file.
