# Retención de copias (épica MSF-457, F-OPS-01, FR-003).
#
# Retención POR DÍAS (MSF-714), no por cantidad: conserva las copias de los
# últimos N días y la primera copia de cada uno de los M últimos meses en
# `base/` (archivos .dump, por defecto 30 días + 12 meses) e `imagenes/`
# (carpetas de foto completas, por defecto 7 días + 2 meses y un TOPE TOTAL de 7
# fotos, mensuales incluidas: cada una pesa todo Storage); purga el resto. Nunca borra la copia más reciente: es la última
# válida (solo se publica una copia al destino tras verificarla; las fotos
# parciales de imágenes se limpian solas al fallar). Solo toca nombres con la
# forma AAAAMMDD-HHMMSS…: cualquier otro archivo del destino se ignora.
#
# Parámetros: RESPALDOS_RETENCION_DIAS / RESPALDOS_RETENCION_MENSUALES (base) y
# RESPALDOS_IMAGENES_RETENCION_DIAS / _MENSUALES / RESPALDOS_IMAGENES_MAX_COPIAS
# (imágenes), o los inputs `dias` y `mensuales` para una corrida puntual.
id: retencion-copias
namespace: platform.backups
labels:
  capa: core
  dominio: plataforma
  componente: backups

description: "Purga las copias de base e imágenes más viejas que la retención en días (más las mensuales) y las fotos de imágenes que exceden el tope; nunca borra la última."

inputs:
  - id: dias
    type: STRING
    required: false
    description: "Reemplaza RESPALDOS_RETENCION_DIAS (base) solo para esta corrida (entero >= 1)."
  - id: mensuales
    type: STRING
    required: false
    description: "Reemplaza RESPALDOS_RETENCION_MENSUALES solo para esta corrida (entero >= 0)."

tasks:
  - id: purgar_copias_vencidas
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: rclone/rclone:1.68.2
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
      entryPoint: []
      volumes:
        - "{{ envs.respaldos_dir_host }}:/respaldos"
    env:
      RCLONE_CONFIG_RESPALDOS_TYPE: "{{ envs.respaldos_rclone_tipo }}"
      RCLONE_CONFIG_RESPALDOS_PROVIDER: "{{ envs.respaldos_rclone_provider }}"
      RCLONE_CONFIG_RESPALDOS_ENDPOINT: "{{ envs.respaldos_rclone_endpoint }}"
      RCLONE_CONFIG_RESPALDOS_REGION: "{{ envs.respaldos_rclone_region }}"
      RCLONE_CONFIG_RESPALDOS_ACCESS_KEY_ID: "{{ envs.respaldos_rclone_access_key_id }}"
      RCLONE_CONFIG_RESPALDOS_SECRET_ACCESS_KEY: "{{ envs.respaldos_rclone_secret_access_key }}"
      RCLONE_CONFIG_RESPALDOS_HOST: "{{ envs.respaldos_rclone_host }}"
      RCLONE_CONFIG_RESPALDOS_USER: "{{ envs.respaldos_rclone_user }}"
      RCLONE_CONFIG_RESPALDOS_PASS: "{{ envs.respaldos_rclone_pass }}"
      DIAS: "{{ inputs.dias ?? envs.respaldos_retencion_dias }}"
      MENSUALES: "{{ inputs.mensuales ?? envs.respaldos_retencion_mensuales }}"
      IMAGENES_DIAS: "{{ envs.respaldos_imagenes_retencion_dias }}"
      IMAGENES_MENSUALES: "{{ envs.respaldos_imagenes_retencion_mensuales }}"
      IMAGENES_MAX: "{{ envs.respaldos_imagenes_max_copias }}"
      RAIZ: "respaldos:{{ envs.respaldos_ruta }}"
    timeout: PT30M
    commands:
      - set -eu
      # Un plazo inválido falla antes de borrar nada.
      - |
        # Enteros sin ceros a la izquierda ('08' daría un error de aritmética poco claro) y de hasta 4 dígitos (máx. 9999):
        # con más dígitos la aritmética de BusyBox desborda y `DIAS` enorme purgaba copias recientes. $3 = mínimo permitido (0 o 1).
        # Se valida el valor COMPLETO: `grep` trabaja por línea y dejaba pasar «5» + salto de línea + texto.
        NL=$(printf '\n_'); NL=${NL%_}
        numero() {
          if [ "$3" -ge 1 ]; then ER='^[1-9][0-9]{0,3}$'; MSG='un entero >= 1'; else ER='^(0|[1-9][0-9]{0,3})$'; MSG='un entero >= 0'; fi
          case "$2" in *"$NL"*) echo "$1 debe ser $MSG sin ceros a la izquierda y de hasta 4 dígitos (el valor tiene un salto de línea)" >&2; exit 1 ;; esac
          printf '%s' "$2" | grep -Eq "$ER" || { echo "$1 debe ser $MSG sin ceros a la izquierda y de hasta 4 dígitos (valor: '$2')" >&2; exit 1; }
        }
        numero RESPALDOS_RETENCION_DIAS "$DIAS" 1
        numero RESPALDOS_RETENCION_MENSUALES "$MENSUALES" 0
        numero RESPALDOS_IMAGENES_RETENCION_DIAS "$IMAGENES_DIAS" 1
        numero RESPALDOS_IMAGENES_RETENCION_MENSUALES "$IMAGENES_MENSUALES" 0
        numero RESPALDOS_IMAGENES_MAX_COPIAS "$IMAGENES_MAX" 1
      # $1 = carpeta (base|imagenes), $2 = opción de lsf (--files-only|--dirs-only),
      # $3 = días a conservar, $4 = meses (primera copia de cada mes), $5 = tope
      # TOTAL de copias a conservar, mensuales incluidas (0 = sin tope; solo lo usa `base`, las imágenes exigen >= 1). Purga lo que excede la retención: una copia
      # se conserva si es de los últimos $3 días (y entra en el tope, contando desde
      # la más nueva) o es la primera de uno de los últimos $4 meses; la más
      # reciente siempre se conserva. Un destino inalcanzable falla la tarea (no se
      # reporta "0 purgadas"); una carpeta que aún no existe (código 3 de rclone)
      # es simplemente vacía. AHORA (epoch) solo se fija en los tests.
      - |
        BORRADOS=0
        LISTA_TMP=$(mktemp)
        purgar() {
          RC=0
          CORTE=$(date -u -d "@$(( ${AHORA:-$(date +%s)} - $3 * 86400 ))" +%Y%m%d)
          LISTA=$(rclone lsf "$RAIZ/$1" "$2") || RC=$?
          if [ "$RC" -eq 3 ]; then LISTA=''; elif [ "$RC" -ne 0 ]; then echo "No se pudo listar $RAIZ/$1 (rclone código $RC)" >&2; exit "$RC"; fi
          printf '%s\n' "$LISTA" | sed 's#/$##' | grep -E '^[0-9]{8}-[0-9]{6}' | sort | awk -v corte="$CORTE" -v m="$4" -v max="$5" '
            { n[NR] = $0 }
            END {
              if (NR == 0) exit
              keep[n[NR]] = 1
              c = 1
              for (i = NR - 1; i >= 1; i--) {
                if (substr(n[i], 1, 8) >= corte && (max == 0 || c < max)) { keep[n[i]] = 1; c++ }
              }
              nm = 0
              for (i = 1; i <= NR; i++) {
                mes = substr(n[i], 1, 6)
                if (!(mes in visto)) { visto[mes] = 1; primero[++nm] = n[i] }
              }
              for (j = nm; j >= 1 && j > nm - m; j--) {
                if (!(primero[j] in keep) && (max == 0 || c < max)) { keep[primero[j]] = 1; c++ }
              }
              for (i = 1; i <= NR; i++) if (!(n[i] in keep)) print n[i]
            }' > "$LISTA_TMP"
          while IFS= read -r NOMBRE; do
            if [ "$2" = "--files-only" ]; then rclone deletefile "$RAIZ/$1/$NOMBRE"; else rclone purge "$RAIZ/$1/$NOMBRE"; fi
            BORRADOS=$((BORRADOS + 1))
          done < "$LISTA_TMP"
        }
        purgar base --files-only "$DIAS" "$MENSUALES" 0
        purgar imagenes --dirs-only "$IMAGENES_DIAS" "$IMAGENES_MENSUALES" "$IMAGENES_MAX"
        rm -f "$LISTA_TMP"
        echo "Copias purgadas: $BORRADOS"
        echo '::{"outputs":{"purgadas":'$BORRADOS'}}::'

errors:
  - id: avisar_fallo
    type: io.kestra.plugin.core.flow.Subflow
    namespace: platform.backups
    flowId: aviso-fallo-copias
    wait: true
    transmitFailed: false
    inputs:
      flujo: retencion-copias
      ejecucion: "{{ execution.id }}"
      motivo: "{{ tasksWithState('FAILED')[0]['taskId'] }}: {{ errorLogs()[0]['message'] }}"

triggers:
  # Diario, después de las dos copias (03:00 base, 03:15 imágenes).
  - id: schedule_diario
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 4 * * *"
