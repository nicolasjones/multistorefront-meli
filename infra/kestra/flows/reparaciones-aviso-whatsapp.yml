# MSF-952 (S-1 de MSF-118): envía al cliente el aviso del estado de su reparación por WhatsApp, desde el servidor.
#
# Es el camino de correo (`reparaciones-aviso-correo`) con otro canal: la RPC `public.avisar_cliente_whatsapp` ya
# creó el aviso `pendiente` y dejó la orden durable. Este flow reclama solo las capacidades
# `enviar-aviso-whatsapp-*` y, por cada aviso, resuelve los datos con `private.datos_aviso_reparacion`; si el aviso
# sigue pendiente, entrega el mensaje al proveedor de mensajería y lo cierra con `private.cerrar_aviso_reparacion`
# como `enviado`. Un fallo del proveedor se reintenta 3 veces y, si persiste, cierra el aviso como `fallido` con un
# motivo fijo (nunca el mensaje del proveedor, que puede traer tokens o credenciales).
#
# El contrato con el proveedor es mínimo y está en esta tarea (`enviar_whatsapp`): un POST con
# `{ telefono, mensaje, plantilla, clave }`. `telefono` son dígitos en formato internacional, `mensaje` es el texto
# de la plantilla aprobada (sin importes ni costos), `plantilla` es el nombre de la plantilla y `clave` es la clave de
# idempotencia del aviso (para que el proveedor no repita el mensaje). El proveedor concreto lo elige y lo contrata
# el cliente (decisión de negocio de MSF-118, D-1): hasta entonces, WHATSAPP_API_URL y el secreto quedan vacíos y
# los avisos se cierran como fallidos.
#
# Rol de base: kestra_orquestacion (único rol de servicio de Kestra), solo EXECUTE sobre las funciones de la outbox
# y de este flow. El secreto del proveedor va en SECRET_WHATSAPP_TOKEN (base64), nunca en este YAML.
id: reparaciones-aviso-whatsapp
namespace: producto.service
labels:
  capa: producto
  dominio: service
  componente: reparaciones-aviso-whatsapp
description: "Envía por WhatsApp al cliente el aviso del estado de su reparación, desde el servidor."
tasks:
  - id: reclamar
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ envs.kestra_orquestacion_db_url }}"
    username: kestra_orquestacion
    password: "{{ envs.kestra_orquestacion_db_password }}"
    fetchType: FETCH
    sql: select r.*, r.detalle->>'aviso_id' as aviso_id from private.reclamar_despachos_capacidad('enviar-aviso-whatsapp-', 5, 900) r;
  - id: despachar
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ outputs.reclamar.rows }}"
    concurrencyLimit: 2
    allowFailure: true
    tasks:
      - id: procesar
        type: io.kestra.plugin.core.flow.Sequential
        tasks:
          - id: datos
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ envs.kestra_orquestacion_db_url }}"
            username: kestra_orquestacion
            password: "{{ envs.kestra_orquestacion_db_password }}"
            fetchType: FETCH_ONE
            sql: |
              select x.d::text as datos,
                     case when x.d->>'estado_envio' = 'pendiente' then 'enviar' else 'nada' end as accion
              from (select private.datos_aviso_reparacion(CAST(:aviso_id AS uuid)) as d) x;
            parameters:
              aviso_id: "{{ fromJson(parent.taskrun.value).aviso_id }}"
          # Plantilla aprobada del aviso de estado (MSF-952): saludo, tienda, número, equipo, estado y descripción.
          # Sin importes ni costos, y con la descripción solo si el estado la tiene.
          - id: enviar_whatsapp
            runIf: "{{ outputs.datos[parent.taskrun.value].row.accion == 'enviar' }}"
            type: io.kestra.plugin.core.http.Request
            uri: "{{ envs.whatsapp_api_url }}"
            method: POST
            contentType: application/json
            headers:
              Authorization: "Bearer {{ secret('WHATSAPP_TOKEN') }}"
            body: |
              {{ {
                "telefono": fromJson(outputs.datos[parent.taskrun.value].row.datos).destinatario,
                "mensaje": "Hola " ~ fromJson(outputs.datos[parent.taskrun.value].row.datos).cliente ~ ", te escribimos de " ~ fromJson(outputs.datos[parent.taskrun.value].row.datos).empresa ~ ". Tu reparación " ~ fromJson(outputs.datos[parent.taskrun.value].row.datos).numero ~ " (" ~ fromJson(outputs.datos[parent.taskrun.value].row.datos).equipo ~ ") está en estado «" ~ fromJson(outputs.datos[parent.taskrun.value].row.datos).estado ~ "»." ~ (fromJson(outputs.datos[parent.taskrun.value].row.datos).descripcion == '' ? '' : ' ' ~ fromJson(outputs.datos[parent.taskrun.value].row.datos).descripcion),
                "plantilla": envs.whatsapp_plantilla,
                "clave": fromJson(outputs.datos[parent.taskrun.value].row.datos).clave_envio
              } | toJson }}
            timeout: PT30S
            retry:
              type: constant
              maxAttempts: 3
              interval: PT30S
          - id: cerrar_enviado
            runIf: "{{ outputs.datos[parent.taskrun.value].row.accion == 'enviar' }}"
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ envs.kestra_orquestacion_db_url }}"
            username: kestra_orquestacion
            password: "{{ envs.kestra_orquestacion_db_password }}"
            sql: select private.cerrar_aviso_reparacion(CAST(:aviso_id AS uuid), NULL);
            parameters:
              aviso_id: "{{ fromJson(parent.taskrun.value).aviso_id }}"
          - id: resolver_outbox
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ envs.kestra_orquestacion_db_url }}"
            username: kestra_orquestacion
            password: "{{ envs.kestra_orquestacion_db_password }}"
            sql: select private.resolver_despacho_ejecucion(CAST(:despacho_id AS uuid), CAST(:intento AS integer), 'confirmar', NULL, 30, 20);
            parameters:
              despacho_id: "{{ fromJson(parent.taskrun.value).despacho_id }}"
              intento: "{{ fromJson(parent.taskrun.value).intento }}"
        errors:
          # El proveedor falló tras sus reintentos: el aviso se cierra como fallido con un motivo fijo (no el mensaje
          # del proveedor) y la orden se confirma para no reenviar en bucle.
          - id: cerrar_aviso_fallido
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ envs.kestra_orquestacion_db_url }}"
            username: kestra_orquestacion
            password: "{{ envs.kestra_orquestacion_db_password }}"
            sql: select private.cerrar_aviso_reparacion(CAST(:aviso_id AS uuid), 'No se pudo enviar el WhatsApp');
            parameters:
              aviso_id: "{{ fromJson(parent.taskrun.value).aviso_id }}"
          - id: confirmar_despacho
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ envs.kestra_orquestacion_db_url }}"
            username: kestra_orquestacion
            password: "{{ envs.kestra_orquestacion_db_password }}"
            sql: select private.resolver_despacho_ejecucion(CAST(:despacho_id AS uuid), CAST(:intento AS integer), 'agotar', 'AVISO_FALLIDO', 30, 20);
            parameters:
              despacho_id: "{{ fromJson(parent.taskrun.value).despacho_id }}"
              intento: "{{ fromJson(parent.taskrun.value).intento }}"
triggers:
  - id: schedule_whatsapp
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "* * * * *"
finally:
  - id: publicar_logs
    type: io.kestra.plugin.core.log.Fetch
    tasksId:
      - despachar
    allowFailure: true
    allowWarning: true
