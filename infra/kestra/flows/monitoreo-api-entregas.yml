# MSF-837 · F-API-01: chequeo de salud de los avisos de la API (revisión del rol CTO).
#
# Cada 15 minutos le pregunta a la base (`private.api_entregas_salud`) tres cosas y, si alguna está mal, avisa por correo a
# soporte (subflow `aviso-fallo-api`):
#   · entregas AGOTADAS en la última hora (un destino que no respondió en los 5 intentos), desde `umbral_agotadas`;
#   · entregas pendientes que debieron enviarse hace más de `atraso_min` minutos (el pipeline no avanza);
#   · eventos de la API sin repartir hace más de `atraso_min` minutos.
# Un aviso cada 15 minutos mientras la condición dure es el recordatorio; no se avisa nada si todo está sano. La lógica de qué
# cuenta vive en la base; el flow solo la consulta y avisa. Umbrales: son inputs, se ajustan sin cambiar código.
# Si el propio chequeo falla (base caída, función sin permiso), el bloque `errors:` también avisa.
#
# Rol de base: kestra_orquestacion (único rol de servicio de Kestra), solo EXECUTE sobre `private.api_entregas_salud`.
id: monitoreo-api-entregas
namespace: platform.api
labels:
  capa: core
  dominio: plataforma
  componente: api-monitoreo
description: "Avisa a soporte si los avisos de la API se agotan o se atrasan."
inputs:
  - id: ventana_min
    type: INT
    defaults: 60
    description: "Ventana, en minutos, para contar las entregas agotadas."
  - id: atraso_min
    type: INT
    defaults: 30
    description: "Minutos sin avanzar para considerar atrasada una entrega o un evento."
  - id: umbral_agotadas
    type: INT
    defaults: 5
    description: "Entregas agotadas en la ventana desde las que se avisa."
tasks:
  - id: salud
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ envs.kestra_orquestacion_db_url }}"
    username: kestra_orquestacion
    password: "{{ envs.kestra_orquestacion_db_password }}"
    fetchType: FETCH_ONE
    sql: select agotadas, entregas_atrasadas, eventos_atrasados from private.api_entregas_salud(CAST(:ventana AS integer), CAST(:atraso AS integer));
    parameters:
      ventana: "{{ inputs.ventana_min }}"
      atraso: "{{ inputs.atraso_min }}"
  - id: hay_problema
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.salud.row.agotadas | number) >= inputs.umbral_agotadas or (outputs.salud.row.entregas_atrasadas | number) > 0 or (outputs.salud.row.eventos_atrasados | number) > 0 }}"
    then:
      - id: avisar_salud
        type: io.kestra.plugin.core.flow.Subflow
        namespace: platform.api
        flowId: aviso-fallo-api
        wait: true
        transmitFailed: false
        inputs:
          flujo: monitoreo-api-entregas
          ejecucion: "{{ execution.id }}"
          motivo: "Entregas agotadas en los últimos {{ inputs.ventana_min }} minutos: {{ outputs.salud.row.agotadas }}. Entregas atrasadas más de {{ inputs.atraso_min }} minutos: {{ outputs.salud.row.entregas_atrasadas }}. Eventos sin repartir más de {{ inputs.atraso_min }} minutos: {{ outputs.salud.row.eventos_atrasados }}."
errors:
  - id: avisar_fallo_del_chequeo
    type: io.kestra.plugin.core.flow.Subflow
    namespace: platform.api
    flowId: aviso-fallo-api
    wait: true
    transmitFailed: false
    inputs:
      flujo: monitoreo-api-entregas
      ejecucion: "{{ execution.id }}"
      motivo: "No se pudo consultar la salud de las entregas: {{ tasksWithState('FAILED')[0]['taskId'] }}: {{ errorLogs()[0]['message'] }}"
triggers:
  - id: cada_15_minutos
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
