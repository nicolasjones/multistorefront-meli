# MSF-396 (F-OPS-06, FR-038): consume la outbox de ejecuciones para generar la
# exportación total de datos de una organización (ZIP con un CSV por conjunto).
#
# La RPC `solicitar_exportacion_total` ya creó el proceso masivo, la ejecución
# `manual` y su orden durable (spec 019). Este flow solo reclama las capacidades
# `exportar-organizacion-*` (nunca las de otros productos), lanza el worker en el
# servidor de la organización y resuelve la misma orden con confirmar, liberar
# o agotar. Una falla no reintentable del worker (código 78, contrato
# workers/CONTRATO.md) se agota en el primer intento.
id: exportar-organizacion
namespace: platform.exportacion
labels:
  capa: plataforma
  dominio: exportacion
  componente: exportar-organizacion
description: "Exporta todos los datos de la organización a un ZIP con un CSV por conjunto, a pedido de un administrador."
# MSF-710: una sola corrida a la vez; si la anterior sigue en curso, la nueva se descarta (no se apilan ni
# compiten por los mismos reclamos).
concurrency:
  limit: 1
  behavior: CANCEL
tasks:
  - id: reclamar
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ envs.kestra_orquestacion_db_url }}"
    username: kestra_orquestacion
    password: "{{ envs.kestra_orquestacion_db_password }}"
    fetchType: FETCH
    sql: select * from private.reclamar_despachos_capacidad('exportar-organizacion-', 5, 3600);
    timeout: PT1M
  - id: despachar
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ outputs.reclamar.rows }}"
    concurrencyLimit: 2
    allowFailure: true
    tasks:
      - id: procesar
        type: io.kestra.plugin.core.flow.Sequential
        tasks:
          - id: resolver_conexion
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ envs.kestra_orquestacion_db_url }}"
            username: kestra_orquestacion
            password: "{{ envs.kestra_orquestacion_db_password }}"
            fetchType: FETCH_ONE
            sql: select * from private.datos_despacho_conexion(CAST(:organizacion_id AS uuid), 'historial-ventas');
            parameters:
              organizacion_id: "{{ fromJson(taskrun.value).organizacion_id }}"
            timeout: PT1M
          - id: despacho_ssh
            type: io.kestra.plugin.fs.ssh.Command
            host: "{{ outputs.resolver_conexion[parent.taskrun.value].row.host }}"
            port: "{{ outputs.resolver_conexion[parent.taskrun.value].row.puerto_ssh }}"
            username: "{{ outputs.resolver_conexion[parent.taskrun.value].row.usuario_ssh }}"
            authMethod: PUBLIC_KEY
            privateKey: "{{ secret('ORQUESTACION_SSH_PRIVATE_KEY') }}"
            # MSF-817: el lease de la orden es de 3600 s (`reclamar_despachos_capacidad(..., 3600)`) y la solicitud reutiliza un proceso
            # abierto por 3600 s. Peor caso de esta tarea: 2 intentos x 25 min + espera <= 52 min < 3600 s (antes 3 x 30 min = 90 min:
            # un segundo reclamo podía lanzar otro worker sobre la misma exportación).
            timeout: PT25M
            retry:
              type: exponential
              maxAttempts: 2
              interval: PT30S
              maxInterval: PT2M
            commands:
              # MSF-712: con `docker image inspect || docker pull` un tag mutable (`:latest`) nunca se actualiza en el servidor si la imagen ya está.
              # Se exige una referencia inmutable (digest `@sha256:` o tag del commit de 40 hex); `local/*` son imágenes construidas en la misma máquina (desarrollo).
              - |
                IMAGEN_WORKER="{{ envs.exportar_organizacion_imagen }}"
                printf '%s' "$IMAGEN_WORKER" | grep -Eq '^local/|@sha256:[0-9a-f]{64}$|:[0-9a-f]{40}$' || { echo "La imagen del worker debe ir por digest (@sha256:...) o por tag de commit, no por un tag mutable: $IMAGEN_WORKER" >&2; exit 64; }
              - docker image inspect {{ envs.exportar_organizacion_imagen }} >/dev/null 2>&1 || docker pull {{ envs.exportar_organizacion_imagen }}
              - |
                set -a
                . /opt/automation-platform/worker.env
                set +a
                WORKER_NETWORK_ESPERADA="worker-egress-historial-ventas"
                [ "$WORKER_NETWORK" = "$WORKER_NETWORK_ESPERADA" ] || { echo 'Red de egress no autorizada' >&2; exit 64; }
                # El worker escribe el ZIP en el bucket privado con la service-role
                # que vive solo en worker.env del servidor; el flow transmite los
                # nombres, nunca los valores.
                # MSF-817: candado por ejecución. Un contenedor vivo con este nombre es un intento anterior (el timeout de SSH no
                # mata lo remoto): no se lanza otro sobre la misma exportación, se informa YA_EN_CURSO (no reintentable).
                CONTENEDOR="exportar-org-{{ fromJson(parent.taskrun.value).ejecucion_id }}"
                if [ -n "$(docker ps -q --filter "name=^${CONTENEDOR}$")" ]; then
                  echo "YA_EN_CURSO:{{ fromJson(parent.taskrun.value).ejecucion_id }}" >&2
                  printf '::{"outputs":{"no_reintentable":"YA_EN_CURSO"}}::\n'
                  exit 0
                fi
                WORKER_STDERR=$(mktemp)
                WORKER_RC=0
                # Vigilante: si el worker se pasa de 24 min se detiene el contenedor (`--rm` lo borra), en vez de quedar vivo cuando
                # SSH corta la sesión a los 25 min. Se cancela apenas el worker termina.
                ( sleep 1440 && docker stop -t 30 "$CONTENEDOR" >/dev/null 2>&1 ) &
                VIGILANTE=$!
                docker run --rm \
                  --name "$CONTENEDOR" \
                  --init \
                  --pids-limit "${WORKER_PIDS:-1024}" \
                  --read-only \
                  --tmpfs /tmp:rw,noexec,nosuid,size=256m \
                  --cap-drop=ALL \
                  --security-opt=no-new-privileges:true \
                  --cpus "${WORKER_CPUS:-1}" \
                  --memory "${WORKER_MEMORY:-768m}" \
                  --network "${WORKER_NETWORK:?Debe configurarse una red con egress allowlist}" \
                  --env PGHOST --env PGPORT --env PGDATABASE --env PGUSER --env PGPASSWORD \
                  --env SUPABASE_URL --env SUPABASE_SERVICE_ROLE_KEY \
                  -e ORGANIZACION_ID="{{ fromJson(parent.taskrun.value).organizacion_id }}" \
                  -e CONEXION_ID="{{ fromJson(parent.taskrun.value).conexion_id }}" \
                  -e SISTEMA_EXTERNO="historial-ventas" \
                  -e EJECUCION_ID="{{ fromJson(parent.taskrun.value).ejecucion_id }}" \
                  -e KESTRA_EJECUCION_ID="{{ execution.id }}" \
                  {{ envs.exportar_organizacion_imagen }} 2>"$WORKER_STDERR" || WORKER_RC=$?
                kill "$VIGILANTE" 2>/dev/null || true
                # Fallas no reintentables (workers/CONTRATO.md): 78 con un
                # motivo contractual. Kestra no condiciona retry por código:
                # se termina en 0 con el motivo como output y el flow resuelve
                # la orden con agotar; un error técnico sigue el retry.
                cat "$WORKER_STDERR" >&2
                NO_REINTENTABLE=
                if [ "$WORKER_RC" -eq 78 ]; then
                  NO_REINTENTABLE=$(sed -n 's/^\([A-Z_]*\):.*/\1/p' "$WORKER_STDERR" | tail -n 1)
                  case "$NO_REINTENTABLE" in CREDENCIAL_INVALIDA|EJECUCION_NO_EN_CURSO|YA_EN_CURSO|CAPACIDAD_NO_HABILITADA|CONFIGURACION_INVALIDA|TOPE_EXCEDIDO) ;; *) NO_REINTENTABLE=NO_REINTENTABLE ;; esac
                fi
                rm -f "$WORKER_STDERR"
                if [ -n "$NO_REINTENTABLE" ]; then
                  printf '::{"outputs":{"no_reintentable":"%s"}}::\n' "$NO_REINTENTABLE"
                  exit 0
                fi
                exit "$WORKER_RC"
          - id: resolver_outbox
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ envs.kestra_orquestacion_db_url }}"
            username: kestra_orquestacion
            password: "{{ envs.kestra_orquestacion_db_password }}"
            sql: select private.resolver_despacho_ejecucion(CAST(:despacho_id AS uuid), CAST(:intento AS integer), :accion, :motivo, 60, 3);
            parameters:
              despacho_id: "{{ fromJson(parent.taskrun.value).despacho_id }}"
              intento: "{{ fromJson(parent.taskrun.value).intento }}"
              accion: "{{ (outputs.despacho_ssh[parent.taskrun.value].vars.no_reintentable ?? '') == '' ? 'confirmar' : 'agotar' }}"
              motivo: "{{ outputs.despacho_ssh[parent.taskrun.value].vars.no_reintentable ?? '' }}"
            timeout: PT1M
        errors:
          # Falla técnica después de los 3 intentos de SSH: la orden vuelve a
          # pendiente con demora y, al llegar a 3 reclamos, queda agotada.
          - id: liberar_despacho
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ envs.kestra_orquestacion_db_url }}"
            username: kestra_orquestacion
            password: "{{ envs.kestra_orquestacion_db_password }}"
            sql: select private.resolver_despacho_ejecucion(CAST(:despacho_id AS uuid), CAST(:intento AS integer), 'liberar', 'FALLA_TECNICA_SANITIZADA', 60, 3);
            parameters:
              despacho_id: "{{ fromJson(parent.taskrun.value).despacho_id }}"
              intento: "{{ fromJson(parent.taskrun.value).intento }}"
            timeout: PT1M
# MSF-709: un fallo del flow avisa al soporte (antes quedaba solo en la UI de Kestra).
errors:
  - id: avisar_fallo
    type: io.kestra.plugin.core.flow.Subflow
    namespace: platform.alertas
    flowId: aviso-fallo-flujo
    wait: true
    transmitFailed: false
    inputs:
      flujo: exportar-organizacion
      ejecucion: "{{ execution.id }}"
      # Solo la tarea que falló: el mensaje del error puede traer hosts, tokens o datos de personas (el detalle está en la ejecución).
      motivo: "Falló la tarea {{ tasksWithState('FAILED')[0]['taskId'] }} (detalle en la ejecución de Kestra)"
triggers:
  - id: schedule_exportar_organizacion
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/2 * * * *"
    # Sondeo frecuente e idempotente: tras una caída de Kestra no se reproducen las corridas perdidas (la siguiente retoma lo pendiente).
    recoverMissedSchedules: NONE
finally:
  - id: publicar_logs
    type: io.kestra.plugin.core.log.Fetch
    tasksId:
      - despachar
    allowFailure: true
    allowWarning: true
