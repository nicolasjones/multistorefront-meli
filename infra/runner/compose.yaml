name: multistorefront-meli-runner-pr

# Pool de runners para los jobs de PR y de CI (MSF-703). Etiquetas `self-hosted,platform-local,platform-pr`.
# ARQUITECTURA (revisión C+S del lote 99): este Compose levanta solo el SUPERVISOR. El supervisor lee el PAT del archivo de secretos, pide a
# GitHub una configuración JIT por job y lanza un contenedor NUEVO por job (`docker run --rm`, ver supervisor.mjs y config-runner.mjs). Por eso:
#   - el PAT vive SOLO en el supervisor, que nunca ejecuta código de un job; el contenedor del job no lo tiene ni lo puede montar;
#   - cada job corre en un contenedor que se destruye al terminar: no persisten imágenes, procesos ni archivos de un job al siguiente;
#   - el contenedor del job corre como usuario `runner` (no root), con el runtime sysbox (su propio dockerd; SIN el socket del host) y con
#     topes de memoria, CPU y procesos (RUNNER_MEMORY_LIMIT, RUNNER_CPU_LIMIT, RUNNER_PIDS_LIMIT);
#   - store y caché de pnpm propios de cada contenedor (nada compartido entre jobs, productos ni con el pool de deploy).
# El único contenedor con el socket de Docker del host es este supervisor (necesita crear los contenedores de los jobs); es de confianza porque
# solo ejecuta el código de esta imagen. Sin sysbox los jobs no arrancan: no hay modo inseguro.
# Los jobs de deploy/migraciones/publicación NO van acá: el pool `platform-deploy` (compose.deploy.yaml). OJO: esa separación no es un límite de
# confianza frente a un workflow modificado en un PR; ver config-runner.mjs y docs/endurecimiento-infra.md.
services:
  supervisor:
    build: .
    image: multistorefront-meli-runner:local
    entrypoint: ["node", "/supervisor.mjs"]
    init: true
    # Endurecimiento del propio supervisor (no ejecuta código de jobs, pero tiene el socket del host): sin capacidades, sin escalada y de solo lectura.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    environment:
      RUNNER_ROLE: pr
      RUNNER_REPO: nicolasjones/multistorefront-meli
      RUNNER_NAME: multistorefront-meli-pr
      RUNNER_LABELS: self-hosted,platform-local,platform-pr
      RUNNER_IMAGE: multistorefront-meli-runner:local
      # Red DEDICADA de los jobs (subred fija, sin comunicación entre contenedores): el supervisor la crea si falta y el firewall (infra/vps/firewall-docker-user.sh,
      # --subred-jobs-pr) la aísla del host, de la tailnet y de la red interna. Nunca docker0.
      RUNNER_JOBS_NETWORK: ${RUNNER_JOBS_NETWORK_PR:-platform-runner-jobs-pr}
      RUNNER_JOBS_SUBNET: ${RUNNER_JOBS_SUBNET_PR:-172.29.250.0/24}
      RUNNER_RUNTIME: ${RUNNER_RUNTIME:-sysbox-runc}
      RUNNER_DOCKER_INTERNO: "1"
      # Cuántos jobs de este repo corren a la vez (una ranura = un contenedor por vez). 0 no levanta runners. Ver docs/deployment.md.
      RUNNER_SLOTS: ${RUNNER_REPLICAS:-3}
      # Topes POR CONTENEDOR DE JOB (el stack de Supabase del job corre dentro de él).
      RUNNER_MEMORY_LIMIT: ${RUNNER_MEMORY_LIMIT:-6g}
      RUNNER_CPU_LIMIT: ${RUNNER_CPU_LIMIT:-2}
      RUNNER_PIDS_LIMIT: ${RUNNER_PIDS_LIMIT:-4096}
      RUNNER_PNPM_NETWORK_CONCURRENCY: ${RUNNER_PNPM_NETWORK_CONCURRENCY:-16}
      RUNNER_PAT_FILE: /run/secrets/gh_runner_pat
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - gh_runner_pat
    restart: unless-stopped

secrets:
  gh_runner_pat:
    # Archivo del HOST con el PAT del runner: dueño root, modo 0400 (el supervisor rechaza un modo más abierto). Ver el runbook.
    file: ${GH_RUNNER_PAT_FILE:-/etc/platform-runner/gh_runner_pat}
