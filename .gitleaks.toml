# gitleaks — config de MSF.
# Extiende las reglas por defecto y silencia EJEMPLOS/PLACEHOLDERS (no secretos reales), medido en la
# auditoría 2026-10-18: los 22 hallazgos eran `.env.example`, tests y skills vendoreadas.
[extend]
useDefault = true

[allowlist]
description = "Ejemplos, fixtures de test y artefactos no-código"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env\.example\..*$''',
  '''(^|/)supabase/tests/''',
  '''(^|/)supabase/functions/.*\.test\.''',
  '''\.test\.[cm]?[jt]sx?$''',
  '''\.e2e\.[cm]?[jt]sx?$''',
  '''(^|/)\.claude/skills/''',
  '''(^|/)\.agents/skills/''',
  '''(^|/)\.specify/''',
  '''(^|/)graphify-out/''',
  '''(^|/)design/''',
  # MSF-929: el store local de pnpm y las cachés de dependencias son CÓDIGO DE TERCEROS descargado, no del repo: traen claves de
  # ejemplo de sus propios tests/docs y ponían el gate `quality` rojo con falsos positivos. Se excluyen SOLO estas carpetas de
  # dependencias; el código del repo (apps/, packages/, supabase/, infra/, scripts/, workers/...) sigue escaneándose completo.
  '''(^|/)\.pnpm-store/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.local/share/pnpm/''',
  '''(^|/)\.cache/pnpm/''',
]
# Vectores de prueba de CBU (públicos, válidos por dígito verificador, NO reales; MSF-240).
# Se exime solo el valor exacto, no el archivo: un secreto pegado en el doc sigue detectándose.
regexes = [
  '''0170099220000067797370''',
  '''2850590940090418135201''',
]
