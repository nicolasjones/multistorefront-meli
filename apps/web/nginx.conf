server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Compresión en el origen: el bundle principal supera los 600 KB y sin esto
  # viaja sin comprimir. `gzip_proxied any` cubre el caso detrás de
  # Traefik/Dokploy, que agrega cabeceras de proxy a la petición.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;
  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
  # Cache estáticos
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  # Healthcheck simple
  location /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
  # Ping: responde {"ok":true} (default_type fija el Content-Type JSON)
  location = /ping {
    access_log off;
    default_type application/json;
    return 200 '{"ok":true}';
  }
}
