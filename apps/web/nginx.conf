# MSF-149 (hallazgos 1 y 2): protección de /robots.txt y /sitemap.xml. `sitemap_por_dominio` arma hasta 50.000 filas
# para cualquier anónimo, así que no se la deja pegar a Supabase en cada pedido.
#  * Caché del lado servidor: TTL 5 min (igual al `max-age=300` de la función), 10 min sin uso para vaciarse, tope
#    de 20 MB en disco y 2 MB de índice en memoria (unas 16.000 claves). El contenido viejo solo se sirve ante error
#    del upstream y acotado por el `stale-if-error=300` de la función (no hay `updating`).
#  * Límite por IP DE CLIENTE + HOST: 20 pedidos/s con ráfaga de 100. Se cuenta cada pedido (también los HIT de la
#    caché: `limit_req` corre antes), por eso el cubo es holgado para crawlers legítimos y el costo de un HIT es
#    mínimo. Con la clave por host, un cliente que insista sobre una tienda no agota el cubo de las demás.
#  * La IP real: nginx corre en Dokploy detrás de Traefik, así que `$remote_addr` es la del proxy. Se toma de
#    `X-Forwarded-For` solo cuando el pedido llega desde un rango privado (red del proxy); un cliente de internet no
#    puede falsear su IP con esa cabecera. `nginx -t` solo valida sintaxis, no el comportamiento del límite.
limit_req_zone $binary_remote_addr$http_host zone=tienda_seo_ip:10m rate=20r/s;
proxy_cache_path /var/cache/nginx/tienda_seo levels=1:2 keys_zone=tienda_seo:2m max_size=20m inactive=10m use_temp_path=off;

server {
  listen 80;
  # IP real del cliente detrás de Traefik (ver arriba): rangos privados de la red del proxy.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  set_real_ip_from fc00::/7;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # SPA fallback. El HTML no se cachea: los assets ya llevan hash y van con
  # cache inmutable; un index.html cacheado deja al navegador con el bundle
  # viejo tras cada deploy (síntoma: «no aparece» una pantalla recién publicada
  # hasta hacer Ctrl+Shift+R). Forzar revalidación (ETag/304) es barato.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
  # F-TDA-21 (FR-023): robots.txt y sitemap.xml dependen del dominio que pide el buscador, así que no son
  # estáticos: se proxean a la Edge Function `tienda-seo` mandando el host original en `X-Tienda-Host`.
  # Los marcadores __SUPABASE_URL__ y __SUPABASE_ANON_KEY__ (claves públicas) se reemplazan al construir la imagen
  # (apps/web/Dockerfile). El nombre del servidor se resuelve al pedir, no al arrancar: un Supabase caído no
  # impide que nginx sirva la tienda (el buscador recibe 502 y reintenta).
  location ~ ^/(robots\.txt|sitemap\.xml)$ {
    resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;
    set $supabase_url "__SUPABASE_URL__";
    proxy_pass $supabase_url/functions/v1/tienda-seo/$1;
    proxy_ssl_server_name on;
    proxy_set_header X-Tienda-Host $http_host;
    proxy_set_header apikey "__SUPABASE_ANON_KEY__";
    proxy_set_header Authorization "Bearer __SUPABASE_ANON_KEY__";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    limit_req zone=tienda_seo_ip burst=100 nodelay;
    limit_req_status 429;
    # La URL del upstream es idéntica para todas las tiendas: el host del visitante va en la clave de caché, si no
    # la tienda A serviría su sitemap/robots (o un `Disallow: /`) a la B. Misma cabecera que `X-Tienda-Host`.
    proxy_cache tienda_seo;
    proxy_cache_key $http_host$uri;
    proxy_cache_valid 200 5m;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
    add_header X-Cache-Status $upstream_cache_status always;
  }
  # Cache estáticos
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  # Healthcheck simple
  location /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
  # Ping: responde {"ok":true} (default_type fija el Content-Type JSON)
  location = /ping {
    access_log off;
    default_type application/json;
    return 200 '{"ok":true}';
  }
}
