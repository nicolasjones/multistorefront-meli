server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
  # Cache estáticos
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  # Healthcheck simple
  location /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
  # Ping: responde {"ok":true} (default_type fija el Content-Type JSON)
  location = /ping {
    access_log off;
    default_type application/json;
    return 200 '{"ok":true}';
  }
}
