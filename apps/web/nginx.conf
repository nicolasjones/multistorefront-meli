# MSF-149 (hallazgos 1 y 2): protección de /robots.txt y /sitemap.xml. `sitemap_por_dominio` arma hasta 50.000 filas
# para cualquier anónimo, así que no se la deja pegar a Supabase en cada pedido.
#  * Caché del lado servidor: TTL 5 min (igual al `max-age=300` de la función), 10 min sin uso para vaciarse, tope
#    de 20 MB en disco y 2 MB de índice en memoria (unas 16.000 claves). NO se usa `proxy_cache_use_stale`: se probó
#    con nginx real que una entrada con tráfico continuo se sigue sirviendo vieja sin límite mientras el upstream
#    falla (`stale-if-error` del upstream NO la acota: tiene menor prioridad que `proxy_cache_use_stale`). Sin stale,
#    una tienda desactivada deja de verse como activa a lo sumo 5 min después, caiga o no Supabase; si Supabase
#    cae el buscador recibe 502 y reintenta.
#  * Límite de pedidos, dos zonas: (1) IP de cliente + host, 20 pedidos/s con ráfaga de 100: un cliente que insiste
#    sobre una tienda no agota el cubo de las demás; (2) solo IP, 100 pedidos/s con ráfaga de 200: quien rota el
#    `Host` para abrir un cubo nuevo por pedido (y de paso llenar la caché) igual choca con este tope. Se cuenta cada
#    pedido (también los HIT: `limit_req` corre antes de la caché), por eso los cubos son holgados para crawlers.
#  * La IP real: nginx corre en Dokploy detrás de Traefik, así que `$remote_addr` es la del proxy. Se toma de
#    `X-Forwarded-For` solo cuando el pedido llega desde un rango privado (red del proxy); un cliente de internet no
#    puede falsear su IP con esa cabecera. Si delante de Traefik hubiera Cloudflare u otro proxy, habría que sumar sus
#    rangos con `set_real_ip_from` y usar `real_ip_header CF-Connecting-IP` (ver docs/deployment.md).
#    `nginx -t` solo valida sintaxis, no el comportamiento del límite.
limit_req_zone $binary_remote_addr$http_host zone=tienda_seo_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=tienda_seo_global:10m rate=100r/s;
proxy_cache_path /var/cache/nginx/tienda_seo levels=1:2 keys_zone=tienda_seo:2m max_size=20m inactive=10m use_temp_path=off;

server {
  listen 80;
  # IP real del cliente detrás de Traefik (ver arriba): rangos privados de la red del proxy.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  set_real_ip_from fc00::/7;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # SPA fallback. El HTML no se cachea: los assets ya llevan hash y van con
  # cache inmutable; un index.html cacheado deja al navegador con el bundle
  # viejo tras cada deploy (síntoma: «no aparece» una pantalla recién publicada
  # hasta hacer Ctrl+Shift+R). Forzar revalidación (ETag/304) es barato.
  location / {
    add_header Cache-Control "no-cache";
    # MSF-164 (hallazgo 5): Content-Security-Policy SOLO EN MODO REPORTE. Lista los orígenes que la tienda pública
    # necesita (Supabase, Google Analytics/Tag Manager y Meta Pixel); el navegador informa en su consola lo que se
    # saldría de la lista, sin bloquear nada. Es el mismo index.html del panel, así que el plan de endurecimiento
    # (docs/tecnico/tienda-contenido-y-analitica.md) pasa a `Content-Security-Policy` recién tras revisar los reportes.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://connect.facebook.net; connect-src 'self' __SUPABASE_URL__ https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com https://connect.facebook.net; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    try_files $uri $uri/ /index.html;
  }
  # F-TDA-21 (FR-023): robots.txt y sitemap.xml dependen del dominio que pide el buscador, así que no son
  # estáticos: se proxean a la Edge Function `tienda-seo` mandando el host original en `X-Tienda-Host`.
  # Los marcadores __SUPABASE_URL__ y __SUPABASE_ANON_KEY__ (claves públicas) se reemplazan al construir la imagen
  # (apps/web/Dockerfile). El nombre del servidor se resuelve al pedir, no al arrancar: un Supabase caído no
  # impide que nginx sirva la tienda (el buscador recibe 502 y reintenta).
  location ~ ^/(robots\.txt|sitemap\.xml)$ {
    resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;
    set $supabase_url "__SUPABASE_URL__";
    proxy_pass $supabase_url/functions/v1/tienda-seo/$1;
    proxy_ssl_server_name on;
    proxy_set_header X-Tienda-Host $http_host;
    proxy_set_header apikey "__SUPABASE_ANON_KEY__";
    proxy_set_header Authorization "Bearer __SUPABASE_ANON_KEY__";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    limit_req zone=tienda_seo_ip burst=100 nodelay;
    limit_req zone=tienda_seo_global burst=200 nodelay;
    limit_req_status 429;
    # La URL del upstream es idéntica para todas las tiendas: el host del visitante va en la clave de caché, si no
    # la tienda A serviría su sitemap/robots (o un `Disallow: /`) a la B. Misma cabecera que `X-Tienda-Host`.
    proxy_cache tienda_seo;
    proxy_cache_key $http_host$uri;
    proxy_cache_valid 200 5m;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    add_header X-Cache-Status $upstream_cache_status always;
  }
  # Cache estáticos
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  # Healthcheck simple
  location /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
  # Ping: responde {"ok":true} (default_type fija el Content-Type JSON)
  location = /ping {
    access_log off;
    default_type application/json;
    return 200 '{"ok":true}';
  }
}
