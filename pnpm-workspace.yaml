packages:
  - apps/*
  - packages/*
  - workers/*

# El primer worker que use ghost-cursor-playwright o patchright-core va a
# traer su propia dependencia de playwright-core más nueva que la pinneada
# en su package.json — sin este override, TypeScript ve dos versiones de
# los tipos de `Page` a la vez y falla el build. El servidor de
# infra/playwright (patchright-core) también está pinneado a esta misma
# versión (ver su Dockerfile) — cliente y servidor deben coincidir para el
# protocolo de conexión remota.
overrides:
  playwright-core: "1.61.0"
  # MSF-820 (@mui/x-charts): los 10 d3-* transitivos de @mui/x-charts-vendor tienen una versión publicada el
  # 2026-11-03 (menos de 2 semanas de antigüedad al incorporarse). Se fijan a la versión inmediata anterior, que
  # cumple el rango de x-charts-vendor y tiene meses (o años) de antigüedad. Se puede quitar este bloque cuando
  # esas versiones superen las 2 semanas (desde 2026-11-17) y se re-resuelva el lockfile.
  d3-array: "3.2.4"
  d3-color: "3.1.0"
  d3-format: "3.1.2"
  d3-interpolate: "3.0.1"
  d3-path: "3.1.0"
  d3-scale: "4.0.2"
  d3-shape: "3.2.0"
  d3-time: "3.1.0"
  d3-time-format: "4.1.0"
  d3-timer: "3.0.1"

onlyBuiltDependencies:
  - esbuild
  - supabase

# Refine MUI supports MUI 6, while its optional notistack 2 dependency still
# advertises an old MUI 5-only peer range.
peerDependencyRules:
  allowedVersions:
    "@mui/material": "6"

# packages/mcp-server trae vitest (vía esbuild) por primera vez a este
# repo — sin esto, pnpm install --frozen-lockfile falla en un entorno
# limpio (CI, clon nuevo) con ERR_PNPM_IGNORED_BUILDS. Mismo bug real
# encontrado en el producto derivado al adoptar este mecanismo.
allowBuilds:
  esbuild: true
