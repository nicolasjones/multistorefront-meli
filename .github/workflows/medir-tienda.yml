name: Medición de rendimiento de la tienda

# Medición en perfil MÓVIL del catálogo y la ficha de las dos tiendas del seed (MSF-552 · T071/SC-010 de la
# épica MSF-167). NO bloquea ningún PR: corre de noche o a pedido (`workflow_dispatch`) y deja el reporte como
# artifact. El protocolo está en `docs/tiendas-online.md` («Rendimiento en celular»), el comando en
# `pnpm medir:tienda` y el perfil de Lighthouse en `.lighthouserc.tienda.json`.
#
# Reusa el stack de Supabase del CI (una RANURA, con el seed de `supabase/seed.sql`) igual que el job
# `e2e-tienda` de validate.yml y el `E2E nocturno`: ver `scripts/supabase-ci.mjs` y `docs/deployment.md`.

on:
  schedule:
    # 03:00 UTC de los lunes: fuera de la ventana del E2E nocturno (05:00) y del ci-janitor (04:17).
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      productos:
        description: 'Cantidad de productos sintéticos para medir `publico.catalogo_pagina_por_dominio`.'
        required: false
        default: '500'
        type: string

permissions:
  contents: read

# Una sola corrida a la vez: cada una levanta su propio stack y su propia web.
concurrency:
  group: medir-tienda
  cancel-in-progress: false

env:
  # El que reclama una ranura es quien recicla las vencidas: el TTL va por encima del timeout del job.
  SUPABASE_CI_LOCK_TTL_MIN: 75
  MEDIR_TIENDA_PUERTO: '4312'

jobs:
  medir:
    # Kill switch sin PR: `CI_PAUSED=true` (el mismo de validate.yml) o `CI_MEDIR_TIENDA=false` apagan el job.
    if: ${{ vars.CI_PAUSED != 'true' && vars.CI_MEDIR_TIENDA != 'false' }}
    runs-on: [self-hosted, platform-local]
    timeout-minutes: 45
    steps:
      # El run programado prueba `dokploy` (el workflow vive en la rama por defecto); uno manual, la rama del run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dokploy' || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Supabase CLI (2.116.0; reusa el del runner si ya está)
        run: |
          if command -v supabase >/dev/null 2>&1 && supabase --version 2>/dev/null | grep -q '2.116.0'; then
            echo "supabase 2.116.0 ya presente en el runner -> no descargo"
          else
            curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_2.116.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin supabase
          fi
          supabase --version

      - name: Preparar entorno del job (work dir y anfitrión del Docker)
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP:-/tmp}/medir-tienda-$GITHUB_RUN_ID"
          mkdir -p "$WORK"
          # Dentro del contenedor del runner, 127.0.0.1 es el contenedor y NO el Docker del host donde se publican
          # los puertos del stack (docker-fuera-de-docker): se alcanzan por `host.docker.internal`.
          if [ -f /.dockerenv ]; then HOST_DOCKER=host.docker.internal; else HOST_DOCKER=127.0.0.1; fi
          { echo "MEDIR_WORK=$WORK"; echo "HOST_DOCKER=$HOST_DOCKER"; } >> "$GITHUB_ENV"
          echo "work=$WORK host=$HOST_DOCKER"

      - name: Reservar la ranura del stack de Supabase
        env:
          SUPABASE_CI_LOCK_MIN: 5
        run: node scripts/supabase-ci.mjs reclamar
      - name: Preparar el stack del CI (config en copia temporal, sin tocar supabase/config.toml)
        run: |
          printf 'SEGUIMIENTO_IP_SALT=%s\n' "sal-medir-tienda-$GITHUB_RUN_ID" > supabase/.env
          pnpm db:ci:preparar
      - name: Puente al Docker del host (sólo en el contenedor del runner)
        if: env.HOST_DOCKER == 'host.docker.internal'
        run: |
          nohup node scripts/supabase-ci.mjs puente > "$MEDIR_WORK/puente.log" 2>&1 &
          echo $! > "$MEDIR_WORK/puente.pid"
          for intento in $(seq 50); do (: > "/dev/tcp/127.0.0.1/$SUPABASE_DB_PORT") 2>/dev/null && break; sleep 0.2; done
          kill -0 "$(cat "$MEDIR_WORK/puente.pid")" || { cat "$MEDIR_WORK/puente.log"; exit 1; }
          echo "puente activo (pid $(cat "$MEDIR_WORK/puente.pid"))"
      - name: Levantar el stack de Supabase del CI con API
        run: |
          supabase stop --workdir "$SUPABASE_CI_WORKDIR" --no-backup || true
          supabase start --workdir "$SUPABASE_CI_WORKDIR" --ignore-health-check -x studio,mailpit,imgproxy,logflare,vector,edge-runtime,supavisor,realtime,postgres-meta
      # Sin `pnpm db:reset:ci`: recrea el esquema `public` y con él se pierden los privilegios por defecto de
      # `service_role`. Se migra con `migration up` y se siembra con el psql de la propia imagen de la base.
      - name: Migrar y sembrar (las dos tiendas del seed)
        run: |
          supabase migration up --local --workdir "$SUPABASE_CI_WORKDIR"
          docker exec -i "supabase_db_${SUPABASE_CI_PROJECT_ID}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/seed.sql

      - name: Reiniciar PostgREST, esperar la API y exponer el entorno
        run: |
          docker restart "supabase_rest_${SUPABASE_CI_PROJECT_ID}"
          eval "$(supabase status -o env --workdir "$SUPABASE_CI_WORKDIR" | sed 's/^/export /')"
          URL="${API_URL/127.0.0.1/$HOST_DOCKER}"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          esperar() {
            codigo=000
            for intento in $(seq 60); do
              codigo=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $ANON_KEY" "$URL$2" || true)
              [ "$codigo" = "200" ] && return 0
              sleep 2
            done
            echo "$1 no respondió 200 en $URL$2 (último: $codigo)"
            return 1
          }
          esperar PostgREST /rest/v1/ || { docker logs --tail 40 "supabase_rest_${SUPABASE_CI_PROJECT_ID}" || true; exit 1; }
          esperar Auth /auth/v1/health || { docker logs --tail 40 "supabase_auth_${SUPABASE_CI_PROJECT_ID}" || true; exit 1; }
          esperar Storage /storage/v1/status || { docker logs --tail 40 "supabase_storage_${SUPABASE_CI_PROJECT_ID}" || true; exit 1; }
          tiendas=$(curl -fsS -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "Accept-Profile: dominio" "$URL/rest/v1/tiendas?select=dominio")
          echo "tiendas sembradas: $tiendas"
          case "$tiendas" in *mundojc.localhost*sanjavucho.localhost*|*sanjavucho.localhost*mundojc.localhost*) ;; *) echo "Faltan las tiendas del seed"; exit 1 ;; esac
          {
            echo "SUPABASE_URL=$URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "VITE_SUPABASE_URL=$URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "VITE_PANEL_HOSTS=localhost,127.0.0.1"
            echo "TIENDA_PUERTO=$MEDIR_TIENDA_PUERTO"
          } >> "$GITHUB_ENV"

      # Sólo `vite build` (el type-check lo corre `pnpm build` en el job `application`). `VITE_PANEL_HOSTS`: sin él
      # el panel se sirve en `mundojc.localhost` y las tiendas no se resuelven.
      - name: Compilar la web contra el stack
        run: pnpm --filter @platform/web exec vite build

      # `--host 0.0.0.0`: las tiendas se entran por `*.localhost` (Chromium los resuelve a loopback) y la medición
      # los pide por host, no por `localhost`.
      - name: Servir la web (vite preview)
        run: |
          set -euo pipefail
          setsid nohup pnpm --dir apps/web exec vite preview --port "$MEDIR_TIENDA_PUERTO" --strictPort --host 0.0.0.0 > "$MEDIR_WORK/vite.log" 2>&1 &
          echo $! > "$MEDIR_WORK/vite.pid"
          for i in $(seq 60); do
            curl -fsS -o /dev/null "http://127.0.0.1:$MEDIR_TIENDA_PUERTO/" && web=1 && break
            kill -0 "$(cat "$MEDIR_WORK/vite.pid") 2>/dev/null" || { echo "::error::vite preview murió"; cat "$MEDIR_WORK/vite.log"; exit 1; }
            sleep 1
          done
          [ "${web:-0}" = 1 ] || { echo "::error::la web no respondió en $MEDIR_TIENDA_PUERTO"; cat "$MEDIR_WORK/vite.log"; exit 1; }
          echo "web sirviendo en $MEDIR_TIENDA_PUERTO"

      - name: "Instalar Chromium (Lighthouse usa el de Playwright: CHROME_PATH)"
        run: |
          if ls "$HOME"/.cache/ms-playwright/chromium-* >/dev/null 2>&1; then
            pnpm --filter @platform/web exec playwright install chromium
            pnpm --filter @platform/web exec playwright install-deps chromium
          else
            pnpm --filter @platform/web exec playwright install --with-deps chromium
          fi
          CHROME=$(ls -d "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux/chrome | head -1)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$CHROME"

      # Lighthouse móvil (celular 390×844, CPU ×4, «4G lento») sobre `/catalogo` y `/producto/:id` de las dos
      # tiendas del seed. El script deja el resumen en `reports/lighthouse-tienda/`.
      - name: Medir Lighthouse en perfil móvil
        run: pnpm medir:tienda

      # La RPC del catálogo con un catálogo grande: N productos sintéticos en una transacción que se revierte
      # (no deja datos). Los NOTICE con los milisegundos salen por stderr.
      - name: Medir `publico.catalogo_pagina_por_dominio` con catálogo grande
        env:
          PRODUCTOS: ${{ inputs.productos || '500' }}
        run: |
          mkdir -p reports/medir-tienda
          docker exec -i "supabase_db_${SUPABASE_CI_PROJECT_ID}" psql -U postgres -d postgres -v N="$PRODUCTOS" -f - < scripts/medir-tienda-catalogo.sql 2>&1 | tee reports/medir-tienda/rpc-catalogo.txt

      - name: Resumen en $GITHUB_STEP_SUMMARY
        if: always()
        run: |
          {
            echo '## Rendimiento de la tienda (MSF-552)'
            echo
            [ -f reports/lighthouse-tienda/resumen.md ] && cat reports/lighthouse-tienda/resumen.md
            echo
            [ -f reports/medir-tienda/rpc-catalogo.txt ] && cat reports/medir-tienda/rpc-catalogo.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir el reporte de la medición
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medir-tienda
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Limpieza (procesos propios, stack de Supabase y ranura)
        if: always()
        timeout-minutes: 10
        run: |
          set +e
          for n in vite puente; do
            p="$MEDIR_WORK/$n.pid"
            [ -f "$p" ] || continue
            pid=$(cat "$p")
            if [ "$n" = vite ]; then kill -TERM -- "-$pid" 2>/dev/null; else kill -TERM "$pid" 2>/dev/null; fi
            echo "PID $pid ($n) terminado"
          done
          sleep 2
          for n in vite puente; do
            p="$MEDIR_WORK/$n.pid"
            [ -f "$p" ] || continue
            pid=$(cat "$p")
            if [ "$n" = vite ]; then kill -KILL -- "-$pid" 2>/dev/null; else kill -KILL "$pid" 2>/dev/null; fi
          done
          if [ -n "$SUPABASE_CI_WORKDIR" ]; then
            supabase stop --workdir "$SUPABASE_CI_WORKDIR" --no-backup
            L="com.supabase.cli.project=$SUPABASE_CI_PROJECT_ID"
            ids=$(docker ps -aq --filter "label=$L")
            [ -n "$ids" ] && { echo "quedaban contenedores; docker rm -f"; docker rm -f $ids >/dev/null; }
            vols=$(docker volume ls -q --filter "label=$L")
            [ -n "$vols" ] && docker volume rm -f $vols >/dev/null
            docker network rm "supabase_network_$SUPABASE_CI_PROJECT_ID" >/dev/null 2>&1
          fi
          rm -f supabase/.env
          node scripts/supabase-ci.mjs liberar
          exit 0
