name: Validate diario (dokploy)

# MSF-685 (decisión tomada): `Validate` NO corre en cada push a `dokploy` (cada merge de PR ya pasó su gate por PR y encolar
# otra corrida completa por push duplicaría el costo en los runners self-hosted). El gate por PR queda igual. A cambio, una vez
# por día se corre `Validate` COMPLETO sobre `dokploy`, para detectar a tiempo lo que el gate por PR no ve: dos PRs verdes por
# separado que juntos rompen, tests inestables, deriva de dependencias o de infraestructura.
#
# `schedule` solo corre desde la rama POR DEFECTO (`main`), pero queremos validar `dokploy` con SU versión de `validate.yml`.
# Por eso este workflow solo DISPARA (`workflow_dispatch` sobre `--ref dokploy`, un evento que el GITHUB_TOKEN sí puede
# provocar): el run resultante vive en Actions → Validate, rama `dokploy`, con su check `validacion`. Si queda rojo, hay que
# arreglarlo antes de promover (docs/control-ci.md, «Corrida diaria de Validate sobre dokploy»).
#
# La primera corrida ocurre cuando este archivo llegue a `main` (promoción de dokploy). Se puede probar antes a mano con
# «Run workflow» sobre cualquier rama que lo tenga.
on:
  schedule:
    # 06:23 UTC: de madrugada en Argentina, con los runners libres; minuto impar para no coincidir con el janitor (17 */6).
    - cron: "23 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: validate-diario
  cancel-in-progress: false

jobs:
  disparar:
    # Solo en el repo propio: un fork (si el schedule llegara a habilitarse allí) no gasta runners ni dispara nada.
    if: github.repository == 'nicolasjones/multistorefront-meli'
    runs-on: [self-hosted, platform-local]
    timeout-minutes: 10
    steps:
      - name: Disparar Validate sobre dokploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # e2e_record=false: sin video/traza de todo (más pesado); la suite normal del CI corre igual.
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/validate.yml/dispatches" \
            -d '{"ref":"dokploy","inputs":{"e2e_record":"false","e2e_sesion":"false"}}'
          echo "Validate disparado sobre dokploy. Resultado: Actions → Validate → rama dokploy." | tee -a "$GITHUB_STEP_SUMMARY"
