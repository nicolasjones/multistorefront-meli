name: docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: instalar MkDocs
        run: pip install -r requirements-docs.txt
      - name: inventario y manifest al día
        run: |
          node scripts/docs-inventario.mjs
          node scripts/docs-manifest.mjs
          git diff --exit-code docs/_generated docs/manifest.json
      - name: links, nav e inventario
        run: node scripts/docs-check.mjs
      - name: drift de fuentes
        run: node scripts/docs-drift.mjs
      - name: build estricto
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-site
          path: site
          retention-days: 14
          if-no-files-found: ignore
