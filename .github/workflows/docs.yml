name: docs

on:
  # Solo PR hacia main: con fuentes de directorio entero (specs, apps/web/src) el drift salta en cualquier
  # PR a dokploy. El manifest se rebasea una vez, en el PR del Release (docs/documentacion-cambios.md).
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, platform-local]
    # MSF-926: tope explícito (el default de GitHub son 360 min: un job colgado ocuparía el runner self-hosted horas).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: instalar MkDocs
        run: pip install -r requirements-docs.txt
      - name: inventario y manifest al día
        run: |
          node scripts/docs-inventario.mjs
          node scripts/docs-manifest.mjs
          git diff --exit-code docs/_generated docs/manifest.json
      - name: links, nav e inventario
        run: node scripts/docs-check.mjs
      - name: drift de fuentes
        run: node scripts/docs-drift.mjs
      - name: build estricto
        run: mkdocs build --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docs-site
          path: site
          retention-days: 14
          if-no-files-found: ignore
