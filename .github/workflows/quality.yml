name: quality

# F1 del programa de calidad: checks DETERMINISTAS sobre el PR (secretos, SAST, dead code, duplicación,
# ciclos de arquitectura, versiones). REQUERIDO (baseline limpio): si hay hallazgos, el PR no mergea.
# Complementa `Validate`; no lo reemplaza.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint compara base..head: necesita el historial (no shallow).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # REQUERIDO (FEAT-169): el baseline quedó limpio (gitleaks/knip/jscpd/dependency-cruiser/syncpack/commitlint).
      # Si aparece un hallazgo, el check falla y no se mergea (junto con `database`).
      - name: gitleaks (binario nativo)
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          fi
          gitleaks version
      - name: calidad (determinista)
        env:
          # Las promociones a main (dokploy o promo/*) traen cientos de commits ya validados en sus PRs de
          # historia: re-lintear todo ese historial falla por commits viejos. Sin rango, calidad omite commitlint.
          COMMITLINT_FROM: ${{ !(github.base_ref == 'main' && (github.head_ref == 'dokploy' || startsWith(github.head_ref, 'promo/'))) && github.event.pull_request.base.sha || '' }}
          COMMITLINT_TO: ${{ !(github.base_ref == 'main' && (github.head_ref == 'dokploy' || startsWith(github.head_ref, 'promo/'))) && github.event.pull_request.head.sha || '' }}
        run: pnpm calidad
      - name: subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calidad-reporte
          path: reports/calidad.md
          if-no-files-found: ignore
