name: quality

# F1 del programa de calidad: checks DETERMINISTAS sobre el PR (secretos, SAST, dead code, duplicación,
# ciclos de arquitectura, versiones). NO bloquea todavía (`continue-on-error`): primero se observa, después
# se vuelve requerido. Complementa `Validate`; no lo reemplaza.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint compara base..head: necesita el historial (no shallow).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # REQUERIDO (FEAT-169): el baseline quedó limpio (gitleaks/knip/jscpd/dependency-cruiser/syncpack/commitlint).
      # Si aparece un hallazgo, el check falla y no se mergea (junto con `database`).
      - name: calidad (determinista)
        env:
          COMMITLINT_FROM: ${{ github.event.pull_request.base.sha }}
          COMMITLINT_TO: ${{ github.event.pull_request.head.sha }}
        run: pnpm calidad
      - name: subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calidad-reporte
          path: reports/calidad.md
          if-no-files-found: ignore

  # SAST con reglas VENDORIZADAS, corriendo DENTRO de la imagen (container:) — evita el docker anidado
  # del runner (que hacía que `docker run semgrep` fallara/saltara). Cubre TS/TSX y edge functions.
  sast:
    runs-on: [self-hosted, platform-local]
    container: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: semgrep (reglas vendorizadas)
        run: semgrep scan --metrics=off --config .semgrep/registry/typescript.yml --config .semgrep/registry/react.yml --error apps packages supabase/functions
