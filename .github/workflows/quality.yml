name: quality

# F1 del programa de calidad: checks DETERMINISTAS sobre el PR (secretos, SAST, dead code, duplicación,
# ciclos de arquitectura, versiones). El job FALLA si hay hallazgos, pero NO bloquea el merge por sí solo:
# el ruleset de GitHub exige únicamente `validacion`. Para volverlo bloqueante hay que agregar `quality`
# al ruleset (ver docs/calidad.md). Complementa `Validate`; no lo reemplaza.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_PR || '["self-hosted","platform-local"]') }}
    # MSF-926: tope explícito (el default de GitHub son 360 min: un job colgado ocuparía el runner self-hosted horas).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # commitlint compara base..head: necesita el historial (no shallow).
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # FEAT-169: el baseline quedó limpio (gitleaks/knip/jscpd/dependency-cruiser/syncpack/commitlint).
      # Si aparece un hallazgo, el job falla (rojo visible en el PR); el bloqueo real depende del ruleset.
      - name: gitleaks (binario nativo)
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            bash scripts/instalar-binario-verificado.sh https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks "$RUNNER_TEMP/bin"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/bin:$PATH"
          fi
          gitleaks version
      - name: calidad (determinista)
        env:
          COMMITLINT_FROM: ${{ github.event.pull_request.base.sha }}
          COMMITLINT_TO: ${{ github.event.pull_request.head.sha }}
        run: pnpm calidad
      - name: subir reporte
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calidad-reporte
          path: |
            reports/calidad.md
            reports/calidad.log
          if-no-files-found: ignore
