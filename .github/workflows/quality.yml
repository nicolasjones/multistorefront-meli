name: quality

# F1 del programa de calidad: checks DETERMINISTAS sobre el PR (secretos, SAST, dead code, duplicación,
# ciclos de arquitectura, versiones). El job FALLA si hay hallazgos, pero NO bloquea el merge por sí solo:
# el ruleset de GitHub exige únicamente `validacion`. Para volverlo bloqueante hay que agregar `quality`
# al ruleset (ver docs/calidad.md). Complementa `Validate`; no lo reemplaza.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint compara base..head: necesita el historial (no shallow).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # FEAT-169: el baseline quedó limpio (gitleaks/knip/jscpd/dependency-cruiser/syncpack/commitlint).
      # Si aparece un hallazgo, el job falla (rojo visible en el PR); el bloqueo real depende del ruleset.
      - name: gitleaks (binario nativo)
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          fi
          gitleaks version
      - name: calidad (determinista)
        env:
          COMMITLINT_FROM: ${{ github.event.pull_request.base.sha }}
          COMMITLINT_TO: ${{ github.event.pull_request.head.sha }}
        run: pnpm calidad
      - name: subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calidad-reporte
          path: |
            reports/calidad.md
            reports/calidad.log
          if-no-files-found: ignore
