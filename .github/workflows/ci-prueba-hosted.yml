name: Prueba runners hosted

# Prueba de tiempos (no requerida): corre el job `database` de Validate en un runner estándar de GitHub
# (`ubuntu-latest`, gratis en repos públicos) para medir cuánto tarda sin la cola ni la CPU saturada de VPS2.
# Corre al hacer push a la rama `ci/runners-hosted-prueba` (o a mano). Si se adopta, se integra en `validate.yml` y se documenta en `docs/control-ci.md`.
on:
  workflow_dispatch:
  push:
    branches: [ci/runners-hosted-prueba]

permissions:
  contents: read

jobs:
  database-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Los scripts asumen un runner dentro de Docker: acá el Docker es el de la propia VM.
      SUPABASE_CI_LOCK_DIR: ${{ runner.temp }}/ci-locks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: pg_prove y host.docker.internal
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client libtap-parser-sourcehandler-pgtap-perl
          echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
          pg_prove --version
      - run: node --test scripts/supabase-ci.test.mjs
      - name: Reservar la ranura del stack de Supabase
        run: node scripts/supabase-ci.mjs reclamar
      - run: pnpm db:ci:preparar
      - name: Levantar el stack de Supabase del CI
        run: |
          node scripts/supabase-ci.mjs puente &
          trap "kill \$!" EXIT
          for intento in $(seq 50); do (: > "/dev/tcp/127.0.0.1/$SUPABASE_DB_PORT") 2>/dev/null && break; sleep 0.2; done
          supabase start --workdir "$SUPABASE_CI_WORKDIR" -x studio,mailpit,imgproxy,logflare,vector,edge-runtime,supavisor,realtime,postgres-meta,kong,postgrest
      - run: pnpm db:reset:ci
      - run: pnpm test:db:ci
      - name: Liberar la ranura del stack de Supabase
        if: always()
        run: node scripts/supabase-ci.mjs liberar
