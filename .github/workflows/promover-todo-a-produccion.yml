name: Promover todo a producción

# Punto único de promoción a producción (spec 20261005-140934-promover-
# todo-produccion). Agrupa en un solo workflow_dispatch los mecanismos de
# plataforma que hoy tienen split staging→producción: migraciones de
# Supabase, infraestructura VPS (Kestra/Superset/Nango) y flows de Kestra
# — los tres vía workflow_call, sin duplicar sus steps.
#
# Cada uno sigue verificando por su cuenta que su staging corrió
# exitosamente antes de tocar cualquier secret de producción
# (scripts/verificar-staging-exitoso.mjs, bug gate-migraciones-stg-prd) —
# este workflow no debilita ni saltea esa verificación, solo agrupa el
# disparo. Los 3 jobs son independientes entre sí (sin `needs`): si uno
# falla, los demás se promueven igual si su propio staging es válido.
# Verificado en vivo de punta a punta (2026-10-05): los 3 se promovieron
# correctamente en una corrida real.
#
# Refine/Vercel QUEDA FUERA de este punto único (decisión del usuario,
# 2026-10-05) — no por falta de intento, por un límite real de plan: el
# plan Hobby/personal de Vercel no permite que la "Production Branch" sea
# distinta de la rama de integración del repo, ni por API ni por UI
# (confirmado en vivo, ver research.md §3). Como además todas las specs de
# este repo mergean a `main`, separar main de "lo que Vercel considera
# producción" solo es posible pagando Vercel Pro o reestructurando a qué
# rama mergea todo el repo — ninguna de las dos se hace en esta spec.
# `main` sigue desplegando a producción automáticamente en cada push,
# igual que antes de esta spec — no se empeoró nada, tampoco se arregló
# para Refine. Revisar si corresponde pagar el plan cuando haya un caso de
# negocio real que lo justifique.
#
# Regla de extensión (FR-007 de la spec): todo mecanismo de plataforma
# nuevo con su propio split staging→producción debe sumar su job acá —
# ver specs/20261003-105444-cicd-staging-produccion/contracts/
# workflow-gate.md para el contrato completo. No se habilita un
# workflow_dispatch de producción nuevo que quede aislado de este punto
# único.
#
# El OK para disparar este workflow sigue siendo una decisión humana
# explícita — convención de operación, no un control técnico de GitHub
# (ver Assumptions de la spec; required reviewers evaluado y descartado,
# no disponible sin migrar a una Organization con plan de pago).
#
# permissions.actions:read (bug real, verificado en vivo): un workflow
# reusable no puede pedir más permisos de los que otorga quien lo llama.
# Los 3 workflows reutilizados declaran `actions: read` en su propio
# archivo (lo necesita scripts/verificar-staging-exitoso.mjs) — sin esa
# misma concesión acá arriba, GitHub rechaza la corrida COMPLETA con
# startup_failure y 0 jobs, antes de que arranque nada.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  migraciones-cloud:
    uses: ./.github/workflows/migraciones-cloud.yml
    secrets: inherit

  deploy-infraestructura-vps:
    uses: ./.github/workflows/deploy-infraestructura-vps.yml
    secrets: inherit

  publicar-flows-kestra:
    uses: ./.github/workflows/publicar-flows-kestra.yml
    secrets: inherit
