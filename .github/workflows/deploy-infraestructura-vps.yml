name: Deploy infraestructura VPS

# CI de deploy de infraestructura del VPS (Kestra, Superset, proxy reverso)
# con gate staging-producción (spec 20261003-105444-cicd-staging-produccion).
# scripts/deploy-vps.mjs no cambia de código: el runner controla el Docker
# remoto del VPS vía DOCKER_HOST=ssh://usuario@host. VPS_SSH_PRIVATE_KEY es
# la clave privada en texto plano (PEM), tal cual la acepta un secret de
# GitHub Actions (soporta multilínea nativamente) — sin Base64 intermedio,
# a diferencia de SECRET_ORQUESTACION_SSH_PRIVATE_KEY (spec 014), que sí lo
# usa por un motivo propio de ese flujo. El archivo
# .env.<entorno> que el script sigue exigiendo se sintetiza en el workspace
# efímero del job a partir del secret VPS_DEPLOY_ENV — nunca persiste en el
# filesystem del VPS ni se commitea. Ver
# specs/20261003-105444-cicd-staging-produccion/contracts/cli-deploy-vps-ci.md
# y research.md §1-2. Todos los secrets se pasan por `env:`, nunca
# interpolados directo en el texto de `run:` (evita que queden embebidos en
# el comando ejecutado si el valor tuviera caracteres especiales).
#
# Gate: `staging` dispara solo en push (automático); `production` solo se
# dispara manualmente desde la pestaña Actions ("Run workflow" →
# workflow_dispatch) — alternativa sin costo a GitHub Environment +
# required reviewers (plan de pago no disponible aquí). Decisión del
# coordinador, ver tasks.md T027. Los Environments se conservan para
# separar secrets por entorno; solo se cae la regla de required reviewers.
#
# Gate stg→prd (bug gate-migraciones-stg-prd, 2026-10-05): `production` no
# puede usar `needs: staging` (dispara por workflow_dispatch, no por push,
# nunca es la misma corrida). En su lugar, el primer step de `production`
# corre scripts/verificar-staging-exitoso.mjs contra la API de runs de
# GitHub Actions y exige un run de `staging` con conclusion=success para
# el mismo head_sha antes de tocar VPS_SSH_PRIVATE_KEY/VPS_DEPLOY_ENV de
# producción. Mismo mecanismo que migraciones-cloud.yml — ver ahí el
# porqué de no depender de required reviewers (repos derivados privados).
#
# Clave de host (MSF-706): ya NO se usa ssh-keyscan (confiaba a ciegas en lo que
# contestara la red en cada despliegue). La clave pública del host va FIJADA
# (secret VPS_SSH_KNOWN_HOSTS o infra/vps/known_hosts.<entorno>) y la conexión
# corre con StrictHostKeyChecking=yes (scripts/preparar-known-hosts-vps.mjs);
# sin clave fijada el job falla con instrucciones. Ver docs/deployment.md.
#
# Playwright no dispara este workflow ni lo despliega scripts/deploy-vps.mjs:
# a diferencia de Kestra/Superset/Nango no es un producto de plataforma
# compartido — cada cliente corre su propia instancia dedicada. Tratarlo
# como compartido chocó en T025 contra una instancia dedicada real ya
# corriendo en el mismo puerto del VPS de producción.
#
# workflow_call (spec 20261005-140934-promover-todo-produccion): invocable
# desde promover-todo-a-produccion.yml — ver migraciones-cloud.yml para el
# detalle de por qué el job `production` acepta ambos eventos.

on:
  push:
    branches: [main]
    paths:
      - "infra/kestra/compose*.yaml"
      - "infra/superset/compose*.yaml"
      - "infra/superset/dashboards/**"
      - "infra/nango/compose*.yaml"
      - "scripts/deploy-vps.mjs"
      - "scripts/preflight-deploy-vps.mjs"
      - "scripts/preparar-known-hosts-vps.mjs"
      - ".github/workflows/deploy-infraestructura-vps.yml"
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read
  actions: read

jobs:
  staging:
    if: github.event_name == 'push'
    runs-on: [self-hosted, platform-local]
    # MSF-926: tope explícito (el default de GitHub son 360 min: un job colgado ocuparía el runner self-hosted horas).
    timeout-minutes: 30
    environment: deploy-infraestructura-vps-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Iniciar ssh-agent con la clave del VPS de staging
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          # MSF-706: clave de host FIJADA (secret VPS_SSH_KNOWN_HOSTS o infra/vps/known_hosts.staging) y StrictHostKeyChecking=yes;
          # sin ella el paso falla (ya no se confía a ciegas en lo que conteste la red con ssh-keyscan).
          node scripts/preparar-known-hosts-vps.mjs --host "$VPS_SSH_HOST" --entorno staging
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add ~/.ssh/vps_deploy_key
      - name: Sintetizar .env.staging desde secrets
        env:
          VPS_DEPLOY_ENV: ${{ secrets.VPS_DEPLOY_ENV }}
        run: |
          printf '%s' "$VPS_DEPLOY_ENV" > .env.staging
          lineas=$(grep -c '^[A-Z_][A-Z0-9_]*=' .env.staging || true)
          if [ "$lineas" -lt 15 ]; then
            echo "::error::El secret VPS_DEPLOY_ENV no tiene forma de archivo .env real (se esperaban ~35 líneas KEY=valor para Kestra/Superset/Nango/Playwright, se encontraron $lineas). No es el nombre del entorno ni un valor simple — es el contenido completo de un .env.staging real. Ver docs/adoptar-cicd-staging-produccion.md sección 3."
            exit 1
          fi
      - run: pnpm deploy:vps -- staging
        env:
          DOCKER_HOST: ssh://${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}
      - name: Importar dashboards versionados de Superset
        env:
          SUPERSET_URL: ${{ secrets.SUPERSET_URL }}
          SUPERSET_USERNAME: ${{ secrets.SUPERSET_USERNAME }}
          SUPERSET_PASSWORD: ${{ secrets.SUPERSET_PASSWORD }}
          SUPERSET_ANALITICA_DB_HOST: ${{ secrets.SUPERSET_ANALITICA_DB_HOST }}
          SUPERSET_ANALITICA_DB_PASSWORD: ${{ secrets.SUPERSET_ANALITICA_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPERSET_REPORTE_CREADO_POR: ${{ secrets.SUPERSET_REPORTE_CREADO_POR }}
        run: |
          set -euo pipefail
          if [ -z "${SUPERSET_URL:-}" ]; then
            echo "::warning::SUPERSET_URL no configurado en el Environment; se omite la importación de dashboards."
            exit 0
          fi
          pnpm superset:importar-dashboards -- --directorio infra/superset/dashboards/rentabilidad --entorno staging
          pnpm superset:importar-dashboards -- --directorio infra/superset/dashboards/service --entorno staging
          pnpm superset:importar-dashboards -- --directorio infra/superset/dashboards/ventas-reportes --entorno staging
          pnpm superset:importar-dashboards -- --directorio infra/superset/dashboards/consultas-reportes --entorno staging
          pnpm superset:importar-dashboards -- --directorio infra/superset/dashboards/ventas-periodo-canal --entorno staging
          pnpm superset:importar-dashboards -- --directorio infra/superset/dashboards/inventario --entorno staging
          pnpm superset:importar-dashboards -- --directorio infra/superset/dashboards/analitica-avanzada --entorno staging
      - name: Re-ejecutar superset-init de staging DESPUÉS de importar los dashboards
        # `deploy:vps` ya corrió superset-init, pero ANTES del importador: un dataset nuevo (p. ej. el de
        # «Inventario · Productos y stock (cantidades)») todavía no existía y el rol Guest no recibía su
        # `datasource_access` ni el embebido su allow_domain_list hasta otra corrida. Es idempotente y solo aditivo.
        env:
          DOCKER_HOST: ssh://${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}
          SUPERSET_URL: ${{ secrets.SUPERSET_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPERSET_URL:-}" ]; then
            echo "::warning::SUPERSET_URL no configurado en el Environment; se omite superset-init posterior a la importación."
            exit 0
          fi
          docker compose --project-name platform-staging-superset --project-directory infra/superset --env-file .env.staging -f infra/superset/compose.yaml -f infra/superset/compose.vps.yaml run --rm superset-init
      - name: Limpiar credenciales transitorias
        if: always()
        run: |
          rm -f .env.staging ~/.ssh/vps_deploy_key
          ssh-agent -k || true

  production:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: [self-hosted, platform-local]
    # MSF-926: tope explícito (el default de GitHub son 360 min: un job colgado ocuparía el runner self-hosted horas).
    timeout-minutes: 30
    environment: deploy-infraestructura-vps-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Exigir que staging haya corrido exitosamente para este commit
        run: pnpm ci:verificar-staging-exitoso -- --workflow deploy-infraestructura-vps.yml --head-sha "$GITHUB_SHA"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Iniciar ssh-agent con la clave del VPS de producción
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          node scripts/preparar-known-hosts-vps.mjs --host "$VPS_SSH_HOST" --entorno production
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add ~/.ssh/vps_deploy_key
      - name: Sintetizar .env.production desde secrets
        env:
          VPS_DEPLOY_ENV: ${{ secrets.VPS_DEPLOY_ENV }}
        run: |
          printf '%s' "$VPS_DEPLOY_ENV" > .env.production
          lineas=$(grep -c '^[A-Z_][A-Z0-9_]*=' .env.production || true)
          if [ "$lineas" -lt 15 ]; then
            echo "::error::El secret VPS_DEPLOY_ENV no tiene forma de archivo .env real (se esperaban ~35 líneas KEY=valor para Kestra/Superset/Nango/Playwright, se encontraron $lineas). No es el nombre del entorno ni un valor simple — es el contenido completo de un .env.production real. Ver docs/adoptar-cicd-staging-produccion.md sección 3."
            exit 1
          fi
      - run: pnpm deploy:vps -- production
        env:
          DOCKER_HOST: ssh://${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}
      - name: Importar dashboards versionados de Superset
        env:
          SUPERSET_URL: ${{ secrets.SUPERSET_URL }}
          SUPERSET_USERNAME: ${{ secrets.SUPERSET_USERNAME }}
          SUPERSET_PASSWORD: ${{ secrets.SUPERSET_PASSWORD }}
          SUPERSET_ANALITICA_DB_HOST: ${{ secrets.SUPERSET_ANALITICA_DB_HOST }}
          SUPERSET_ANALITICA_DB_PASSWORD: ${{ secrets.SUPERSET_ANALITICA_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPERSET_REPORTE_CREADO_POR: ${{ secrets.SUPERSET_REPORTE_CREADO_POR }}
        run: |
          set -euo pipefail
          if [ -z "${SUPERSET_URL:-}" ]; then
            echo "::error::SUPERSET_URL no configurado en el Environment de producción; el deploy no puede dejar los dashboards sin importar."
            exit 1
          fi
          pnpm superset:importar-dashboards -- --directorio infra/superset/dashboards/rentabilidad --entorno production
          pnpm superset:importar-dashboards -- --directorio infra/superset/dashboards/service --entorno production
          pnpm superset:importar-dashboards -- --directorio infra/superset/dashboards/ventas-reportes --entorno production
          pnpm superset:importar-dashboards -- --directorio infra/superset/dashboards/consultas-reportes --entorno production
          pnpm superset:importar-dashboards -- --directorio infra/superset/dashboards/ventas-periodo-canal --entorno production
          pnpm superset:importar-dashboards -- --directorio infra/superset/dashboards/inventario --entorno production
          pnpm superset:importar-dashboards -- --directorio infra/superset/dashboards/analitica-avanzada --entorno production
      - name: Re-ejecutar superset-init de producción DESPUÉS de importar los dashboards
        # `deploy:vps` ya corrió superset-init, pero ANTES del importador: un dataset nuevo (p. ej. el de
        # «Inventario · Productos y stock (cantidades)») todavía no existía y el rol Guest no recibía su
        # `datasource_access` ni el embebido su allow_domain_list hasta otra corrida. Es idempotente y solo aditivo.
        env:
          DOCKER_HOST: ssh://${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}
          SUPERSET_URL: ${{ secrets.SUPERSET_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPERSET_URL:-}" ]; then
            echo "::warning::SUPERSET_URL no configurado en el Environment; se omite superset-init posterior a la importación."
            exit 0
          fi
          docker compose --project-name platform-production-superset --project-directory infra/superset --env-file .env.production -f infra/superset/compose.yaml -f infra/superset/compose.vps.yaml run --rm superset-init
      - name: Limpiar credenciales transitorias
        if: always()
        run: |
          rm -f .env.production ~/.ssh/vps_deploy_key
          ssh-agent -k || true
