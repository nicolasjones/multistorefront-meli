name: Verificar alcance de plataforma

# Red de contención para la regla de CLAUDE.md/AGENTS.md ("Si trabajás en un
# producto derivado... evaluá primero si corresponde escribirlo acá, en el
# template"). Esa regla depende de que el agente que implementa se acuerde
# de evaluarlo ANTES de escribir código; este workflow es el chequeo DESPUÉS,
# sobre el diff ya escrito.
#
# A propósito NO usa IA para juzgar el diff: no hay forma de saber, desde
# este repo, qué proveedor (Claude/Codex/OpenCode/otro) está autenticado en
# el runner de cada producto derivado que herede este workflow. En cambio,
# hace la parte barata y determinística (¿el diff tocó una ruta de
# plataforma conocida?) y, si aplica, bloquea pidiendo que un agente lo
# revise a mano — mismo criterio que ya opera el resto de este repo ("un
# solo agente opera el repo", no hay revisión por pares humana). El agente
# que lo revise decide: o corresponde separarlo (nueva spec acá, en el
# template) o está genuinamente entrelazado con lógica de negocio y se
# queda en el fork — en ese caso, agregarle al PR la label
# `plataforma-revisada` lo destraba sin reabrirlo.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verificar:
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Somos el template? (no aplica acá)
        id: es-template
        run: |
          set -euo pipefail
          nombre=$(node -p "require('./package.json').name")
          if [ "$nombre" = "automation-platform-template" ]; then
            echo "Este repo ES el template — la plataforma vive acá, el chequeo no aplica."
            echo "salir=true" >> "$GITHUB_OUTPUT"
          else
            echo "salir=false" >> "$GITHUB_OUTPUT"
          fi

      - name: PR ya revisado a mano?
        id: ya-revisado
        if: steps.es-template.outputs.salir != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tiene_label=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json labels --jq '[.labels[].name] | contains(["plataforma-revisada"])')
          echo "revisado=$tiene_label" >> "$GITHUB_OUTPUT"

      - name: Detectar rutas de plataforma tocadas
        id: rutas
        if: steps.es-template.outputs.salir != 'true' && steps.ya-revisado.outputs.revisado != 'true'
        run: |
          set -euo pipefail

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          merge_base=$(git merge-base "$base" "$head") || {
            echo "::error::No se pudo resolver el merge-base entre $base y $head — falla el chequeo por precaución (fail-closed), revisar el checkout/fetch-depth." >&2
            exit 1
          }

          archivos=$(git diff --name-only "$merge_base" "$head")
          if [ -z "$archivos" ]; then
            echo "::error::git diff no devolvió archivos tocados — algo raro con el checkout, falla por precaución." >&2
            exit 1
          fi

          # Lista deliberadamente PRECISA (no un include amplio + exclude por
          # lookahead): así un worker de negocio concreto (workers/xubio/**),
          # un flow de negocio (infra/kestra/flows/colppy/**), specs/** o
          # supabase/** (migraciones de dominio, otro problema, no este)
          # nunca matchean sin necesitar regex de exclusión no soportado por
          # grep -E POSIX (sin negative lookahead).
          patron='^workers/Dockerfile$'
          patron="$patron|^workers/CONTRATO\.md$"
          patron="$patron|^workers/README\.md$"
          patron="$patron|^workers/egress-allowlists\.json$"
          patron="$patron|^\.github/workflows/"
          patron="$patron|^\.github/worker-release-policy\.yml$"
          patron="$patron|^\.github/worker-vulnerability-exceptions\.json$"
          patron="$patron|^infra/kestra/flows/plantilla-.*\.yml$"
          patron="$patron|^infra/kestra/flows/alertas\.yml$"
          patron="$patron|^infra/kestra/.*\.(ps1|mjs)$"
          patron="$patron|^infra/kestra/compose.*\.yaml$"
          patron="$patron|^infra/kestra/fixtures/"
          patron="$patron|^infra/superset/"
          patron="$patron|^apps/web/src/providers/"
          patron="$patron|^apps/web/src/context/"
          patron="$patron|^apps/web/src/components/navegacion/"
          patron="$patron|^apps/web/src/components/pagina/"
          patron="$patron|^apps/web/src/components/estados/"
          patron="$patron|^apps/web/src/components/identidad/"
          patron="$patron|^scripts/descubrir-workers"
          patron="$patron|^scripts/validar-.*workers"
          patron="$patron|^scripts/smoke-imagenes-workers\.mjs$"
          patron="$patron|^scripts/validar-scan-worker"
          patron="$patron|^\.specify/"
          patron="$patron|^CLAUDE\.md$"
          patron="$patron|^AGENTS\.md$"

          tocados=$(printf '%s\n' "$archivos" | grep -E "$patron" || true)

          if [ -z "$tocados" ]; then
            echo "Ninguna ruta de plataforma tocada — pasa."
            echo "dispara=false" >> "$GITHUB_OUTPUT"
          else
            echo "Rutas de plataforma tocadas:"
            echo "$tocados"
            echo "dispara=true" >> "$GITHUB_OUTPUT"
            {
              echo "archivos<<EOF_ARCHIVOS"
              echo "$tocados"
              echo "EOF_ARCHIVOS"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Comentar y bloquear
        if: steps.es-template.outputs.salir != 'true' && steps.ya-revisado.outputs.revisado != 'true' && steps.rutas.outputs.dispara == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          marcador="<!-- verificar-alcance-plataforma -->"
          archivos_md=$(printf '%s\n' "${{ steps.rutas.outputs.archivos }}" | sed 's/^/- `/; s/$/`/')

          cuerpo=$(cat <<EOF
          $marcador
          ## ⚠️ Este PR toca rutas de plataforma reutilizable

          $archivos_md

          Antes de mergear, un agente debe revisar si esto corresponde
          implementarse en \`automation-platform-template\` primero (ver el
          bullet de \`CLAUDE.md\`/\`AGENTS.md\` que empieza "Si trabajás en un
          producto derivado...") en vez de quedar acá.

          - Si corresponde separarlo: se implementa allá (spec, PR) y se trae
            de vuelta con \`git merge upstream/main\` — este PR se cierra o se
            recorta.
          - Si está genuinamente entrelazado con lógica de negocio (el caso
            más común) y por eso se queda acá: agregale al PR la label
            \`plataforma-revisada\` para destrabar este check, sin necesidad
            de reabrirlo.
          EOF
          )

          id_existente=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --jq ".[] | select(.body | startswith(\"$marcador\")) | .id" | head -1)

          if [ -n "$id_existente" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$id_existente" -X PATCH -f body="$cuerpo" > /dev/null
          else
            gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "$cuerpo"
          fi

          echo "::error::Este PR toca rutas de plataforma sin la label 'plataforma-revisada' — ver el comentario del PR." >&2
          exit 1
