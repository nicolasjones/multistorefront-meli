name: E2E nocturno

# E2E de Playwright (apps/web/e2e, ~100 tests, ~20 min en serie) sobre `dokploy`, FUERA del camino de los PRs.
# Decisión del gate MSF-852: los PRs ya corren los guardianes baratos (`pnpm e2e:escritura:check` y
# `pnpm test:e2e:escritura`) y los specs públicos; la suite completa con sesión corre de noche y a pedido.
# NO bloquea ningún PR ni merge, NO notifica y NO abre issues: si falla, el run queda en rojo y se lee el
# resumen del run (ver docs/e2e-app.md, sección CI).

on:
  schedule:
    # 04:00 UTC = 01:00 en Buenos Aires (ART = UTC-3 todo el año, Argentina no usa horario de verano).
    # Ventana de baja carga: no compite con los PRs del día. GitHub sólo dispara `schedule` desde la rama por
    # defecto (`main`): el cron empieza a correr cuando este archivo llega a `main`. El run siempre prueba `dokploy`.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      spec:
        description: 'Opcional: archivo(s) de spec a correr, separados por espacio (p. ej. "tienda-seo precios-iva"). Vacío = toda la suite.'
        required: false
        default: ''
        type: string
      grep:
        description: 'Opcional: correr solo los tests cuyo título coincida con este texto (playwright --grep).'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Una sola corrida a la vez (la web usa el puerto 4300, único). La corrida nueva ESPERA a la que está en
# curso en vez de cancelarla: cortar una a la mitad deja un stack a medio bajar.
concurrency:
  group: e2e-nocturno
  cancel-in-progress: false

env:
  # Stack de Supabase: el MISMO mecanismo que el job `e2e-tienda` (PR #923) y `database` de validate.yml: una
  # RANURA del CI (`scripts/supabase-ci.mjs reclamar` + `db:ci:preparar`) con su project_id `ci-*` y su rango de
  # puertos, coordinada por locks con esos jobs, así que no colisiona con ellos ni con el stack de desarrollo.
  # La web SÍ va en el 4300 (no en 44xx): `site_url` de supabase/config.toml apunta ahí y `cuenta-web-cliente`
  # lo exige. Corre dentro del contenedor del runner, donde 4300 es propio (no del host).
  E2E_NOCT_WEB_PORT: '4300'
  # El que reclama una ranura es quien recicla las vencidas: todos los jobs que las comparten usan el mismo TTL (75 min,
  # por encima del mayor timeout; ver `e2e-tienda` y `database`).
  SUPABASE_CI_LOCK_TTL_MIN: 75

jobs:
  e2e:
    name: Playwright (suite completa, en serie)
    runs-on: [self-hosted, platform-local]
    timeout-minutes: 60
    steps:
      # El run prueba siempre `dokploy` (en `schedule` el workflow vive en `main`); un disparo manual desde otra
      # rama prueba esa rama.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dokploy' || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Supabase CLI (2.116.0; reusa el del runner si ya está)
        run: |
          if command -v supabase >/dev/null 2>&1 && supabase --version 2>/dev/null | grep -q '2.116.0'; then
            echo "supabase 2.116.0 ya presente en el runner -> no descargo"
          else
            curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_2.116.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin supabase
          fi
          supabase --version

      - name: Preparar entorno del job (rutas y anfitrión del Docker)
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP:-/tmp}/e2e-nocturno-$GITHUB_RUN_ID"
          mkdir -p "$WORK"
          # Dentro del contenedor del runner, 127.0.0.1 es el contenedor y NO el Docker del host donde se publican
          # los puertos del stack (docker-fuera-de-docker, ver docs/deployment.md, sección CI): se alcanzan por
          # `host.docker.internal`. Fuera de un contenedor (corrida local) es 127.0.0.1.
          if [ -f /.dockerenv ]; then HOST_DOCKER=host.docker.internal; else HOST_DOCKER=127.0.0.1; fi
          { echo "E2E_WORK=$WORK"; echo "HOST_DOCKER=$HOST_DOCKER"; } >> "$GITHUB_ENV"
          echo "work=$WORK host=$HOST_DOCKER"

      - name: Verificar que el puerto de la web (4300) esté libre
        run: |
          # Algo que acepte conexiones en 127.0.0.1:4300 de ESTE entorno (donde correrá `vite preview`) = ocupado.
          if node -e '
            const s = require("node:net").connect({ host: "127.0.0.1", port: Number(process.argv[1]), timeout: 1500 });
            s.on("connect", () => process.exit(0)); s.on("timeout", () => process.exit(1)); s.on("error", () => process.exit(1));
          ' "$E2E_NOCT_WEB_PORT"; then
            echo "::error title=Puerto $E2E_NOCT_WEB_PORT ocupado::Otro proceso escucha en 127.0.0.1:$E2E_NOCT_WEB_PORT. El spec cuenta-web-cliente exige que la web se sirva en ese puerto (site_url de supabase/config.toml) y vite se inicia con --strictPort: no se puede mover. Liberalo y relanzá el workflow."
            exit 1
          fi
          echo "puerto $E2E_NOCT_WEB_PORT libre"

      # Espera a lo sumo 15 min por una ranura (de noche casi siempre hay libre). Sin ranura el run falla con ese mensaje.
      - name: Reservar la ranura del stack de Supabase
        env:
          SUPABASE_CI_LOCK_MIN: 15
        run: node scripts/supabase-ci.mjs reclamar
      # `SEGUIMIENTO_IP_SALT` va en supabase/.env ANTES de preparar (la copia del workdir lo lleva): config.toml lo
      # declara en `[edge_runtime.secrets]`. Sin Edge en este stack sólo hace falta si alguien lo sirve a mano.
      - name: Preparar el stack del CI (config en copia temporal, sin tocar supabase/config.toml)
        run: |
          printf 'SEGUIMIENTO_IP_SALT=%s\n' "sal-e2e-nocturno-$GITHUB_RUN_ID" > supabase/.env
          pnpm db:ci:preparar
      # `supabase start` conecta a 127.0.0.1:<puerto de la base> para inicializarse y, dentro del contenedor del
      # runner, eso es el contenedor: el puente reenvía ese puerto al Docker del host. Queda vivo TODO el job
      # (también lo usa `ventas-impresion` por E2E_PGPORT); se mata por su PID en la limpieza. Fuera de un contenedor no hace falta.
      - name: Puente al Docker del host (sólo en el contenedor del runner)
        if: env.HOST_DOCKER == 'host.docker.internal'
        run: |
          nohup node scripts/supabase-ci.mjs puente > "$E2E_WORK/puente.log" 2>&1 &
          echo $! > "$E2E_WORK/puente.pid"
          for intento in $(seq 50); do (: > "/dev/tcp/127.0.0.1/$SUPABASE_DB_PORT") 2>/dev/null && break; sleep 0.2; done
          kill -0 "$(cat "$E2E_WORK/puente.pid")" || { cat "$E2E_WORK/puente.log"; exit 1; }
          echo "puente activo (pid $(cat "$E2E_WORK/puente.pid"))"
      # Sin edge-runtime (monta el directorio de funciones del checkout, que no existe en el Docker del host:
      # docker-fuera-de-docker; igual que `e2e-tienda`), `supabase functions serve` tampoco puede correr en el runner.
      # Quedan afuera los specs/casos que lo necesitan (ver docs/e2e-app.md). `realtime` queda ARRIBA para
      # `stock-actual-vivo`. `--ignore-health-check`: PostgREST arranca antes de que existan los esquemas expuestos.
      # La ranura puede venir con el stack de `database` (sin kong/postgrest): se lo baja para arrancar de cero.
      - name: Levantar el stack de Supabase del CI con API
        run: |
          supabase stop --workdir "$SUPABASE_CI_WORKDIR" --no-backup || true
          supabase start --workdir "$SUPABASE_CI_WORKDIR" --ignore-health-check -x studio,mailpit,imgproxy,logflare,vector,edge-runtime,supavisor,postgres-meta
      # NO `pnpm db:reset:ci`: recrea el esquema `public` y con él se pierden los privilegios por defecto de `service_role`
      # (los E2E siembran con esa clave y fallarían con «permission denied for table clientes»). Se migra con
      # `migration up` (conserva los defaults) y se siembra con el psql de la propia imagen de la base, así el runner no
      # necesita psql.
      - name: Migrar y sembrar
        run: |
          supabase migration up --local --workdir "$SUPABASE_CI_WORKDIR"
          docker exec -i "supabase_db_${SUPABASE_CI_PROJECT_ID}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/seed.sql
      - name: Reiniciar PostgREST, esperar la API y exponer el entorno
        run: |
          docker restart "supabase_rest_${SUPABASE_CI_PROJECT_ID}"
          eval "$(supabase status -o env --workdir "$SUPABASE_CI_WORKDIR" | sed 's/^/export /')"
          URL="${API_URL/127.0.0.1/$HOST_DOCKER}"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          esperar() {
            codigo=000
            for intento in $(seq 60); do
              codigo=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $ANON_KEY" "$URL$2" || true)
              [ "$codigo" = "200" ] && return 0
              sleep 2
            done
            echo "$1 no respondió 200 en $URL$2 (último: $codigo)"
            return 1
          }
          esperar PostgREST /rest/v1/ || { docker logs --tail 40 "supabase_rest_${SUPABASE_CI_PROJECT_ID}" || true; exit 1; }
          esperar Auth /auth/v1/health || { docker logs --tail 40 "supabase_auth_${SUPABASE_CI_PROJECT_ID}" || true; exit 1; }
          esperar Storage /storage/v1/status || { docker logs --tail 40 "supabase_storage_${SUPABASE_CI_PROJECT_ID}" || true; exit 1; }
          tiendas=$(curl -fsS -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "Accept-Profile: dominio" "$URL/rest/v1/tiendas?select=dominio")
          echo "tiendas sembradas: $tiendas"
          case "$tiendas" in *mundojc.localhost*sanjavucho.localhost*|*sanjavucho.localhost*mundojc.localhost*) ;; *) echo "Faltan las tiendas del seed"; exit 1 ;; esac
          {
            echo "SUPABASE_URL=$URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_SUPABASE_URL=$URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "VITE_PANEL_HOSTS=localhost,127.0.0.1"
            echo "E2E_SIN_EDGE=1"
            echo "E2E_PGPORT=$SUPABASE_DB_PORT"
            echo "E2E_PGHOST=127.0.0.1"
          } >> "$GITHUB_ENV"

      - name: Compilar workers/comprobantes-pdf (lo usa ventas-impresion)
        run: pnpm --filter ./workers/comprobantes-pdf build

      # Sólo `vite build` (el type-check ya lo hace `pnpm build` en `application`). Las VITE_* salen del paso anterior:
      # PUBLISHABLE (no ANON: con otro nombre el build usa una clave inválida y todos los ingresos fallan) y
      # `VITE_PANEL_HOSTS` (sin él el panel se sirve en mundojc.localhost y los E2E de la tienda fallan).
      - name: Compilar la web contra el stack
        run: pnpm --filter @platform/web exec vite build

      # `--host 0.0.0.0` (como en el PR #923): los specs de la tienda entran por `*.localhost` y Chromium también
      # resuelve a ::1; atado sólo a IPv4 el `page.goto` termina en `net::ERR_ABORTED`.
      - name: Servir la web (vite preview en 4300, --strictPort)
        run: |
          set -euo pipefail
          (cd apps/web && nohup pnpm exec vite preview --port "$E2E_NOCT_WEB_PORT" --strictPort --host 0.0.0.0 > "$E2E_WORK/vite.log" 2>&1 & echo $! > "$E2E_WORK/vite.pid")
          for i in $(seq 60); do
            curl -fsS -o /dev/null "http://127.0.0.1:$E2E_NOCT_WEB_PORT/" && web=1 && break
            kill -0 "$(cat "$E2E_WORK/vite.pid")" 2>/dev/null || { echo "::error::vite preview murió"; cat "$E2E_WORK/vite.log"; exit 1; }
            sleep 1
          done
          [ "${web:-0}" = 1 ] || { echo "::error::la web no respondió en $E2E_NOCT_WEB_PORT"; cat "$E2E_WORK/vite.log"; exit 1; }
          echo "web sirviendo en $E2E_NOCT_WEB_PORT"

      - name: Instalar Chromium de Playwright
        run: |
          if ls "$HOME"/.cache/ms-playwright/chromium-* >/dev/null 2>&1; then
            pnpm --filter @platform/web exec playwright install chromium
            pnpm --filter @platform/web exec playwright install-deps chromium
          else
            pnpm --filter @platform/web exec playwright install --with-deps chromium
          fi

      - name: Playwright (en serie, 1 reintento)
        env:
          E2E_BASE_URL: http://127.0.0.1:${{ env.E2E_NOCT_WEB_PORT }}
          WEB_PORT: ${{ env.E2E_NOCT_WEB_PORT }}
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ env.E2E_WORK }}/resultados.json
          # Entradas manuales: por env (nunca interpoladas en el script) y sin banderas.
          IN_SPEC: ${{ inputs.spec }}
          IN_GREP: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${IN_SPEC// }" ]; then
            read -r -a specs <<< "$IN_SPEC"
            for s in "${specs[@]}"; do
              case "$s" in -*) echo "::error::el input spec no puede empezar con '-': $s"; exit 2 ;; esac
              args+=("$s")
            done
          fi
          if [ -n "${IN_GREP// }" ]; then
            case "$IN_GREP" in -*) echo "::error::el input grep no puede empezar con '-'"; exit 2 ;; esac
            args+=(--grep "$IN_GREP")
          fi
          # Sin Edge Runtime (ver el paso «Levantar el stack»), el caso «recuperar» de cuenta-web-cliente llama a la
          # función recuperar-clave-cliente y falla siempre (Kong responde 500, que el spec no toma como «no servida»).
          # Se excluye a propósito y de forma visible; sigue corriéndose a mano con las funciones servidas.
          args+=(--grep-invert "recuperar responde igual con y sin cuenta")
          echo "args de playwright: ${args[*]:-(suite completa)}"
          pnpm --filter @platform/web exec playwright test "${args[@]}" --workers=1 --retries=1 --reporter=list,html,json

      # Resumen legible del run (aun si Playwright falló o no llegó a escribir el JSON).
      - name: Resumen en $GITHUB_STEP_SUMMARY
        if: always()
        run: |
          node - <<'EOF'
          const fs = require('node:fs')
          const out = process.env.GITHUB_STEP_SUMMARY
          const w = (s) => (out ? fs.appendFileSync(out, s + '\n') : console.log(s))
          const f = `${process.env.E2E_WORK}/resultados.json`
          w('## E2E nocturno')
          if (!fs.existsSync(f)) { w('No hay resultados: el run falló ANTES de que Playwright terminara (levantar el stack, compilar o servir). Mirá el paso que falló en el log.'); process.exit(0) }
          const r = JSON.parse(fs.readFileSync(f, 'utf8'))
          const filas = []
          const visit = (suite, archivo) => {
            for (const s of suite.suites ?? []) visit(s, s.file ?? archivo)
            for (const sp of suite.specs ?? []) for (const t of sp.tests ?? []) {
              const res = t.results ?? []
              filas.push({ archivo: sp.file ?? archivo, titulo: sp.title, estado: t.status, reintentos: Math.max(0, res.length - 1), ms: res.reduce((a, x) => a + (x.duration ?? 0), 0), error: (res.at(-1)?.error?.message ?? '').split('\n')[0].replace(/\u001b\[[0-9;]*m/g, '') })
            }
          }
          for (const s of r.suites ?? []) visit(s, s.file)
          const n = (e) => filas.filter((x) => x.estado === e).length
          const st = r.stats ?? {}
          w(`Commit \`${process.env.GITHUB_SHA?.slice(0, 8)}\` · duración ${Math.round((st.duration ?? 0) / 60000)} min · ${filas.length} tests`)
          w('')
          w('| Pasaron | Fallaron | Inestables (pasaron al reintentar) | Omitidos |')
          w('|---|---|---|---|')
          w(`| ${n('expected')} | ${n('unexpected')} | ${n('flaky')} | ${n('skipped')} |`)
          const lista = (titulo, estado, extra) => {
            const l = filas.filter((x) => x.estado === estado)
            if (!l.length) return
            w(''); w(`### ${titulo} (${l.length})`)
            for (const x of l) w(`- \`${x.archivo}\` · ${x.titulo.replace(/\|/g, '\\|')}${extra ? ` — ${x.error.replace(/\|/g, '\\|').slice(0, 200)}` : ''}`)
          }
          lista('Fallaron', 'unexpected', true)
          lista('Inestables', 'flaky', true)
          const omitidos = filas.filter((x) => x.estado === 'skipped')
          if (omitidos.length) {
            const porArchivo = {}
            for (const x of omitidos) porArchivo[x.archivo] = (porArchivo[x.archivo] ?? 0) + 1
            w(''); w('### Omitidos por archivo (un spec sin SUPABASE_URL se omite en silencio: acá se ve si alguno se saltó de más)')
            for (const [a, c] of Object.entries(porArchivo)) w(`- \`${a}\`: ${c}`)
          }
          // Guarda contra omisiones masivas: un spec con sesión se omite en silencio sin SUPABASE_URL y Playwright lo cuenta
          // como éxito. Con más de la mitad omitido el entorno del job está roto: el run NO puede quedar verde.
          if (filas.length === 0 || omitidos.length * 2 > filas.length) {
            w(''); w(`**El run falla: ${omitidos.length} de ${filas.length} tests se omitieron (más de la mitad). El entorno del job no está completo.**`)
            process.exitCode = 1
          }
          w(''); w('Trazas y reporte HTML: artifact `e2e-nocturno` de este run (se conservan 7 días).')
          EOF

      - name: Subir reporte, resultados y trazas de fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-nocturno
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ env.E2E_WORK }}/resultados.json
            ${{ env.E2E_WORK }}/vite.log
          if-no-files-found: ignore
          retention-days: 7

      # Siempre baja lo que levantó este run (también si falló, se canceló o venció el timeout). Mata por PID
      # PROPIO (los archivos .pid del paso que los lanzó), nunca por patrón; el stack, con `supabase stop` y, si
      # algo quedó, por la etiqueta del project_id de la ranura; y suelta la ranura.
      - name: Limpieza (procesos propios, stack de Supabase y ranura)
        if: always()
        timeout-minutes: 10
        run: |
          set +e
          for n in vite puente; do
            p="$E2E_WORK/$n.pid"
            [ -f "$p" ] || continue
            pid=$(cat "$p")
            pkill -TERM -P "$pid" 2>/dev/null   # hijos directos (pnpm -> node)
            kill -TERM "$pid" 2>/dev/null
            echo "PID $pid ($n) terminado"
          done
          sleep 2
          for n in vite puente; do
            p="$E2E_WORK/$n.pid"
            [ -f "$p" ] || continue
            pid=$(cat "$p"); pkill -KILL -P "$pid" 2>/dev/null; kill -KILL "$pid" 2>/dev/null
          done
          if [ -n "$SUPABASE_CI_WORKDIR" ]; then
            supabase stop --workdir "$SUPABASE_CI_WORKDIR" --no-backup
            L="com.supabase.cli.project=$SUPABASE_CI_PROJECT_ID"
            ids=$(docker ps -aq --filter "label=$L")
            [ -n "$ids" ] && { echo "quedaban contenedores; docker rm -f"; docker rm -f $ids >/dev/null; }
            vols=$(docker volume ls -q --filter "label=$L")
            [ -n "$vols" ] && docker volume rm -f $vols >/dev/null
            docker network rm "supabase_network_$SUPABASE_CI_PROJECT_ID" >/dev/null 2>&1
            echo "restan: contenedores=$(docker ps -aq --filter "label=$L" | grep -c .) volúmenes=$(docker volume ls -q --filter "label=$L" | grep -c .)"
          fi
          rm -f supabase/.env
          node scripts/supabase-ci.mjs liberar
          exit 0
