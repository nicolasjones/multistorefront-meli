name: Verificar adopción del template

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  verificar-adopcion:
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Omitir en el template
        id: producto
        shell: bash
        run: |
          set -euo pipefail
          nombre=$(node -p "require('./package.json').name")
          if [ "$nombre" = "automation-platform-template" ]; then
            echo "aplica=false" >> "$GITHUB_OUTPUT"
            echo "Este repositorio publica el catálogo; no consume su propio upstream."
          else
            echo "aplica=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comprobar secreto de lectura
        if: steps.producto.outputs.aplica == 'true'
        id: credencial
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEMPLATE_READ_TOKEN: ${{ secrets.TEMPLATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$TEMPLATE_READ_TOKEN" ]; then
            echo "configurada=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          issue=$(gh issue list --repo "${{ github.repository }}" --state open --json number,title --jq '.[] | select(.title == "Configurar lectura del template") | .number' | head -1)
          cat > "$RUNNER_TEMP/template-read-token.md" <<'EOF'
          Este producto todavía no tiene acceso de lectura al repositorio privado del template.

          Crear un token Fine-grained con permiso **Contents: Read-only** únicamente para `automation-platform-template` y guardarlo en este repositorio como Actions Secret `TEMPLATE_READ_TOKEN`. Después, volver a ejecutar este workflow.

          No pegar el token en comentarios, archivos ni logs.
          EOF
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/template-read-token.md"
          else
            gh issue create --repo "${{ github.repository }}" --title "Configurar lectura del template" --body-file "$RUNNER_TEMP/template-read-token.md"
          fi
          echo "::error::Falta el secreto Actions TEMPLATE_READ_TOKEN; se abrió o actualizó una issue con instrucciones."
          exit 1

      - name: Obtener catálogo publicado
        if: steps.producto.outputs.aplica == 'true' && steps.credencial.outputs.configurada == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TEMPLATE_REPOSITORY || 'nicolasjones/automation-platform-template' }}
          ref: main
          token: ${{ secrets.TEMPLATE_READ_TOKEN }}
          path: .template
          sparse-checkout: template-capabilities.json
          persist-credentials: false
          fetch-depth: 1

      - name: Comparar capacidades adoptadas
        if: steps.producto.outputs.aplica == 'true' && steps.credencial.outputs.configurada == 'true'
        id: comparar
        shell: bash
        run: |
          set -euo pipefail
          resultado="$RUNNER_TEMP/template-adoption-result.json"
          codigo=0
          node scripts/verificar-adopcion-template.mjs \
            --catalog .template/template-capabilities.json \
            --adoption template-adoption.json \
            --json --check > "$resultado" || codigo=$?
          if [ "$codigo" -gt 1 ]; then
            echo "::error::No se pudo verificar el catálogo o el manifiesto; revisá el mensaje sanitizado del verificador."
            exit "$codigo"
          fi
          pendientes=$(node -e "const r=require(process.argv[1]); console.log(r.pending.length)" "$resultado")
          echo "pendientes=$pendientes" >> "$GITHUB_OUTPUT"

      - name: Abrir o actualizar seguimiento de adopción
        if: steps.producto.outputs.aplica == 'true' && steps.credencial.outputs.configurada == 'true' && steps.comparar.outputs.pendientes != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node -e "const r=require(process.argv[1]); console.log('# Capacidades pendientes para '+r.product+'\\n\\nCatálogo: '+r.template_repository+'\\n\\n| Capacidad | Adoptada | Vigente | Estado |\\n|---|---:|---:|---|\\n'+r.pending.map(x=>'| '+x.id+' | '+(x.adopted_version||'sin registrar')+' | '+x.current_version+' | '+x.status+' |').join('\\n')+'\\n\\nAdoptá cada cambio en un PR propio y actualizá `template-adoption.json` después de validar el producto. No se ejecutan merges automáticamente.')" "$RUNNER_TEMP/template-adoption-result.json" > "$RUNNER_TEMP/template-adoption-issue.md"
          issue=$(gh issue list --repo "${{ github.repository }}" --state open --json number,title --jq '.[] | select(.title == "Adopción pendiente del template") | .number' | head -1)
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/template-adoption-issue.md"
          else
            gh issue create --repo "${{ github.repository }}" --title "Adopción pendiente del template" --body-file "$RUNNER_TEMP/template-adoption-issue.md"
          fi

      - name: Cerrar seguimiento resuelto
        if: steps.producto.outputs.aplica == 'true' && steps.credencial.outputs.configurada == 'true' && steps.comparar.outputs.pendientes == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          issue=$(gh issue list --repo "${{ github.repository }}" --state open --json number,title --jq '.[] | select(.title == "Adopción pendiente del template") | .number' | head -1)
          if [ -n "$issue" ]; then
            gh issue close "$issue" --repo "${{ github.repository }}" --comment "El manifiesto de adopción ya coincide con las versiones publicadas."
          fi
          credential_issue=$(gh issue list --repo "${{ github.repository }}" --state open --json number,title --jq '.[] | select(.title == "Configurar lectura del template") | .number' | head -1)
          if [ -n "$credential_issue" ]; then
            gh issue close "$credential_issue" --repo "${{ github.repository }}" --comment "La lectura del catálogo ya funciona correctamente."
          fi
