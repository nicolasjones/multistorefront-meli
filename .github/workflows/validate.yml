name: Validate

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  application:
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm test:template:adoption
      - run: pnpm template:adoption:check
      - run: pnpm template:capabilities:check --base "origin/${{ github.base_ref || 'main' }}"
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:ia
      - run: pnpm test:web

  infrastructure:
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm infra:config

  database:
    runs-on: [self-hosted, platform-local]
    # Un único stack de CI por repositorio: dos corridas simultáneas (hay
    # varias réplicas del runner) se resetearían la base mutuamente.
    concurrency:
      group: supabase-ci-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # El paquete npm de Supabase no extrae su binario nativo de forma
      # confiable en runners Linux persistentes; usamos el release oficial.
      - name: Instalar Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_2.116.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin supabase
          supabase --version
      - run: node --test scripts/supabase-ci.test.mjs
      # Los runners self-hosted comparten el Docker del host con los stacks
      # de Supabase de desarrollo. El CI usa un stack propio: project_id
      # ci-<repo> y puertos 20000 + (puerto de desarrollo % 10000), en un
      # workdir generado (.supabase-ci/) porque config.toml no admite env()
      # en los puertos (excepción FR-006, spec 015). Exporta
      # SUPABASE_CI_WORKDIR, SUPABASE_CI_PROJECT_ID y SUPABASE_DB_PORT.
      # Ver docs/deployment.md.
      - run: pnpm db:ci:preparar
      # El stack del CI se mantiene entre corridas (arranque rápido); si ya
      # corre, `start` no hace nada y db:reset:ci deja el esquema al día.
      # Sólo se levantan los servicios que usan los tests pgTAP. El CLI se
      # conecta a 127.0.0.1:<puerto> para inicializar el stack; el puente
      # reenvía sólo ese puerto al host mientras dura el `start`.
      - name: Levantar el stack de Supabase del CI
        run: |
          node scripts/supabase-ci.mjs puente &
          trap 'kill $!' EXIT
          for intento in $(seq 50); do (: > "/dev/tcp/127.0.0.1/$SUPABASE_DB_PORT") 2>/dev/null && break; sleep 0.2; done
          supabase start --workdir "$SUPABASE_CI_WORKDIR" -x studio,mailpit,imgproxy,logflare,vector,edge-runtime,supavisor,realtime,postgres-meta,kong,postgrest
      # `supabase db reset` no sirve desde el contenedor del runner (se
      # conecta por 127.0.0.1, que es el propio contenedor, y con --db-url a
      # host.docker.internal deja políticas de RLS mal resueltas).
      # db:reset:ci (scripts/reset-db-ci.mjs) dropea public/private/dominio y
      # reaplica migraciones + seed.sql con psql por host.docker.internal,
      # tras una guarda que aborta si el destino no es el stack del CI.
      - run: pnpm db:reset:ci
      # test:db:ci conecta por host.docker.internal (no 127.0.0.1) y pasa
      # por la misma guarda antes de correr pg_prove.
      - run: pnpm test:db:ci
