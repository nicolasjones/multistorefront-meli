name: Validate

on:
  pull_request:
  # Merge queue: al encolar un PR, GitHub corre el workflow sobre el grupo de
  # merge (`merge_group`) con el base ya integrado. Sin este disparador, los
  # checks requeridos no reportan y el PR no sale de la cola. Ver docs/control-ci.md.
  merge_group:
  push:
    branches: [main, staging]

permissions:
  contents: read

# Un push NUEVO a la misma rama/PR CANCELA el run anterior del mismo PR (no se acumulan runs compitiendo
# por los runners). El job `database` YA NO usa `concurrency`: reserva una RANURA del stack de Supabase
# (`scripts/supabase-ci.mjs`) para que varias corridas del mismo repo convivan en paralelo sin pisarse ni
# cancelarse (bug BUG-179: el `concurrency` por repo *cancelaba* las corridas en cola).
#
# ADMISIÓN: con la variable de repo `CI_LANES` seteada (p. ej. 5), el job `changes` reserva un CARRIL por
# PR (`scripts/ci-lane.mjs`) y lo libera al terminar; los PRs de más ESPERAN en vez de oversuscribir los
# runners. Sin `CI_LANES`, la admisión queda apagada (comportamiento previo). `CI_PAUSED=true` frena lo
# pesado (kill switch) y `CI_LOAD_MAX` es el cortacircuitos por carga del host. Ver docs/control-ci.md.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #2 — Clasifica el diff: si el PR NO toca código (sólo docs/specs/md/.github), NO se corre el CI pesado.
  # Además calcula `web`: si el diff SÓLO toca dirs que NO afectan a la app web (supabase/, infra/, scripts/,
  # apps/api/, docs/, specs/) la suite web + e2e se saltean. CONSERVADOR: `web` es true por defecto y sólo se
  # apaga cuando TODOS los archivos cambiados caen en esos dirs (cualquier archivo desconocido o de raíz lo
  # vuelve a prender), salvo `mkdocs.yml`, que es solo la navegación de la documentación (MSF-799). `apps/web` depende de `@platform/ia`, por eso `packages/**` cuenta como web.
  #
  # Este job también RESERVA el carril de admisión (si `CI_LANES` está seteada): los jobs pesados lo esperan
  # por `needs` y el job `liberar` lo suelta al final, así un PR ocupa un carril mientras corre.
  changes:
    runs-on: [self-hosted, platform-local]
    timeout-minutes: 20
    outputs:
      code: ${{ steps.d.outputs.code }}
      db: ${{ steps.d.outputs.db }}
      web: ${{ steps.d.outputs.web }}
      infra: ${{ steps.d.outputs.infra }}
      e2e: ${{ steps.d.outputs.e2e }}
      lane: ${{ steps.carril.outputs.lane }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            BASE_SHA="${{ github.event.merge_group.base_sha }}"
            FILES=$(git diff --name-only "$BASE_SHA"...HEAD 2>/dev/null || echo "")
          else
            BASE="origin/${{ github.base_ref || 'main' }}"
            git fetch -q origin "${BASE#origin/}" 2>/dev/null || true
            FILES=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || git diff --name-only HEAD~1 2>/dev/null || echo "")
          fi
          echo "== archivos =="; printf '%s\n' "$FILES"
          CODE=$(printf '%s\n' "$FILES" | grep -vE '^(docs/|specs/|design/|\.specify/|\.github/|mkdocs\.yml$)|\.(md|txt)$' | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|sql|py|json|ya?ml|toml|sh|css|html)$' | head -1)
          DB=$(printf '%s\n' "$FILES" | grep -E '^supabase/' | head -1)
          # web=true salvo que TODOS los archivos estén en dirs que no afectan a la app web.
          # Exentos (MSF-687): documentación (`docs/`, `mkdocs.yml`, `*.md` de la raíz) y `.specify/`:
          # un PR de solo docs no corre la suite web ni el e2e.
          WEB=$(printf '%s\n' "$FILES" | grep -vE '^$' | grep -vE '^(docs/|specs/|design/|supabase/|infra/|scripts/|apps/api/|\.specify/|\.github/|mkdocs\.yml$|[^/]+\.md$)' | head -1)
          # infra=true sólo si toca infra/ o scripts/ (el job `infrastructure` valida la config de infra).
          INFRA=$(printf '%s\n' "$FILES" | grep -E '^(infra/|scripts/)' | head -1)
          # e2e=true SALVO que el PR apunte a una rama de ÉPICA: las historias y el cierre van a
          # `epic/<KEY>-…`, y el e2e (Playwright) + la suite web pesada (~10 min, long pole del CI) se
          # validan al INTEGRAR la épica (PR `epic/* → dokploy`). Correrlos por historia consume runners y
          # serializa el resto. Un `push` (a dokploy/main/staging) también corre e2e. Ver docs/deployment.md.
          case "${GITHUB_BASE_REF}" in
            epic/*) E2E=false ;;
            *)      E2E=true ;;
          esac
          echo "code=$([ -n "$CODE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "db=$([ -n "$DB" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -n "$WEB" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "infra=$([ -n "$INFRA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "e2e=$E2E" >> "$GITHUB_OUTPUT"
      - name: Reservar carril de admisión (CI_LANES)
        id: carril
        if: ${{ vars.CI_LANES != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          CI_LANES: ${{ vars.CI_LANES }}
          CI_LOAD_MAX: ${{ vars.CI_LOAD_MAX }}
        run: node scripts/ci-lane.mjs reclamar

  # Siempre corre lo liviano (docs:check + lint). Lo PESADO (build, tests, e2e) sólo si hay código.
  # Kill switch (`CI_PAUSED`) y draft: un PR en borrador no corre lo pesado, se corre al pasar a Ready.
  application:
    needs: changes
    if: ${{ vars.CI_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, platform-local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      # Guard de migraciones (MSF-682): el test del detector de DDL sin guard corre siempre
      # (es Node puro, sin base) para que la regresión no vuelva a colarse.
      - name: test:db:guard-migraciones
        run: pnpm test:db:guard-migraciones
      - run: pnpm estilos:check
      - name: test:estilos:sueltos
        run: pnpm test:estilos:sueltos
      # Los E2E no escriben directo en las tablas de solo lectura para service_role (migración 20270301110000).
      - run: pnpm e2e:escritura:check
      - name: test:e2e:escritura
        run: pnpm test:e2e:escritura
      - name: test:e2e:omitidos (guarda contra omisiones masivas del e2e)
        run: pnpm test:e2e:omitidos
      - name: ui:empresas:check (filtros y selectores de empresa con los componentes compartidos)
        run: pnpm ui:empresas:check
      - name: test:ui:empresas
        run: pnpm test:ui:empresas
      - name: prototipo:check (inventario del prototipo al día)
        run: pnpm prototipo:check
      - name: test:prototipo:inventario
        run: pnpm test:prototipo:inventario
      - name: matriz:check (spec con UI declara la matriz pantalla↔criterios)
        run: pnpm matriz:check
      - name: test:matriz:pantalla
        run: pnpm test:matriz:pantalla
      - run: pnpm lint
      # El e2e sirve `apps/web/dist`. Además de cuando cambia código, se buildea si el
      # diff toca la app web sin ser "código" por extensión (p. ej. `apps/web/nginx.conf`):
      # si no, el build se saltea y el e2e falla por dist ausente.
      - name: build
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.web == 'true'
        run: pnpm build
      - name: test:ia
        if: needs.changes.outputs.code == 'true'
        run: pnpm test:ia
      - name: test:auth:hook-bloqueo
        if: needs.changes.outputs.code == 'true'
        run: pnpm test:auth:hook-bloqueo
      - name: test:openapi (contratos y guard de rompimiento)
        if: needs.changes.outputs.code == 'true'
        run: pnpm test:openapi
      - name: test:edge:api-v1 y entregar-webhook
        if: needs.changes.outputs.code == 'true'
        run: pnpm test:edge:api-v1 && pnpm test:edge:entregar-webhook
      - name: test:kestra:webhooks
        if: needs.changes.outputs.code == 'true'
        run: pnpm test:kestra:webhooks
      # E2E de la app (MSF-499): build + chromium (+ deps del SO) + specs públicos. Los browsers se cachean
      # (`~/.cache/ms-playwright`): el `install` es de lo más lento y el binario no cambia entre runs.
      # SÓLO al integrar la épica (`e2e`): ver docs/deployment.md.
      - uses: actions/cache@v4
        if: needs.changes.outputs.web == 'true' && needs.changes.outputs.e2e == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: playwright install
        if: needs.changes.outputs.web == 'true' && needs.changes.outputs.e2e == 'true'
        run: |
          if ls "$HOME"/.cache/ms-playwright/chromium-* >/dev/null 2>&1; then
            # El cache guarda el BINARIO, no las libs del SO. En un runner self-hosted sin
            # libglib-2.0 (el browser muere con "error while loading shared libraries") hay que
            # instalar SIEMPRE las deps del SO, aun con cache hit. Antes se salteaban y el e2e
            # fallaba en PRs que no tenían nada que ver (falso rojo).
            echo "chromium en cache -> binario + deps del SO"
            pnpm --filter @platform/web exec playwright install chromium
            pnpm --filter @platform/web exec playwright install-deps chromium
          else
            pnpm --filter @platform/web exec playwright install --with-deps chromium
          fi
      - name: test:e2e
        if: needs.changes.outputs.web == 'true' && needs.changes.outputs.e2e == 'true'
        run: |
          echo "WEB_PORT=$((4400 + GITHUB_RUN_ID % 100))" >> "$GITHUB_ENV"
          # Sin `--`: el de `pnpm run` llega literal a Playwright y todo lo que sigue se toma como argumento posicional
          # (no como filtro de archivo), así que antes corría los 103 specs. `exec playwright test <archivo>` filtra de verdad.
          pnpm --filter @platform/web exec playwright test acceso-publico.e2e.ts
      # Un job cancelado o que agota el timeout puede dejar Chromium/Playwright
      # huérfanos dentro del runner (PPID 1). El paso corre con `always()` para
      # matarlos también cuando el job falla o se cancela. Los corchetes evitan
      # que `pkill` mate su propio shell (su cmdline contiene el patrón).
      - name: Limpiar navegadores del job
        if: always()
        timeout-minutes: 2
        run: |
          patron='[c]hrome-headless|[c]hromium|[h]eadless_shell|/[m]s-playwright/'
          antes=$(pgrep -fc "$patron" || true)
          pkill -9 -f "$patron" 2>/dev/null || true
          despues=$(pgrep -fc "$patron" || true)
          echo "Navegadores del job: antes=$antes despues=$despues"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results

  # #1 — La suite web (el 80% del tiempo) se corre SHARDEADA en paralelo. `invitar-miembro` sólo en el shard 1.
  # Sólo cuando el diff puede afectar a la app web (dirs de supabase/infra/scripts/api no la tocan) y SÓLO en el
  # cierre de la épica (`e2e`): en una historia se valida en la épica. Ver docs/deployment.md.
  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' && needs.changes.outputs.e2e == 'true' && vars.CI_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, platform-local]
    # MSF-237: los 3 shards llegaban a ~30 min y el timeout los mataba mientras seguían avanzando
    # (no había test rojo). La suite completa tarda ~30 min; con 3 shards reales cada job baja a
    # ~10-15 min. 45 min es sólo la red de seguridad (si un shard se cuelga, no espera una hora).
    # Más de 3 shards NO ayuda: la máquina (8 núcleos, load ~30) está limitada por CPU, no por tramos.
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          # En un PR hace falta el historial para calcular qué tests afecta el diff (`--changed`).
          # OJO: '0' va entre comillas. En una expresión `a && 0 || 1`, el 0 es falso y siempre daría 1 (clon superficial).
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Reusa el store de pnpm entre corridas: ahorra el costo fijo de `pnpm install` en cada tramo.
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: web tests (shard ${{ matrix.shard }}/3)
        # `exec` pasa el flag DIRECTO al binario. Con `pnpm test -- --shard=N/3`, el `--`
        # corta el parseo y vitest toma `--shard=N/3` como filtro posicional: cada shard
        # corría la suite COMPLETA (3x carga) y moría por timeout (MSF-237/AGE-1049).
        # En un PR corren SOLO los tests afectados por el diff (grafo de imports de vitest; un cambio de
        # config o de package.json dispara la suite completa). La suite COMPLETA corre en el push a
        # `dokploy`/`main`/`staging`, en el cierre de la épica y en `merge_group`. Ver docs/control-ci.md.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
            echo "PR: solo los tests afectados desde $BASE"
            pnpm --filter @platform/web exec vitest run --changed "$BASE" --passWithNoTests --shard=${{ matrix.shard }}/3
          else
            pnpm --filter @platform/web exec vitest run --shard=${{ matrix.shard }}/3
          fi
      - name: edge tests (invitar-miembro)
        if: matrix.shard == 1
        run: pnpm test:edge:invitar-miembro && pnpm test:edge:invitar-cliente && pnpm test:edge:recuperar-clave-cliente && pnpm test:edge:baja-correo-masivo && pnpm test:edge:tienda-seo
      - name: Limpiar navegadores del job
        if: always()
        timeout-minutes: 2
        run: |
          patron='[c]hrome-headless|[c]hromium|[h]eadless_shell|/[m]s-playwright/'
          antes=$(pgrep -fc "$patron" || true)
          pkill -9 -f "$patron" 2>/dev/null || true
          despues=$(pgrep -fc "$patron" || true)
          echo "Navegadores del job: antes=$antes despues=$despues"

  # E2E de la TIENDA PÚBLICA (`apps/web/e2e/tienda-*.e2e.ts`, 20 specs). A diferencia de `acceso-publico` (que
  # corre en `application` sin base), estos recorridos siembran con la service-role desde Node y la web lee de
  # PostgREST, así que necesitan un stack de Supabase con API (auth + kong + postgrest + storage). Es un job
  # APARTE (y no un paso de `application`) para correr en paralelo con la suite `web` y no alargar el camino
  # crítico; reusa la RANURA del stack del CI (`scripts/supabase-ci.mjs`) igual que `database`, así que no suma
  # puertos ni stacks de desarrollo. Mismo disparo que el e2e: sólo si el diff toca la web y NO en historias de
  # épica (`e2e`). Detalle y límites (sin Edge Runtime) en docs/e2e-app.md.
  e2e-tienda:
    needs: changes
    # `CI_E2E_TIENDA=false` lo apaga (kill switch). `E2E_TIENDA_BLOQUEA` decide si bloquea: mientras no sea `true`,
    # `continue-on-error` hace que un fallo (o no conseguir ranura) llegue como `success` a `validacion` y `liberar`,
    # y el job se ve rojo sin frenar el merge. Se pasa a requerido poniendo la variable en `true` tras ~10 corridas
    # verdes (seguimiento en specs/20261113-120000-ci-e2e-tienda/tasks.md). Sin PRs de forks: ver el filtro de `application`.
    if: ${{ needs.changes.outputs.web == 'true' && needs.changes.outputs.e2e == 'true' && vars.CI_PAUSED != 'true' && vars.CI_E2E_TIENDA != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, platform-local]
    continue-on-error: ${{ vars.E2E_TIENDA_BLOQUEA != 'true' }}
    # Stack (~2-3 min) + migraciones (~1-2 min) + 20 specs en serie (~10-15 min con la máquina cargada) + hasta 10 min
    # esperando ranura. El TTL de la ranura (`SUPABASE_CI_LOCK_TTL_MIN`, abajo y en `database`) va por encima del timeout
    # para que otro job no recicle esta ranura mientras el job sigue vivo; un job muerto sin `liberar` la suelta a los 75 min.
    timeout-minutes: 55
    env:
      SUPABASE_CI_LOCK_TTL_MIN: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Supabase CLI (2.116.0; reusa el del runner si ya está)
        run: |
          if command -v supabase >/dev/null 2>&1 && supabase --version 2>/dev/null | grep -q '2.116.0'; then
            echo "supabase 2.116.0 ya presente en el runner -> no descargo"
          else
            curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_2.116.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin supabase
          fi
          supabase --version
      # Espera a lo sumo 10 min por una ranura (el default de `database` es 20): sin ranura el job falla y, como no
      # bloquea (`E2E_TIENDA_BLOQUEA`), el PR sigue; ya bloqueante, ese fallo es el costo de no oversuscribir el host.
      - name: Reservar la ranura del stack de Supabase
        env:
          SUPABASE_CI_LOCK_MIN: 10
        run: node scripts/supabase-ci.mjs reclamar
      - run: pnpm db:ci:preparar
      # Sin `edge-runtime` (monta el directorio de funciones del checkout, que no existe en el Docker del host:
      # docker-fuera-de-docker) ni `realtime`, `mailpit`, etc.: ningún spec de la tienda los usa salvo el caso
      # de `robots.txt`/`sitemap.xml` de `tienda-seo`, que se omite con `E2E_SIN_EDGE=1` (su handler se prueba
      # con `test:edge:tienda-seo` en el job `web`). Con `kong` y `postgrest`, a diferencia de `database`.
      # `--ignore-health-check`: PostgREST arranca ANTES de que las migraciones creen `dominio` y no queda sano
      # hasta que se las aplica, así que se lo reinicia después de `db:reset:ci`. La ranura puede venir con el
      # stack de `database` (sin kong/postgrest): se lo baja antes para arrancar de cero.
      - name: Levantar el stack de Supabase del CI con API
        run: |
          node scripts/supabase-ci.mjs puente &
          trap "kill \$!" EXIT
          for intento in $(seq 50); do (: > "/dev/tcp/127.0.0.1/$SUPABASE_DB_PORT") 2>/dev/null && break; sleep 0.2; done
          supabase stop --workdir "$SUPABASE_CI_WORKDIR" --no-backup || true
          supabase start --workdir "$SUPABASE_CI_WORKDIR" --ignore-health-check -x studio,mailpit,imgproxy,logflare,vector,edge-runtime,supavisor,realtime,postgres-meta
      - run: pnpm db:reset:ci
      # Las claves salen del propio stack (`supabase status -o env`), nunca de git. Dentro del contenedor del
      # runner `127.0.0.1` es el propio contenedor: la API del stack (publicada en el Docker del host) se alcanza
      # por `host.docker.internal`, tanto desde Node (siembra) como desde Chromium (la web del build).
      - name: Reiniciar PostgREST, esperar la API y exponer el entorno
        run: |
          docker restart "supabase_rest_${SUPABASE_CI_PROJECT_ID}"
          eval "$(supabase status -o env --workdir "$SUPABASE_CI_WORKDIR" | sed 's/^/export /')"
          URL="${API_URL/127.0.0.1/host.docker.internal}"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          # Espera (hasta 2 min) a que cada servicio que usan los specs responda 200 por kong: PostgREST (recién
          # reiniciado), Auth (login del panel) y Storage (imágenes de `tienda-ficha`).
          esperar() {
            codigo=000
            for intento in $(seq 60); do
              codigo=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $ANON_KEY" "$URL$2" || true)
              [ "$codigo" = "200" ] && return 0
              sleep 2
            done
            echo "$1 no respondió 200 en $URL$2 (último: $codigo)"
            return 1
          }
          esperar PostgREST /rest/v1/ || { docker logs --tail 40 "supabase_rest_${SUPABASE_CI_PROJECT_ID}" || true; exit 1; }
          esperar Auth /auth/v1/health || { docker logs --tail 40 "supabase_auth_${SUPABASE_CI_PROJECT_ID}" || true; exit 1; }
          esperar Storage /storage/v1/status || { docker logs --tail 40 "supabase_storage_${SUPABASE_CI_PROJECT_ID}" || true; exit 1; }
          # Esquema `dominio` visible y seed aplicado: las dos tiendas de supabase/seed.sql.
          tiendas=$(curl -fsS -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "Accept-Profile: dominio" "$URL/rest/v1/tiendas?select=dominio")
          echo "tiendas sembradas: $tiendas"
          case "$tiendas" in *mundojc.localhost*sanjavucho.localhost*|*sanjavucho.localhost*mundojc.localhost*) ;; *) echo "Faltan las tiendas del seed"; exit 1 ;; esac
          {
            echo "SUPABASE_URL=$URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_SUPABASE_URL=$URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "VITE_PANEL_HOSTS=localhost,127.0.0.1"
            echo "E2E_SIN_EDGE=1"
            # Solo este job: activa las guardas que hacen FALLAR (en vez de omitir) lo que depende del build/stack de la tienda.
            echo "E2E_TIENDA_CI=1"
            echo "WEB_PORT=$((4400 + GITHUB_RUN_ID % 100))"
          } >> "$GITHUB_ENV"
      # Sólo `vite build`: el type-check (`tsc -b`) ya lo corre `pnpm build` en el job `application`.
      # `VITE_PANEL_HOSTS`: sin él el panel se sirve en `mundojc.localhost` y las tiendas no se resuelven.
      - name: build de la web contra el stack del CI
        run: pnpm --filter @platform/web exec vite build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: playwright install
        run: |
          if ls "$HOME"/.cache/ms-playwright/chromium-* >/dev/null 2>&1; then
            # El cache guarda el BINARIO, no las libs del SO: ver el paso homónimo del job `application`.
            echo "chromium en cache -> binario + deps del SO"
            pnpm --filter @platform/web exec playwright install chromium
            pnpm --filter @platform/web exec playwright install-deps chromium
          else
            pnpm --filter @platform/web exec playwright install --with-deps chromium
          fi
      # Los specs de la tienda cambian el estado de las dos tiendas del seed (pausan una empresa, editan sus datos):
      # UN worker, en serie. `--workers=1` va antes de los filtros y SIN `--` (el `--` de pnpm llega literal a
      # Playwright y lo que sigue se toma como filtro posicional). El filtro `e2e/tienda-` toma sólo los 20 specs.
      - name: test:e2e (tienda-*)
        timeout-minutes: 30
        run: pnpm --filter @platform/web exec playwright test --workers=1 e2e/tienda-
      # 18 specs se omiten solos si faltan `SUPABASE_URL`/`SUPABASE_SERVICE_ROLE_KEY` y Playwright lo cuenta como éxito:
      # el único omitido permitido es el de `tienda-seo` (`E2E_SIN_EDGE=1`). Lee `apps/web/resultado-e2e.json`.
      - name: Verificar que no haya omisiones inesperadas
        run: pnpm e2e:omitidos:check apps/web/resultado-e2e.json --max=1
      # Mismo motivo que en `application`: Chromium huérfano si el job se cancela o agota el timeout.
      - name: Limpiar navegadores del job
        if: always()
        timeout-minutes: 2
        run: |
          patron='[c]hrome-headless|[c]hromium|[h]eadless_shell|/[m]s-playwright/'
          antes=$(pgrep -fc "$patron" || true)
          pkill -9 -f "$patron" 2>/dev/null || true
          despues=$(pgrep -fc "$patron" || true)
          echo "Navegadores del job: antes=$antes despues=$despues"
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-report-tienda
          retention-days: 7
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/resultado-e2e.json
      # Se baja el stack (con sus volúmenes) para no dejar kong/postgrest/auth/storage de la corrida en el Docker
      # del host, y se suelta la ranura. Si el job muere sin llegar acá, el TTL de la ranura la recicla y el
      # próximo `reclamar` + `supabase stop` del paso de arranque limpian los contenedores. Caso marginal: una
      # cancelación forzada del runner (o un reinicio del host) no ejecuta ni los pasos `always()`: los contenedores
      # `ci-…` de la ranura quedan arriba y la ranura ocupada hasta el TTL de 75 min; limpiar-ci y el próximo job de
      # esa ranura los bajan, y se pueden bajar a mano con `docker ps --filter name=supabase_ | grep ci-`.
      - name: Bajar el stack y liberar la ranura
        if: always()
        run: |
          if [ -n "$SUPABASE_CI_WORKDIR" ]; then
            supabase stop --workdir "$SUPABASE_CI_WORKDIR" --no-backup || true
          fi
          node scripts/supabase-ci.mjs liberar

  infrastructure:
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, platform-local]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm infra:config
      - name: tests de control de CI (carriles, estado, janitor)
        run: pnpm test:ci
      # Verificación de la fuga de AGE-1311: falla si algún runner acumula más
      # navegadores huérfanos que el umbral. No mata nada; el janitor limpia.
      - name: Navegadores huérfanos de los runners
        run: node scripts/limpiar-ci.mjs --verificar

  database:
    needs: changes
    if: ${{ needs.changes.outputs.db == 'true' && vars.CI_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, platform-local]
    # Sin `concurrency`: cada corrida reserva su RANURA del stack (scripts/supabase-ci.mjs reclamar) y
    # ESPERA si no hay libre, en vez de que GitHub cancele la corrida pendiente (BUG-179). El timeout
    # acota el job para que un lock huérfano (job que murió sin `liberar`) se recicle al TTL. El TTL va a 75 min (igual
    # que en `e2e-tienda`, cuyo timeout es 55): el que reclama es quien recicla, así que todos los jobs que comparten
    # ranuras usan el mismo TTL, por encima del mayor timeout.
    timeout-minutes: 40
    env:
      SUPABASE_CI_LOCK_TTL_MIN: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Supabase CLI (2.116.0; reusa el del runner si ya está)
        run: |
          if command -v supabase >/dev/null 2>&1 && supabase --version 2>/dev/null | grep -q '2.116.0'; then
            echo "supabase 2.116.0 ya presente en el runner -> no descargo"
          else
            curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_2.116.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin supabase
          fi
          supabase --version
      - run: node --test scripts/supabase-ci.test.mjs
      - name: Reservar la ranura del stack de Supabase
        run: node scripts/supabase-ci.mjs reclamar
      - run: pnpm db:ci:preparar
      - name: Levantar el stack de Supabase del CI
        run: |
          node scripts/supabase-ci.mjs puente &
          trap "kill \$!" EXIT
          for intento in $(seq 50); do (: > "/dev/tcp/127.0.0.1/$SUPABASE_DB_PORT") 2>/dev/null && break; sleep 0.2; done
          supabase start --workdir "$SUPABASE_CI_WORKDIR" -x studio,mailpit,imgproxy,logflare,vector,edge-runtime,supavisor,realtime,postgres-meta,kong,postgrest
      - run: pnpm db:reset:ci
      - run: pnpm test:db:ci
      - name: Liberar la ranura del stack de Supabase
        if: always()
        run: node scripts/supabase-ci.mjs liberar

  # Suelta el carril del PR (si la admisión está activa). Corre siempre, incluso
  # si lo pesado falló o se salteó; el TTL recicla el carril si el run se cancela.
  liberar:
    needs: [changes, application, web, e2e-tienda, infrastructure, database]
    if: ${{ always() && vars.CI_LANES != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, platform-local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Liberar carril de admisión
        env:
          CI_LANE: ${{ needs.changes.outputs.lane }}
          CI_LANES: ${{ vars.CI_LANES }}
        run: node scripts/ci-lane.mjs liberar

  # Check ÚNICO requerido por el ruleset de `dokploy`: siempre corre y falla si
  # algún job falló o se canceló. Los jobs skipped (p. ej. `web` en un PR de
  # docs, o `database` sin cambios de Supabase) cuentan como OK. Con `CI_PAUSED`
  # falla a propósito: mientras el CI está pausado no se mergea.
  validacion:
    needs: [changes, application, web, e2e-tienda, infrastructure, database]
    if: always()
    runs-on: [self-hosted, platform-local]
    timeout-minutes: 5
    steps:
      - name: Verificar que nada haya fallado
        env:
          EVENTO: ${{ github.event_name }}
          REPO_ORIGEN: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          # Los PRs de forks no corren en los runners self-hosted (los jobs pesados los saltean): sin esto
          # `validacion` daría verde con todo `skipped`. Hay que re-publicar la rama dentro del repo.
          if [ "$EVENTO" = "pull_request" ] && [ "$REPO_ORIGEN" != "$REPO" ]; then
            echo "PR de un fork: no se valida en runners self-hosted; publicá la rama en este repo."
            exit 1
          fi
          if [ "${{ vars.CI_PAUSED }}" = "true" ]; then
            echo "CI_PAUSED=true: no se valida ni se mergea mientras el CI esté pausado."
            exit 1
          fi
          fallo=0
          for resultado in \
            "changes=${{ needs.changes.result }}" \
            "application=${{ needs.application.result }}" \
            "web=${{ needs.web.result }}" \
            "e2e-tienda=${{ needs.e2e-tienda.result }}" \
            "infrastructure=${{ needs.infrastructure.result }}" \
            "database=${{ needs.database.result }}"; do
            echo "$resultado"
            case "$resultado" in
              *=success|*=skipped) ;;
              *) fallo=1 ;;
            esac
          done
          if [ "$fallo" = "1" ]; then
            echo "Hay jobs fallidos o cancelados: no se valida."
            exit 1
          fi
          echo "Validación OK (los jobs skipped cuentan como OK)."
