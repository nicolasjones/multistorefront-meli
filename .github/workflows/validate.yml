name: Validate

on:
  pull_request:
  push:
    branches: [main, staging]
  # Manual: corre el CI y deja los artefactos de E2E (reporte + videos/trazas) para revisar.
  workflow_dispatch:
    inputs:
      e2e_record:
        description: "Grabar video + traza de TODOS los E2E (más pesado)"
        type: boolean
        default: true
      e2e_sesion:
        description: "Incluir E2E con sesión (levanta Supabase del CI; más pesado)"
        type: boolean
        default: false

permissions:
  contents: read

# Un push NUEVO a la misma rama/PR CANCELA el run anterior del mismo PR (no se acumulan runs compitiendo
# por los runners). El job `database` conserva su propio `concurrency` (por repo, sin cancelar).
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #2 — Clasifica el diff: si el PR NO toca código (sólo docs/specs/md/.github), NO se corre el CI pesado.
  # Además calcula `web`: si el diff SÓLO toca dirs que NO afectan a la app web (supabase/, infra/, scripts/,
  # apps/api/, docs/, specs/) la suite web + e2e se saltean. CONSERVADOR: `web` es true por defecto y sólo se
  # apaga cuando TODOS los archivos cambiados caen en esos dirs (cualquier archivo desconocido o de raíz lo
  # vuelve a prender). `apps/web` depende de `@platform/ia`, por eso `packages/**` cuenta como web.
  changes:
    runs-on: [self-hosted, platform-local]
    outputs:
      code: ${{ steps.d.outputs.code }}
      db: ${{ steps.d.outputs.db }}
      web: ${{ steps.d.outputs.web }}
      infra: ${{ steps.d.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          git fetch -q origin "${BASE#origin/}" 2>/dev/null || true
          FILES=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || git diff --name-only HEAD~1 2>/dev/null || echo "")
          echo "== archivos =="; printf '%s\n' "$FILES"
          CODE=$(printf '%s\n' "$FILES" | grep -vE '^(docs/|specs/|design/|\.github/)|\.(md|txt)$' | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|sql|py|json|ya?ml|toml|sh|css|html)$' | head -1)
          DB=$(printf '%s\n' "$FILES" | grep -E '^supabase/' | head -1)
          # web=true salvo que TODOS los archivos estén en dirs que no afectan a la app web.
          WEB=$(printf '%s\n' "$FILES" | grep -vE '^$' | grep -vE '^(docs/|specs/|design/|supabase/|infra/|scripts/|apps/api/|\.github/)' | head -1)
          # infra=true sólo si toca infra/ o scripts/ (el job `infrastructure` valida la config de infra).
          INFRA=$(printf '%s\n' "$FILES" | grep -E '^(infra/|scripts/)' | head -1)
          # Run manual con "Grabar video + traza": forzar web=true aunque no haya diff (corre build + e2e).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.e2e_record }}" = "true" ]; then
            WEB="manual"
            CODE="manual"   # fuerza el build: el e2e corre contra `vite preview` del build
          fi
          echo "code=$([ -n "$CODE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "db=$([ -n "$DB" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -n "$WEB" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "infra=$([ -n "$INFRA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Siempre corre lo liviano (docs:check + lint). Lo PESADO (build, tests, e2e) sólo si hay código.
  application:
    needs: changes
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm estilos:check
      - name: test:estilos:sueltos
        run: pnpm test:estilos:sueltos
      - name: prototipo:check (inventario del prototipo al día)
        run: pnpm prototipo:check
      - name: test:prototipo:inventario
        run: pnpm test:prototipo:inventario
      - name: matriz:check (spec con UI declara la matriz pantalla↔criterios)
        run: pnpm matriz:check
      - name: test:matriz:pantalla
        run: pnpm test:matriz:pantalla
      - run: pnpm lint
      - name: build
        if: needs.changes.outputs.code == 'true'
        run: pnpm build
      - name: test:ia
        if: needs.changes.outputs.code == 'true'
        run: pnpm test:ia
      - name: test:auth:hook-bloqueo
        if: needs.changes.outputs.code == 'true'
        run: pnpm test:auth:hook-bloqueo
      # E2E de la app (MSF-499): build + chromium (+ deps del SO) + specs públicos. Los browsers se cachean
      # (`~/.cache/ms-playwright`): el `install` es de lo más lento y el binario no cambia entre runs.
      - uses: actions/cache@v4
        if: needs.changes.outputs.web == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: playwright install
        if: needs.changes.outputs.web == 'true'
        run: |
          if ls "$HOME"/.cache/ms-playwright/chromium-* >/dev/null 2>&1; then
            echo "chromium en cache -> sólo asegurar binario"
            pnpm --filter @platform/web exec playwright install chromium
          else
            pnpm --filter @platform/web exec playwright install --with-deps chromium
          fi
      - name: test:e2e
        if: needs.changes.outputs.web == 'true'
        env:
          # En un run manual, el checkbox "Grabar video + traza" graba todo; en PR, sólo lo que falla.
          E2E_VIDEO: ${{ inputs.e2e_record && 'on' || '' }}
          E2E_TRACE: ${{ inputs.e2e_record && 'on' || '' }}
          # Con grabación manual, recorrido visible: cursor gigante, rótulos y cámara lenta.
          E2E_VISIBLE: ${{ inputs.e2e_record && '1' || '' }}
        run: |
          echo "WEB_PORT=$((4400 + GITHUB_RUN_ID % 100))" >> "$GITHUB_ENV"
          # Sin `--` intermedio: pnpm lo reenviaría y Playwright lo tomaría como
          # separador (los --reporter llegarían como filtros de archivo, no opciones).
          # El reporte JSON (`e2e-report.json`) sale de la config en CI.
          pnpm test:e2e acceso-publico.e2e.ts recorrido-publico.e2e.ts
      # Manifiesto de cobertura E2E por historia (spec 022): se adjunta al
      # artefacto y, si hay secreto configurado, se sube al bucket con los videos.
      # Manifiesto adjunto al artefacto (el visor /cobertura-e2e lo lee del
      # bucket cuando hay secretos; si no, ver videos en el artefacto).
      - name: cobertura:e2e
        if: always() && needs.changes.outputs.web == 'true'
        env:
          EVIDENCIAS_E2E_URL: ${{ secrets.EVIDENCIAS_E2E_URL }}
          EVIDENCIAS_E2E_SERVICE_ROLE_KEY: ${{ secrets.EVIDENCIAS_E2E_SERVICE_ROLE_KEY }}
        run: |
          node scripts/cobertura-e2e.mjs --report apps/web/e2e-report.json --results apps/web/test-results --specs specs --out apps/web/playwright-report/cobertura-e2e.json --run-id "${GITHUB_RUN_ID}" --modo "${{ inputs.e2e_record && 'on' || 'retain' }}"
          node scripts/subir-evidencias-e2e.mjs --manifiesto apps/web/playwright-report/cobertura-e2e.json --videos apps/web/test-results --run-id "${GITHUB_RUN_ID}"
      - name: resumen e2e (dónde ver la corrida)
        if: always()
        run: |
          {
            echo "### E2E — cómo ver la corrida"
            echo "- **Reporte HTML:** artefacto \`playwright-report\` (pestaña Artifacts de este run)."
            echo "- **Videos y trazas:** artefacto \`test-results\` (se conservan también si el test pasa)."
            echo "- **Abrir localmente:** \`npx playwright show-report <carpeta>\` o \`npx playwright show-trace <trace.zip>\`."
            echo "- **Grabar todo:** localmente \`pnpm test:e2e:record\`; UI interactiva: \`pnpm test:e2e:ui\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore

  # E2E con sesión en modo visible (spec 022): solo manual (inputs.e2e_sesion).
  # Levanta el stack Supabase del CI, siembra via los propios tests, graba el
  # recorrido con cursor gigante y rótulos, y deja videos + manifiesto en el
  # artefacto `playwright-report-sesion`. Sin el secreto del bucket no sube.
  e2e-visible-sesion:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e_sesion
    runs-on: [self-hosted, platform-local]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Supabase CLI (2.116.0; reusa el del runner si ya está)
        run: |
          if command -v supabase >/dev/null 2>&1 && supabase --version 2>/dev/null | grep -q '2.116.0'; then
            echo "supabase 2.116.0 ya presente en el runner -> no descargo"
          else
            curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_2.116.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin supabase
          fi
          supabase --version
      - run: pnpm db:ci:preparar
      - name: Levantar el stack de Supabase del CI (con kong/postgrest para la app)
        run: |
          node scripts/supabase-ci.mjs puente &
          trap "kill \$!" EXIT
          for intento in $(seq 50); do (: > "/dev/tcp/127.0.0.1/$SUPABASE_DB_PORT") 2>/dev/null && break; sleep 0.2; done
          supabase start --workdir "$SUPABASE_CI_WORKDIR" -x studio,mailpit,imgproxy,logflare,vector,edge-runtime,supavisor,realtime,postgres-meta
      - run: pnpm db:reset:ci
      - name: Exponer claves al build y a los specs
        run: |
          eval "$(supabase status -o env --workdir "$SUPABASE_CI_WORKDIR" | sed 's/^/export /')"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}" >> "$GITHUB_ENV"
      - name: build (con Supabase del CI)
        run: pnpm build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: playwright install
        run: |
          if ls "$HOME"/.cache/ms-playwright/chromium-* >/dev/null 2>&1; then
            echo "chromium en cache -> sólo asegurar binario"
            pnpm --filter @platform/web exec playwright install chromium
          else
            pnpm --filter @platform/web exec playwright install --with-deps chromium
          fi
      - name: test:e2e con sesión (visible)
        env:
          E2E_VIDEO: 'on'
          E2E_TRACE: 'on'
          E2E_VISIBLE: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/apps/web/e2e-report.json
        run: |
          echo "WEB_PORT=$((4500 + GITHUB_RUN_ID % 100))" >> "$GITHUB_ENV"
          pnpm test:e2e permisos-por-empresa.e2e.ts
      - name: cobertura:e2e (sesión)
        if: always()
        env:
          EVIDENCIAS_E2E_URL: ${{ secrets.EVIDENCIAS_E2E_URL }}
          EVIDENCIAS_E2E_SERVICE_ROLE_KEY: ${{ secrets.EVIDENCIAS_E2E_SERVICE_ROLE_KEY }}
        run: |
          node scripts/cobertura-e2e.mjs --report apps/web/e2e-report.json --results apps/web/test-results --specs specs --out apps/web/playwright-report/cobertura-e2e.json --run-id "${GITHUB_RUN_ID}" --modo on
          node scripts/subir-evidencias-e2e.mjs --manifiesto apps/web/playwright-report/cobertura-e2e.json --videos apps/web/test-results --run-id "${GITHUB_RUN_ID}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-sesion
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore

  # #1 — La suite web (el 80% del tiempo) se corre SHARDEADA en paralelo. `invitar-miembro` sólo en el shard 1.
  # Sólo cuando el diff puede afectar a la app web (dirs de supabase/infra/scripts/api no la tocan).
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: [self-hosted, platform-local]
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: web tests (shard ${{ matrix.shard }}/3)
        run: pnpm --filter @platform/web test -- --shard=${{ matrix.shard }}/3
      - name: edge tests (invitar-miembro)
        if: matrix.shard == 1
        run: pnpm test:edge:invitar-miembro

  infrastructure:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm infra:config

  database:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: [self-hosted, platform-local]
    concurrency:
      group: supabase-ci-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Supabase CLI (2.116.0; reusa el del runner si ya está)
        run: |
          if command -v supabase >/dev/null 2>&1 && supabase --version 2>/dev/null | grep -q '2.116.0'; then
            echo "supabase 2.116.0 ya presente en el runner -> no descargo"
          else
            curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_2.116.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin supabase
          fi
          supabase --version
      - run: node --test scripts/supabase-ci.test.mjs
      - run: pnpm db:ci:preparar
      - name: Levantar el stack de Supabase del CI
        run: |
          node scripts/supabase-ci.mjs puente &
          trap "kill \$!" EXIT
          for intento in $(seq 50); do (: > "/dev/tcp/127.0.0.1/$SUPABASE_DB_PORT") 2>/dev/null && break; sleep 0.2; done
          supabase start --workdir "$SUPABASE_CI_WORKDIR" -x studio,mailpit,imgproxy,logflare,vector,edge-runtime,supavisor,realtime,postgres-meta,kong,postgrest
      - run: pnpm db:reset:ci
      - run: pnpm test:db:ci
