name: Validate

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

# Un push NUEVO a la misma rama/PR CANCELA el run anterior del mismo PR (no se acumulan runs compitiendo
# por los runners). El job `database` conserva su propio `concurrency` (por repo, sin cancelar).
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #2 — Clasifica el diff: si el PR NO toca código (sólo docs/specs/md/.github), NO se corre el CI pesado.
  changes:
    runs-on: [self-hosted, platform-local]
    outputs:
      code: ${{ steps.d.outputs.code }}
      db: ${{ steps.d.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          git fetch -q origin "${BASE#origin/}" 2>/dev/null || true
          FILES=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || git diff --name-only HEAD~1 2>/dev/null || echo "")
          echo "== archivos =="; printf '%s\n' "$FILES"
          CODE=$(printf '%s\n' "$FILES" | grep -vE '^(docs/|specs/|\.github/)|\.(md|txt)$' | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|sql|py|json|ya?ml|toml|sh|css|html)$' | head -1)
          DB=$(printf '%s\n' "$FILES" | grep -E '^supabase/' | head -1)
          echo "code=$([ -n "$CODE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "db=$([ -n "$DB" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Siempre corre lo liviano (docs:check + lint). Lo PESADO (build, tests, e2e) sólo si hay código.
  application:
    needs: changes
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm lint
      - name: build
        if: needs.changes.outputs.code == 'true'
        run: pnpm build
      - name: test:ia
        if: needs.changes.outputs.code == 'true'
        run: pnpm test:ia
      - name: test:auth:hook-bloqueo
        if: needs.changes.outputs.code == 'true'
        run: pnpm test:auth:hook-bloqueo
      # E2E de la app (MSF-499): build + chromium (+ deps del SO) + specs públicos.
      - name: playwright install
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @platform/web exec playwright install --with-deps chromium
      - name: test:e2e
        if: needs.changes.outputs.code == 'true'
        run: |
          echo "WEB_PORT=$((4400 + GITHUB_RUN_ID % 100))" >> "$GITHUB_ENV"
          pnpm test:e2e -- acceso-publico.e2e.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results

  # #1 — La suite web (el 80% del tiempo) se corre SHARDEADA en paralelo. `invitar-miembro` sólo en el shard 1.
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, platform-local]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: web tests (shard ${{ matrix.shard }}/3)
        run: pnpm --filter @platform/web test -- --shard=${{ matrix.shard }}/3
      - name: edge tests (invitar-miembro)
        if: matrix.shard == 1
        run: pnpm test:edge:invitar-miembro

  infrastructure:
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm infra:config

  database:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: [self-hosted, platform-local]
    concurrency:
      group: supabase-ci-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Instalar Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_2.116.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin supabase
          supabase --version
      - run: node --test scripts/supabase-ci.test.mjs
      - run: pnpm db:ci:preparar
      - name: Levantar el stack de Supabase del CI
        run: |
          node scripts/supabase-ci.mjs puente &
          trap "kill \$!" EXIT
          for intento in $(seq 50); do (: > "/dev/tcp/127.0.0.1/$SUPABASE_DB_PORT") 2>/dev/null && break; sleep 0.2; done
          supabase start --workdir "$SUPABASE_CI_WORKDIR" -x studio,mailpit,imgproxy,logflare,vector,edge-runtime,supavisor,realtime,postgres-meta,kong,postgrest
      - run: pnpm db:reset:ci
      - run: pnpm test:db:ci
