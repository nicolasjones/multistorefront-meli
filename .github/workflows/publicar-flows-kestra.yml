name: Publicar flows Kestra

# CI de publicación de flows del orquestador con gate staging-producción
# (spec 20261003-105444-cicd-staging-produccion). infra/kestra/desplegar-flow.mjs
# no cambia de código: ya acepta credenciales y URL por variable de entorno
# o flag. Publica todos los flows versionados en infra/kestra/flows/ (id y
# namespace se leen del propio YAML) contra el Kestra del entorno
# correspondiente. Ningún flow de este repo usa hoy un trigger Webhook con
# clave literal (--webhook-key-env de desplegar-flow.mjs) — si uno la
# necesitara en el futuro, este loop genérico no la resuelve por sí solo y
# habría que agregar un caso especial para ese flow puntual.
#
# Gate: `staging` dispara solo en push (automático); `production` solo se
# dispara manualmente desde la pestaña Actions ("Run workflow" →
# workflow_dispatch) — alternativa sin costo a GitHub Environment +
# required reviewers (plan de pago no disponible aquí). Decisión del
# coordinador, ver tasks.md T027. Los Environments se conservan para
# separar secrets por entorno; solo se cae la regla de required reviewers.
#
# Gate stg→prd (bug gate-migraciones-stg-prd, 2026-10-05): `production` no
# puede usar `needs: staging` (dispara por workflow_dispatch, no por push,
# nunca es la misma corrida). En su lugar, el primer step de `production`
# corre scripts/verificar-staging-exitoso.mjs contra la API de runs de
# GitHub Actions y exige un run de `staging` con conclusion=success para
# el mismo head_sha antes de tocar las credenciales de Kestra de
# producción. Mismo mecanismo que migraciones-cloud.yml.
#
# workflow_call (spec 20261005-140934-promover-todo-produccion): invocable
# desde promover-todo-a-produccion.yml — ver migraciones-cloud.yml para el
# detalle de por qué el job `production` acepta ambos eventos.

on:
  push:
    branches: [main]
    paths:
      - "infra/kestra/flows/**"
      - ".github/workflows/publicar-flows-kestra.yml"
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read
  actions: read

jobs:
  staging:
    if: github.event_name == 'push'
    runs-on: [self-hosted, platform-local]
    environment: publicar-flows-kestra-staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Publicar flows contra el Kestra de staging
        env:
          KESTRA_BASIC_AUTH_USERNAME: ${{ secrets.KESTRA_BASIC_AUTH_USERNAME }}
          KESTRA_BASIC_AUTH_PASSWORD: ${{ secrets.KESTRA_BASIC_AUTH_PASSWORD }}
          KESTRA_URL: ${{ secrets.KESTRA_PUBLIC_URL }}
        run: |
          set -euo pipefail
          for file in infra/kestra/flows/*.yml; do
            id=$(grep -m1 '^id:' "$file" | sed 's/^id: *//')
            namespace=$(grep -m1 '^namespace:' "$file" | sed 's/^namespace: *//')
            echo "Publicando $namespace/$id ($file)"
            node infra/kestra/desplegar-flow.mjs --source "$file" --namespace "$namespace" --flow-id "$id" --kestra-url "$KESTRA_URL"
          done

  production:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: [self-hosted, platform-local]
    environment: publicar-flows-kestra-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Exigir que staging haya corrido exitosamente para este commit
        run: pnpm ci:verificar-staging-exitoso -- --workflow publicar-flows-kestra.yml --head-sha "$GITHUB_SHA"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar flows contra el Kestra de producción
        env:
          KESTRA_BASIC_AUTH_USERNAME: ${{ secrets.KESTRA_BASIC_AUTH_USERNAME }}
          KESTRA_BASIC_AUTH_PASSWORD: ${{ secrets.KESTRA_BASIC_AUTH_PASSWORD }}
          KESTRA_URL: ${{ secrets.KESTRA_PUBLIC_URL }}
        run: |
          set -euo pipefail
          for file in infra/kestra/flows/*.yml; do
            id=$(grep -m1 '^id:' "$file" | sed 's/^id: *//')
            namespace=$(grep -m1 '^namespace:' "$file" | sed 's/^namespace: *//')
            echo "Publicando $namespace/$id ($file)"
            node infra/kestra/desplegar-flow.mjs --source "$file" --namespace "$namespace" --flow-id "$id" --kestra-url "$KESTRA_URL"
          done
